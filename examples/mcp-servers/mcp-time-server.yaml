apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: mcp-time-server
  namespace: default
spec:
  components:
    - name: mcp-time
      type: mcp-server
      properties:
        description: "MCP server that provides current time tools"
        image: public.ecr.aws/z0a4o2j5/mcp-time-server:latest
        port: 8000
        replicas: 1
        autoPromotionEnabled: true
        autoPromotionSeconds: 10
        scaleDownDelaySeconds: 30
        registerWithGateway: true
        env:
          - name: LOCAL_TIMEZONE
            value: UTC
        # Who may call this server at all, by agent ServiceAccount identity.
        # Requires PROPAGATE_CALLER_TOKEN=false on the calling agent, else the
        # gateway sees the end user's subject, not the agent's.
        #
        # MUTUALLY EXCLUSIVE WITH tokenExchange ON THIS SAME BACKEND, verified live:
        # the exchange policy below applies unconditionally to every caller of this
        # backend and tries to use whatever bearer token arrived as the RFC 8693
        # subject_token. An EKS ServiceAccount token is not a Keycloak-issued token,
        # so Keycloak rejects it outright with "invalid_request - Invalid token",
        # which surfaces at the gateway as mcp.method.name=initialize status=500
        # "http request failed: invalid request". Keycloak's standard token exchange
        # is internal-to-itself only; an EKS OIDC token can never be its subject_token.
        # So an agent calling under its OWN identity (this rule) and a server that
        # exchanges the CALLER's Keycloak identity (tokenExchange, below) are two
        # different consumption models for one backend — pick one.
        allowedAgents:
          - oap-assistant-a

        # --- OR, not AND, the block above ---
        #
        # RFC 8693 exchange at the gateway: the caller's Keycloak-issued token is
        # exchanged for one audienced to THIS server (aud=mcp-time) before the
        # request reaches it, so the server receives a token it can validate as its
        # own, per the MCP authorization spec. Needs the platform's exchange client
        # (crossplane-keycloak, exchange.enabled) and the caller's client to carry
        # that exchange client in its token audience (crossplane-keycloak,
        # exchange.callerClients) — both already enabled for mcp-client.
        # Verified end-to-end against live Keycloak: a user1 token through
        # mcp-client exchanges to aud=mcp-time exactly, sub preserved.
        #
        # tokenExchange: true
