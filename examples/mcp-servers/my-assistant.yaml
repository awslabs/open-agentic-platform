apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: my-assistant
  namespace: default
spec:
  components:
    - name: oap-assistant-a
      type: agent
      properties:
        description: "General purpose AI assistant with A2A protocol support"
        image: public.ecr.aws/z0a4o2j5/strands-agent:v1.3.0-caller-token
        replicas: 3
        registerWithGateway: true
        modelConfig:
          modelId: claude-sonnet
        mcpServers:
          - name: mcp-time
        # Present THIS AGENT's own identity to its MCP servers rather than
        # forwarding the caller's token. Required for mcp-time's allowedAgents
        # rule to match: that rule checks the agent's ServiceAccount subject, and
        # with the default (true) the gateway would see the end user instead.
        propagateCallerToken: false
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        scaleDownDelaySeconds: 30
        autoPromotionEnabled: true
        autoPromotionSeconds: 10
        systemMessage: |
          You are a helpful AI assistant with access to various tools and capabilities.
          You can help with general questions, data analysis, and task automation.
          Always be clear, concise, and helpful in your responses. When asked about time use the tools.
      traits:
        - type: gateway-identity
