# ServiceAccount for pod-attested.yaml, in its own file ON PURPOSE.
# eks-nitro-sandbox-genpolicy takes a POD manifest and exits 1 with
#   unsupported kind: ServiceAccount
# on a multi-document file, so the documented
#   genpolicy ... pod-attested.yaml
# could never have worked while these shared one file.
#
# Apply both:  kubectl apply -f serviceaccount-attested.yaml -f pod-attested.yaml
# The ServiceAccount the Pod Identity association attaches to. The pod holds no
# AWS credentials of its own; the association is what lets the guest get them.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: attested-demo
  labels:
    app.kubernetes.io/name: attested-demo
