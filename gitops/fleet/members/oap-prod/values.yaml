# Fleet member: oap-prod
#
# Registers the cluster with ArgoCD. The platform's git generator scans
# fleet/members/*/values.yaml and mints an ArgoCD cluster secret from this file;
# every addon ApplicationSet then fans out across those secrets.
#
# Registration is separate from provisioning. This file only registers; oap-prod is
# provisioned via KRO (fleet/spoke-values/tenants/default/kro-clusters/values.yaml)
# and also needs the trigger json at kro-clusters/clusters/oap-prod.json — all three,
# or the spoke silently does not exist.
#
# mode: externalSecret is required for KRO spokes: it reads oap-prod/config from Secrets
# Manager (written by the EksclusterWithVpc RGD) to populate aws_vpc_id / subnet / SG
# annotations. Omitting it defaults to "direct" mode (Crossplane spokes) — the secret
# never gets aws_vpc_id and the LBC crashloops on Auto Mode (can't reach IMDS).
mode: externalSecret
clusterName: oap-prod
labels:
  # Selects the addon tier at overlays/environments/prod, where agent_platform,
  # agent_core, agent_gateway, oam_components and agent_sandbox are enabled, so this
  # spoke receives the same agentic capabilities as dev against the prod tier.
  environment: prod
  tenant: default
  client_provisioner: keycloak
clients:
  - name: agentgateway          # → clientId "agentgateway-prod"
    type: confidential
    flows:
      - client_credentials
