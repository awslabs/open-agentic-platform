externalSecret:
  enabled: true
  labels:
    environment: control-plane
    tenant: control-plane

# No `overlay:` block here on purpose. The fleet-secret chart can stamp
# overlay_repo_* annotations from overlay.repoURL, or from hub.fleetRepoURL when
# overlay.useFleetRepo is true, but the platform's hub-fleet-secret ApplicationSet
# passes no hub.fleetRepoURL, so useFleetRepo had no effect. In OAP standalone the
# fleet repo IS this repo, and OAP deliberately does not layer it on itself as an
# overlay. A dedicated fleet repo (config `fleetRepo`) is picked up as the overlay
# by the platform and by `agentic:bootstrap` without any setting in this file.
# To use a separate overlay repo, set the hub's overlay_repo_url/revision/basepath.
