# KRO spoke provisioning values, tenant "default".
#
# WHY KRO RATHER THAN CROSSPLANE
# KRO is the engine that provisions the hub in this environment, and since the platform
# publishes aws_private_subnet_ids and aws_cluster_security_group_id from the RGD, a
# KRO-provisioned spoke gets the same EnvironmentConfig as a Crossplane-provisioned one.
# The Crossplane platform-cluster Composition cannot compose at all on Crossplane v2
# (v2.2.1 here): its six Usage bases declare protection.crossplane.io/v1beta1 Usage,
# which v2 made namespaced, with no namespace, so the composite fails with "an empty
# namespace may not be set when a resource name is provided" after ~7 of 35 resources.
# Tracked in #17.
#
# The clusters-kro ApplicationSet globs
# tenants/<tenant>/kro-clusters/clusters/*.json to decide WHICH spokes exist and reads
# the matching entry below for HOW to build each one. A spoke needs both, plus a fleet
# member under fleet/members/<name>/ so ArgoCD gets a cluster secret.
#
# Discovery follows the OVERLAY repo, not the fleet repo: clusters-kro resolves
# repoURL/revision/basepath as `or overlay_repo_* fleetRepo*`. If gitops/fleet/hub/
# values.yaml points the overlay at a tree without the trigger json, this file is never
# read and zero spokes are generated, silently. Keep them in step.
#
# The cluster name is used verbatim for the EKS cluster AND for every IAM role the RGD
# creates (<name>-cluster-role, <name>-cluster-node-role, <name>-argocd-capability-role).
# It does NOT need to carry resourcePrefix: the platform's cluster-mgmt-eks policy grants
# iam:PassRole by SERVICE (eks / capabilities.eks / pods.eks), not by role name. Before
# that fix a spoke whose name lacked the prefix failed CreateCluster with AccessDenied on
# iam:PassRole.
clusters:
  oap-dev:
    clusterName: oap-dev
    tenant: default
    # Selects overlays/environments/dev, where agent_platform is enabled.
    environment: dev
    # Load-bearing. An empty provider label makes the addon registry route this spoke to
    # the crossplane pod-identity chart, whose selector is provider NotIn [kro-ack] and
    # therefore matches an empty value, and that chart then 409-conflicts with the pod
    # identity associations the EksCluster RGD has already created.
    provider: "kro-ack"
    region: us-west-2
    # 1.37, matching the hub.
    #
    # ACTION REQUIRED IF YOUR oap-dev IS ALREADY LIVE ON 1.35. This value feeds ACK
    # Cluster.spec.version under adopt-or-create (appmod rg-eks.yaml), and EKS
    # upgrades only ONE minor per call, so a running 1.35 spoke cannot take this
    # change directly -- it goes to error. Pick one:
    #
    #   - RECREATE the spoke at 1.37 (simplest), or
    #   - UPGRADE ONE MINOR AT A TIME: set 1.36, let the spoke reach ACTIVE, then
    #     set 1.37 and let it reach ACTIVE again.
    #
    # Editing this file from 1.35 straight to 1.37 on a live spoke is the one thing
    # not to do. A spoke CREATED fresh at 1.37 is unaffected, because it is created
    # at this version in a single call -- that is the only case where the one-minor
    # rule does not apply.
    #
    # 1.36 IS A FLOOR, NOT A PREFERENCE. Both the dev and prod overlays set
    # agent_sandbox: true, and the addon registry hands every spoke
    # sandbox_runtime_class: isolated-sandbox -- a RuntimeClass that does not exist
    # below Kubernetes 1.36. A 1.35 spoke therefore installs the Sandbox CRDs, admits
    # a `sandbox: true` agent, and then leaves its pod Pending forever: the isolation
    # is requested and never delivered. Nitro Sandboxes require 1.36+ in a US
    # commercial region. So staying on 1.35 is not a neutral choice either.
    k8sVersion: "1.37"
    # accountId/managementAccountId deliberately OMITTED. appmod-blueprints'
    # kro-clusters chart resolves both via `default $.Values.global.accountId`
    # (clusters.yaml), and clusters-kro.yaml's ApplicationSet template already
    # populates global.accountId from the hub cluster secret's own
    # aws_account_id annotation — the real AWS account, never committed to git.
    # A real account ID belongs here only as a last resort if that fallback is
    # ever unavailable; do not reintroduce it as a habit.
    # Must match the hub's prefix so the spoke can assume the hub's
    # <prefix>-cluster-mgmt-* roles via ACK CARM.
    resourcePrefix: peeks
    # 10.0.0.0/16 is the hub; 10.2.0.0/16 is an unrelated CDK VPC hosting ROSA workers.
    cidr:
      vpcCidr: "10.1.0.0/16"
      publicSubnet1Cidr: "10.1.1.0/24"
      publicSubnet2Cidr: "10.1.2.0/24"
      privateSubnet1Cidr: "10.1.11.0/24"
      privateSubnet2Cidr: "10.1.12.0/24"
  oap-prod:
    clusterName: oap-prod
    tenant: default
    # Selects overlays/environments/prod, where agent_platform, agent_core,
    # agent_gateway, oam_components and agent_sandbox are all enabled -- so this
    # spoke receives the same agentic capabilities as dev, against the prod tier.
    environment: prod
    # Load-bearing, same as dev: an empty provider label makes the addon registry
    # route this spoke to the crossplane pod-identity chart (selector is
    # provider NotIn [kro-ack], which matches an empty value), and that chart then
    # 409-conflicts with the pod identity associations the EksCluster RGD has
    # already created.
    provider: "kro-ack"
    region: us-west-2
    # 1.37, matching the hub and oap-dev. 1.36 is a hard floor rather than a
    # preference: agent_sandbox is enabled on the prod overlay and the registry
    # hands this spoke sandbox_runtime_class: isolated-sandbox, a RuntimeClass that
    # does not exist below 1.36.
    #
    # No upgrade caveat applies here the way it does to oap-dev: this spoke does not
    # exist yet anywhere, so it is always created fresh at this version. If you later
    # raise this value on a LIVE oap-prod, the one-minor-per-call rule applies --
    # see the oap-dev note above.
    k8sVersion: "1.37"
    # accountId/managementAccountId deliberately OMITTED, exactly as for oap-dev:
    # appmod-blueprints' kro-clusters chart resolves both via
    # `default $.Values.global.accountId`, which clusters-kro.yaml populates from
    # the hub cluster secret's aws_account_id annotation. Keeping a real account ID
    # out of git is the point.
    resourcePrefix: peeks
    # 10.3.0.0/16, NOT 10.2.0.0/16. The allocation is 10.0 hub, 10.1 oap-dev, and
    # 10.2 is taken by an unrelated CDK VPC hosting ROSA workers (see the oap-dev
    # comment above) -- so prod skips to 10.3 rather than colliding with it. A
    # previous config.local.yaml had spoke-prod on 10.2.0.0/16, which would have
    # overlapped that VPC.
    cidr:
      vpcCidr: "10.3.0.0/16"
      publicSubnet1Cidr: "10.3.1.0/24"
      publicSubnet2Cidr: "10.3.2.0/24"
      privateSubnet1Cidr: "10.3.11.0/24"
      privateSubnet2Cidr: "10.3.12.0/24"
