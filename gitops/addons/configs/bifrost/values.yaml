# Bifrost AI Gateway — addon value overrides.
# Per-cluster values (podIdentity.clusterName/region) are injected by the
# ApplicationSet valuesObject in gitops/addons/registry/gateway.yaml.

# ── Pod Identity (Bedrock access) — umbrella chart ──────────────────────────
podIdentity:
  enabled: true
  namespace: bifrost
  serviceAccountName: bifrost

# ── Upstream maximhq/bifrost subchart ───────────────────────────────────────
bifrost:
  image:
    tag: "v1.5.0"
    pullPolicy: IfNotPresent

  replicaCount: 1

  serviceAccount:
    create: true
    name: bifrost

  # Embedded PostgreSQL — Bifrost deploys as a Deployment (not StatefulSet),
  # making config changes seamless for GitOps. The Postgres StatefulSet spec
  # is stable and rarely changes after initial deploy.
  # TODO: migrate to RDS via Crossplane for production (passwordCommand with
  # aws rds generate-db-auth-token supports Pod Identity — no static password).
  storage:
    mode: postgres

  postgresql:
    enabled: true
    auth:
      username: bifrost
      password: "bifrost-internal"   # cluster-internal only; not exposed outside
      database: bifrost
    primary:
      persistence:
        enabled: true
        size: 10Gi

  service:
    type: ClusterIP
    port: 8080

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  autoscaling:
    enabled: false

  # Wait for Postgres to accept connections before starting Bifrost.
  # FQDN with a trailing dot = single absolute DNS query that bypasses the CoreDNS
  # search list (a name under ndots:5 is otherwise tried against every search-domain
  # suffix first). The loop is bounded (cap + nc -w) and echoes each attempt, so a
  # real dependency failure exits non-zero and the init restarts visibly instead of
  # stalling silently. Namespace is 'bifrost' (see podIdentity.namespace above).
  initContainers:
    - name: wait-for-postgres
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          host="bifrost-postgresql.bifrost.svc.cluster.local."
          for i in $(seq 1 60); do
            if nc -z -w 2 "$host" 5432; then
              echo "postgres reachable on attempt $i"; exit 0
            fi
            echo "attempt $i/60: $host:5432 not reachable yet"; sleep 2
          done
          echo "postgres still unreachable after 60 attempts; failing init"; exit 1

  bifrost:
    client:
      initialPoolSize: 100
      # TODO(llm-as-a-service): re-enable with VK enforcement once per-workload
      # VK minting is implemented. See DESIGN.md.
      enforceAuthOnInference: false

    providers:
      bedrock:
        keys:
          - name: bedrock-default
            models: ["*"]
            weight: 1
            aliases:
              claude-sonnet: us.anthropic.claude-sonnet-5-5
              # Platform default judge for continuous agent evaluation
              # (docs/architecture/agent-evaluation.md, D3).
              #
              # The judge is constrained by a capability, not chosen on taste.
              # Langfuse validates an LLM-as-a-judge evaluator by making a real
              # model call that demands STRUCTURED OUTPUT, and Bifrost translates
              # that into a Bedrock FORCED tool call. A model that refuses forced
              # tool choice makes Langfuse pause the evaluator with
              # EVAL_MODEL_CONFIG_INVALID.
              #
              # Measured against Bedrock through Bifrost on the hub:
              #   us.amazon.nova-pro-v1:0         OK, valid structured JSON
              #   us.anthropic.claude-haiku-5-5   OK, valid structured JSON
              #   us.anthropic.claude-sonnet-5-5  rejected: tool_choice: type
              #                                   "tool" and "any" are not
              #                                   supported for this model
              #   us.anthropic.claude-opus-5-5    rejected, same reason
              #   us.anthropic.claude-fable-5(-1) rejected by the ACCOUNT, not the
              #                                   capability: "data retention mode
              #                                   'default' is not available for
              #                                   this model" — it fails a plain
              #                                   chat call too, so Fable needs
              #                                   Bedrock model access sorted out
              #                                   before it can be considered
              #   us.anthropic.claude-3-7-sonnet  404, end of life
              #
              # Note this is NOT a Claude-family limitation: Haiku 5.5 accepts
              # forced tool choice while Sonnet and Opus 5.5 do not.
              #
              # Nova Pro over Haiku 5.5 for two reasons: it is the stronger of the
              # two working options (D3 warns that a small model makes a weak
              # judge), and a different family removes self-preference bias
              # outright instead of trusting one Claude to grade another.
              #
              # Prefer Sonnet/Opus/Fable once any of these is true: Bifrost stops
              # forcing tool_choice (`auto` would likely satisfy them), those
              # models start accepting it on Bedrock, or Fable's data-retention
              # access is enabled on this account. The dashboard breaks pass ratios
              # down by judge model, so a swap stays measurable.
              judge-default: us.amazon.nova-pro-v1:0
              # Second working judge, offered so the choice can be MEASURED
              # rather than argued: an agent sets `evaluation.judge.modelId:
              # judge-haiku` and the Agent Evaluation dashboard compares pass
              # ratios by judge model. Same family as the agents, so it carries
              # the self-preference risk judge-default avoids, and it is the
              # small tier rather than the mid tier.
              judge-haiku: us.anthropic.claude-haiku-5-5
            bedrock_key_config:
              region: us-west-2

    mcp:
      enabled: true
      toolManagerConfig:
        toolExecutionTimeout: "30s"
        maxAgentDepth: 10

    plugins:
      # TODO(llm-as-a-service): Re-enable governance with per-workload VK minting.
      # See gitops/addons/charts/bifrost/DESIGN.md for the target architecture.
      # is_vk_mandatory is disabled until per-workload VK minting is implemented.
      governance:
        enabled: true
        config:
          is_vk_mandatory: false
      telemetry:
        enabled: true
      logging:
        enabled: true
      otel:
        enabled: true
        version: 1
        config:
          service_name: "bifrost"
          collector_url: "otel-collector.otel.svc.cluster.local:4317"
          trace_type: "genai_extension"
          protocol: "grpc"
          insecure: true

    governance:
      budgets:
        - id: budget-platform
          max_limit: 500
          reset_duration: "1M"
      rateLimits:
        - id: rate-limit-standard
          token_max_limit: 500000
          token_reset_duration: "1h"
          request_max_limit: 5000
          request_reset_duration: "1h"
