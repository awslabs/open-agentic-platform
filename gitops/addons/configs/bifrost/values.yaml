# Bifrost AI Gateway — addon value overrides.
# Per-cluster values (podIdentity.clusterName/region) are injected by the
# ApplicationSet valuesObject in gitops/addons/registry/gateway.yaml.

# ── Pod Identity (Bedrock access) — umbrella chart ──────────────────────────
podIdentity:
  enabled: true
  namespace: bifrost
  serviceAccountName: bifrost

# ── Upstream maximhq/bifrost subchart ───────────────────────────────────────
bifrost:
  image:
    tag: "v1.5.0"
    pullPolicy: IfNotPresent

  replicaCount: 1

  serviceAccount:
    create: true
    name: bifrost

  # Embedded PostgreSQL — Bifrost deploys as a Deployment (not StatefulSet),
  # making config changes seamless for GitOps. The Postgres StatefulSet spec
  # is stable and rarely changes after initial deploy.
  # TODO: migrate to RDS via Crossplane for production (passwordCommand with
  # aws rds generate-db-auth-token supports Pod Identity — no static password).
  storage:
    mode: postgres

  postgresql:
    enabled: true
    auth:
      username: bifrost
      password: "bifrost-internal"   # cluster-internal only; not exposed outside
      database: bifrost
    primary:
      persistence:
        enabled: true
        size: 10Gi

  service:
    type: ClusterIP
    port: 8080

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  autoscaling:
    enabled: false

  # Wait for Postgres to accept connections before starting Bifrost.
  initContainers:
    - name: wait-for-postgres
      image: busybox:1.36
      command: ['sh', '-c', 'until nc -z bifrost-postgresql 5432; do sleep 2; done']

  bifrost:
    # Admin authentication on the Bifrost dashboard and management API (including
    # POST /api/governance/virtual-keys, which was open before). Credentials come
    # from the bifrost-admin Secret created once at bootstrap (not per-workload);
    # the per-agent VK mint Job reads the same Secret to authenticate. Keys default
    # to username/password.
    authConfig:
      isEnabled: true
      existingSecret: bifrost-admin
      usernameKey: username
      passwordKey: password
      # Admin auth guards the API/dashboard; virtual-key enforcement on inference is
      # governed separately by client.enforceAuthOnInference below.
      disableAuthOnInference: false

    client:
      initialPoolSize: 100
      # Require a valid virtual key on every inference request. Safe now that the
      # agent ComponentDefinition mints a per-agent VK at deploy time (mint Job ->
      # <agent>-llm-vk Secret -> x-bf-vk header). Without a VK, inference is
      # rejected with 401 virtual_key_required — so this MUST stay in lockstep with
      # minting: every agent that reaches Bedrock has to be onboarded through the
      # agent component (or carry a hand-issued key) or it loses LLM access.
      enforceAuthOnInference: true

    providers:
      bedrock:
        keys:
          - name: bedrock-default
            models: ["*"]
            weight: 1
            aliases:
              claude-sonnet: us.anthropic.claude-sonnet-4-5-20250929-v1:0
            bedrock_key_config:
              region: us-west-2

    mcp:
      enabled: true
      toolManagerConfig:
        toolExecutionTimeout: "30s"
        maxAgentDepth: 10

    plugins:
      # Per-workload VK minting is now wired into agent onboarding (the agent
      # ComponentDefinition's mint Job), so virtual keys are mandatory. This makes
      # the platform budgets and rate limits below actually enforced rather than
      # cosmetic. Kept in lockstep with client.enforceAuthOnInference above.
      governance:
        enabled: true
        config:
          is_vk_mandatory: true
      telemetry:
        enabled: true
      logging:
        enabled: true
      otel:
        enabled: true
        version: 1
        config:
          service_name: "bifrost"
          collector_url: "otel-collector.otel.svc.cluster.local:4317"
          trace_type: "genai_extension"
          protocol: "grpc"
          insecure: true

    governance:
      budgets:
        - id: budget-platform
          max_limit: 500
          reset_duration: "1M"
      rateLimits:
        - id: rate-limit-standard
          token_max_limit: 500000
          token_reset_duration: "1h"
          request_max_limit: 5000
          request_reset_duration: "1h"
