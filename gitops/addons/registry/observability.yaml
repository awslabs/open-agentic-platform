# Observability domain — tracing, metrics, and monitoring CRDs
# (langfuse, jaeger, otel-collector, prometheus-operator-crds).

langfuse:
  namespace: langfuse
  defaultVersion: '0.1.0'
  path: 'gitops/addons/charts/langfuse'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '5'
  selectorMatchLabels:
    enable_langfuse: "true"
  selector:
    matchExpressions:
      - key: enable_langfuse
        operator: In
        values: ['true']
  valuesObject:
    global:
      awsRegion: '{{.metadata.annotations.aws_region}}'
      insecure: '{{default "false" (index .metadata.annotations "insecure")}}'
      # Used by push-otel-secret.yaml to name the OTEL SM secret
      # <resourcePrefix>-hub/langfuse-otel (prefix-scoped so two events in one account
      # don't collide; must match the otel-collector secretManagerKey above).
      resourcePrefix: '{{.metadata.annotations.resource_prefix}}'
    clusterName: '{{.metadata.annotations.aws_cluster_name}}'
    ingress:
      enabled: true
      host: '{{.metadata.annotations.ingress_domain_name}}'
    keycloak:
      issuerUrl: '{{default (printf "https://%s/keycloak/realms/platform" .metadata.annotations.ingress_domain_name) (index .metadata.annotations "oidc_issuer_url")}}'
      secretManagerKey: '{{.metadata.annotations.aws_cluster_name}}/keycloak-clients'
      # SSO-only (local email/password off) only where the Keycloak addon is
      # deployed: same enable_keycloak label that selects it. Without it,
      # local login stays on so an OAP-only install can still sign in.
      disableUsernamePassword: '{{default "false" (index .metadata.labels "enable_keycloak")}}'
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /spec/dataFrom

jaeger:
  namespace: jaeger
  chartName: jaeger
  defaultVersion: '3.4.1'
  chartRepository: 'https://jaegertracing.github.io/helm-charts'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '5'
  selector:
    matchExpressions:
      - key: enable_jaeger
        operator: In
        values: ['true']
  valuesObject:
    provisionDataStore:
      cassandra: false
    allInOne:
      enabled: true
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
    storage:
      type: memory
    agent:
      enabled: false
    collector:
      enabled: false
    query:
      enabled: false

otel-collector:
  namespace: otel
  defaultVersion: '0.1.0'
  path: 'gitops/addons/charts/otel-collector'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '6'
  selector:
    matchExpressions:
      - key: enable_otel_collector
        operator: In
        values: ['true']
  valuesObject:
    global:
      awsRegion: '{{.metadata.annotations.aws_region}}'
    langfuse:
      enabled: true
      # Single hub Langfuse for the whole fleet. The hub sets ingress_domain_name
      # (its CloudFront host) and uses it directly. A spoke has an EMPTY
      # ingress_domain_name and no public domain of its own, so it falls back to
      # the host of oidc_issuer_url (every spoke carries it, pointing at the hub
      # domain) -> spoke ADOT collectors export traces to the hub Langfuse.
      #
      # THE HUB EXPORTS IN-CLUSTER, not through its own public domain. Sending
      # hub traces out to the ALB and straight back in is a pointless round trip,
      # and on this platform it does not merely cost latency — it silently
      # DROPPED every hub trace. Observed on the hub: POSTs to
      # https://<domain>/api/public/otel/v1/traces never returned
      # ("context deadline exceeded ... awaiting headers", retried forever), so
      # no hub trace reached Langfuse for six days, while the same request to
      # langfuse.langfuse.svc.cluster.local answered 200 in 0.3s. Continuous
      # agent evaluation depends on those traces, so an agent on the hub could
      # never be scored.
      #
      # Spokes keep using the hub domain, because they have no Langfuse Service
      # of their own to reach.
      endpoint: '{{ $d := index .metadata.annotations "ingress_domain_name" }}{{ if $d }}http://langfuse.langfuse.svc.cluster.local:3000/api/public/otel{{ else }}https://{{ (splitList "/" (trimPrefix "https://" (index .metadata.annotations "oidc_issuer_url"))) | first }}/api/public/otel{{ end }}'
      # Resource-prefixed so two events with different prefixes in the SAME AWS account
      # do not collide on one SM secret. resource_prefix is present+identical on hub and
      # all spokes (spokes read the hub's secret), and <resource_prefix>-hub == the hub
      # cluster name. Must match the langfuse push-otel-keys Job SECRET_ID exactly.
      secretManagerKey: '{{ index .metadata.annotations "resource_prefix" }}-hub/langfuse-otel'
    bifrost:
      enabled: true
      scrapeEndpoint: 'bifrost.bifrost.svc.cluster.local:8080'
    amp:
      enabled: true
      remoteWriteEndpoint: '{{with (index .metadata.annotations "amp_endpoint_url")}}{{.}}{{end}}'
      clusterName: '{{.metadata.annotations.aws_cluster_name}}'

prometheus-operator-crds:
  namespace: monitoring
  chartName: prometheus-operator-crds
  defaultVersion: '28.0.1'
  chartRepository: 'https://prometheus-community.github.io/helm-charts'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '5'
  selector:
    matchExpressions:
      - key: enable_monitoring
        operator: In
        values: ['true']
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /metadata/annotations

# Continuous agent evaluation (docs/architecture/agent-evaluation.md).
#
# Deployed to EVERY cluster that runs agents, the hub included, because agents and
# their evaluation ConfigMaps are local to a cluster and one reconciler cannot
# list another cluster's. Each instance owns only its own cluster's Langfuse
# rules.
#
# The HUB instance additionally owns the project-wide objects — the catalog
# evaluators and the judge LLM connection — because all clusters share one
# Langfuse project and, under trunk-based development, spokes sit on different
# chart versions. Without a single writer the last cluster to reconcile would
# decide how the whole fleet is scored.
#
# role is derived the same way the otel-collector derives its Langfuse endpoint:
# the hub is the cluster with a non-empty ingress_domain_name (its own public
# domain), and a spoke has none. langfuse.url follows from the same test — the
# hub reaches Langfuse in-cluster, a spoke over HTTPS on the hub domain (which
# every spoke carries in oidc_issuer_url).
agent-evaluation:
  namespace: agent-evaluation
  defaultVersion: '0.1.0'
  path: 'gitops/addons/charts/agent-evaluation'
  annotationsAppSet:
    # After langfuse (5) and otel-collector (6): the reconciler needs the seeded
    # project's keys in Secrets Manager before it can call the Langfuse API.
    argocd.argoproj.io/sync-wave: '7'
  selector:
    matchExpressions:
      - key: enable_agent_evaluation
        operator: In
        values: ['true']
  valuesObject:
    global:
      awsRegion: '{{.metadata.annotations.aws_region}}'
      clusterName: '{{.metadata.annotations.aws_cluster_name}}'
    role: '{{ if index .metadata.annotations "ingress_domain_name" }}hub{{ else }}spoke{{ end }}'
    langfuse:
      # Hub: in-cluster Service. Spoke: the hub domain over HTTPS, resolved
      # exactly like the otel-collector's export endpoint above. Langfuse is
      # served at "/" on that domain, so /api/public/... resolves there.
      url: '{{ $d := index .metadata.annotations "ingress_domain_name" }}{{ if $d }}http://langfuse.langfuse.svc.cluster.local:3000{{ else }}https://{{ (splitList "/" (trimPrefix "https://" (index .metadata.annotations "oidc_issuer_url"))) | first }}{{ end }}'
      # Same entry the otel-collector reads, written by the langfuse addon's
      # push-otel-keys hook. <resource_prefix>-hub is the hub cluster name, and
      # the annotation is identical on hub and spokes.
      secretManagerKey: '{{ index .metadata.annotations "resource_prefix" }}-hub/langfuse-otel'
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /spec/dataFrom
