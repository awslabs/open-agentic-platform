# Observability domain — tracing, metrics, and monitoring CRDs
# (langfuse, jaeger, otel-collector, prometheus-operator-crds).

langfuse:
  namespace: langfuse
  defaultVersion: '0.1.0'
  path: 'gitops/addons/charts/langfuse'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '5'
  selectorMatchLabels:
    enable_langfuse: "true"
  selector:
    matchExpressions:
      - key: enable_langfuse
        operator: In
        values: ['true']
  valuesObject:
    global:
      awsRegion: '{{.metadata.annotations.aws_region}}'
      insecure: '{{default "false" (index .metadata.annotations "insecure")}}'
      # Used by push-otel-secret.yaml to name the OTEL SM secret
      # <resourcePrefix>-hub/langfuse-otel (prefix-scoped so two events in one account
      # don't collide; must match the otel-collector secretManagerKey above).
      resourcePrefix: '{{.metadata.annotations.resource_prefix}}'
    clusterName: '{{.metadata.annotations.aws_cluster_name}}'
    ingress:
      enabled: true
      host: '{{.metadata.annotations.ingress_domain_name}}'
    keycloak:
      issuerUrl: '{{default (printf "https://%s/keycloak/realms/platform" .metadata.annotations.ingress_domain_name) (index .metadata.annotations "oidc_issuer_url")}}'
      secretManagerKey: '{{.metadata.annotations.aws_cluster_name}}/keycloak-clients'
      # SSO-only (local email/password off) only where the Keycloak addon is
      # deployed: same enable_keycloak label that selects it. Without it,
      # local login stays on so an OAP-only install can still sign in.
      disableUsernamePassword: '{{default "false" (index .metadata.labels "enable_keycloak")}}'
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /spec/dataFrom

jaeger:
  namespace: jaeger
  chartName: jaeger
  defaultVersion: '3.4.1'
  chartRepository: 'https://jaegertracing.github.io/helm-charts'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '5'
  selector:
    matchExpressions:
      - key: enable_jaeger
        operator: In
        values: ['true']
  valuesObject:
    provisionDataStore:
      cassandra: false
    allInOne:
      enabled: true
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
    storage:
      type: memory
    agent:
      enabled: false
    collector:
      enabled: false
    query:
      enabled: false

otel-collector:
  namespace: otel
  defaultVersion: '0.1.0'
  path: 'gitops/addons/charts/otel-collector'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '6'
  selector:
    matchExpressions:
      - key: enable_otel_collector
        operator: In
        values: ['true']
  valuesObject:
    global:
      awsRegion: '{{.metadata.annotations.aws_region}}'
    langfuse:
      enabled: true
      # Single hub Langfuse for the whole fleet. The hub sets ingress_domain_name
      # (its CloudFront host) and uses it directly. A spoke has an EMPTY
      # ingress_domain_name and no public domain of its own, so it falls back to
      # the host of oidc_issuer_url (every spoke carries it, pointing at the hub
      # domain) -> spoke ADOT collectors export traces to the hub Langfuse.
      #
      # THE HUB EXPORTS IN-CLUSTER, not through its own public domain. Sending
      # hub traces out to the ALB and straight back in is a pointless round trip,
      # and on this platform it does not merely cost latency — it silently
      # DROPPED every hub trace. Observed on the hub: POSTs to
      # https://<domain>/api/public/otel/v1/traces never returned
      # ("context deadline exceeded ... awaiting headers", retried forever), so
      # no hub trace reached Langfuse for six days, while the same request to
      # langfuse.langfuse.svc.cluster.local answered 200 in 0.3s. Continuous
      # agent evaluation depends on those traces, so an agent on the hub could
      # never be scored.
      #
      # Spokes keep using the hub domain, because they have no Langfuse Service
      # of their own to reach.
      endpoint: '{{ $d := index .metadata.annotations "ingress_domain_name" }}{{ if $d }}http://langfuse.langfuse.svc.cluster.local:3000/api/public/otel{{ else }}https://{{ (splitList "/" (trimPrefix "https://" (index .metadata.annotations "oidc_issuer_url"))) | first }}/api/public/otel{{ end }}'
      # Resource-prefixed so two events with different prefixes in the SAME AWS account
      # do not collide on one SM secret. resource_prefix is present+identical on hub and
      # all spokes (spokes read the hub's secret), and <resource_prefix>-hub == the hub
      # cluster name. Must match the langfuse push-otel-keys Job SECRET_ID exactly.
      secretManagerKey: '{{ index .metadata.annotations "resource_prefix" }}-hub/langfuse-otel'
    bifrost:
      enabled: true
      scrapeEndpoint: 'bifrost.bifrost.svc.cluster.local:8080'
    amp:
      enabled: true
      remoteWriteEndpoint: '{{with (index .metadata.annotations "amp_endpoint_url")}}{{.}}{{end}}'
      # amp_endpoint_url is empty on KRO-provisioned clusters (hub and spokes), so the
      # endpoint comes from <resource_prefix>/platform/amp instead: the secret the platform
      # seeds once AMP exists (amp-workspace + amp-region), already read by the spoke
      # amp-workspace-secrets ExternalSecrets. Same key on hub and spokes. Without it the
      # metrics pipeline falls back to the debug exporter and AMP gets no bifrost series.
      # Only with a resource_prefix: without one there is no such secret to wait for.
      secretManagerKey: '{{ with index .metadata.annotations "resource_prefix" }}{{ . }}/platform/amp{{ end }}'
      clusterName: '{{.metadata.annotations.aws_cluster_name}}'
      # appmod's crossplane pod_identities addon already associates otel/otel-collector
      # on control-plane clusters that are not provider=kro-ack (its selector plus the
      # control-plane overlay). EKS allows one association per service account, so the
      # chart skips its own there. Only read on the Secrets Manager path.
      podIdentity: '{{ if and (eq (index .metadata.labels "environment") "control-plane") (ne (index .metadata.labels "provider") "kro-ack") }}false{{ else }}true{{ end }}'

prometheus-operator-crds:
  namespace: monitoring
  chartName: prometheus-operator-crds
  defaultVersion: '28.0.1'
  chartRepository: 'https://prometheus-community.github.io/helm-charts'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '5'
  selector:
    matchExpressions:
      - key: enable_monitoring
        operator: In
        values: ['true']
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /metadata/annotations

# Continuous agent evaluation (docs/architecture/agent-evaluation.md).
#
# Deployed to EVERY cluster that runs agents, the hub included, because agents and
# their evaluation ConfigMaps are local to a cluster and one reconciler cannot
# list another cluster's. Each instance owns only its own cluster's Langfuse
# rules.
#
# The HUB instance additionally owns the project-wide objects — the catalog
# evaluators and the judge LLM connection — because all clusters share one
# Langfuse project and, under trunk-based development, spokes sit on different
# chart versions. Without a single writer the last cluster to reconcile would
# decide how the whole fleet is scored.
#
# role is derived the same way the otel-collector derives its Langfuse endpoint:
# the hub is the cluster with a non-empty ingress_domain_name (its own public
# domain), and a spoke has none. langfuse.url follows from the same test — the
# hub reaches Langfuse in-cluster, a spoke over HTTPS on the hub domain (which
# every spoke carries in oidc_issuer_url).
agent-evaluation:
  namespace: agent-evaluation
  defaultVersion: '0.1.0'
  path: 'gitops/addons/charts/agent-evaluation'
  annotationsAppSet:
    # After langfuse (5) and otel-collector (6): the reconciler needs the seeded
    # project's keys in Secrets Manager before it can call the Langfuse API.
    argocd.argoproj.io/sync-wave: '7'
  selector:
    matchExpressions:
      - key: enable_agent_evaluation
        operator: In
        values: ['true']
  valuesObject:
    global:
      awsRegion: '{{.metadata.annotations.aws_region}}'
      clusterName: '{{.metadata.annotations.aws_cluster_name}}'
    # Pulled from THE DEPLOYING CLUSTER'S OWN ACCOUNT, resolved from the cluster
    # secret -- so no AWS account id is committed to this repo.
    #
    # WHY AN OVERRIDE IS NEEDED AT ALL. The chart default,
    # public.ecr.aws/z0a4o2j5/agent-evaluation, does not exist: that repository
    # answers NAME_UNKNOWN and the tag 404s, so a cluster taking the default sits
    # in ImagePullBackOff -- a stuck addon, not a degraded one. Until the image is
    # published, each account builds it from applications/agent-evaluation
    # (./build.sh --push; multi-arch is required, OAP fleets mix arm64 and amd64).
    #
    # WHY TEMPLATED RATHER THAN A PER-CLUSTER FILE. This replaces three
    # overlays/clusters/<cluster>/agent-evaluation/values.yaml files that each
    # hardcoded one account's registry. Those had to be written out per cluster
    # and put a real account id in git. Resolving aws_account_id/aws_region from
    # the cluster secret covers hub and every spoke at once, and -- the point of
    # the original objection to making this the chart default -- never pins one
    # account's private registry as anyone else's: a fork resolves to its OWN
    # account, not ours.
    #
    # STILL TEMPORARY. Delete this image block once
    # public.ecr.aws/z0a4o2j5/agent-evaluation exists ("Ask 2" on #104); the chart
    # default is correct for everyone at that point.
    #
    # ON AN EXISTING INSTALL THIS DOES NOT TAKE EFFECT ON ITS OWN. The addon reads
    # this registry through the hub's agent-platform-addons Application, which is
    # pinned to the addons_repo_revision stamped on the hub cluster secret. Until
    # that Application follows the revision carrying this change -- in practice,
    # re-running the agentic bootstrap -- the addon keeps rendering the OLD image
    # and nothing here applies. A fresh install picks it up immediately.
    #
    # The tag is the IMAGE version line and moves in lockstep with image.tag in
    # the chart's values.yaml, appVersion in its Chart.yaml, and version in the
    # application's pyproject.toml -- NOT with the chart version or
    # defaultVersion above, which track templates and move independently.
    image:
      repository: '{{.metadata.annotations.aws_account_id}}.dkr.ecr.{{.metadata.annotations.aws_region}}.amazonaws.com/agent-evaluation'
      tag: '0.2.4'
    # EXPLICIT FIRST, inference only as a fallback.
    #
    # An `agent_evaluation_role` annotation on the cluster secret wins outright.
    # Inferring from `ingress_domain_name` is convenient but it decides something
    # too important to leave implicit: the hub is the single writer of the
    # project-wide Langfuse objects, so a spoke that is given its own public
    # domain for an unrelated reason would silently promote itself to hub and
    # start republishing the catalog evaluators and the judge connection that the
    # real hub owns. Two hubs is the one state the ownership model has no answer
    # for.
    #
    # Setting it explicitly on the hub, and leaving every spoke to infer, is the
    # recommended configuration.
    role: '{{ if index .metadata.annotations "agent_evaluation_role" }}{{ index .metadata.annotations "agent_evaluation_role" }}{{ else if index .metadata.annotations "ingress_domain_name" }}hub{{ else }}spoke{{ end }}'
    langfuse:
      # Hub: in-cluster Service. Spoke: the hub domain over HTTPS, resolved
      # exactly like the otel-collector's export endpoint above. Langfuse is
      # served at "/" on that domain, so /api/public/... resolves there.
      url: '{{ $d := index .metadata.annotations "ingress_domain_name" }}{{ if $d }}http://langfuse.langfuse.svc.cluster.local:3000{{ else }}https://{{ (splitList "/" (trimPrefix "https://" (index .metadata.annotations "oidc_issuer_url"))) | first }}{{ end }}'
      # Same entry the otel-collector reads, written by the langfuse addon's
      # push-otel-keys hook. <resource_prefix>-hub is the hub cluster name, and
      # the annotation is identical on hub and spokes.
      secretManagerKey: '{{ index .metadata.annotations "resource_prefix" }}-hub/langfuse-otel'
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /spec/dataFrom
