# Observability domain — tracing, metrics, and monitoring CRDs
# (langfuse, jaeger, otel-collector, prometheus-operator-crds).

langfuse:
  namespace: langfuse
  defaultVersion: '0.1.0'
  path: 'gitops/addons/charts/langfuse'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '5'
  selectorMatchLabels:
    enable_langfuse: "true"
  selector:
    matchExpressions:
      - key: enable_langfuse
        operator: In
        values: ['true']
  valuesObject:
    global:
      awsRegion: '{{.metadata.annotations.aws_region}}'
      insecure: '{{default "false" .metadata.annotations.insecure}}'
      # Used by push-otel-secret.yaml to name the OTEL SM secret
      # <resourcePrefix>-hub/langfuse-otel (prefix-scoped so two events in one account
      # don't collide; must match the otel-collector secretManagerKey above).
      resourcePrefix: '{{.metadata.annotations.resource_prefix}}'
    clusterName: '{{.metadata.annotations.aws_cluster_name}}'
    ingress:
      enabled: true
      host: '{{.metadata.annotations.ingress_domain_name}}'
    keycloak:
      issuerUrl: '{{default (printf "https://%s/keycloak/realms/platform" .metadata.annotations.ingress_domain_name) (index .metadata.annotations "oidc_issuer_url")}}'
      secretManagerKey: '{{.metadata.annotations.aws_cluster_name}}/keycloak-clients'
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /spec/dataFrom

jaeger:
  namespace: jaeger
  chartName: jaeger
  defaultVersion: '3.4.1'
  chartRepository: 'https://jaegertracing.github.io/helm-charts'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '5'
  selector:
    matchExpressions:
      - key: enable_jaeger
        operator: In
        values: ['true']
  valuesObject:
    provisionDataStore:
      cassandra: false
    allInOne:
      enabled: true
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
    storage:
      type: memory
    agent:
      enabled: false
    collector:
      enabled: false
    query:
      enabled: false

otel-collector:
  namespace: otel
  defaultVersion: '0.1.0'
  path: 'gitops/addons/charts/otel-collector'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '6'
  selector:
    matchExpressions:
      - key: enable_otel_collector
        operator: In
        values: ['true']
  valuesObject:
    global:
      awsRegion: '{{.metadata.annotations.aws_region}}'
    langfuse:
      enabled: true
      # Single hub Langfuse for the whole fleet. The hub sets ingress_domain_name
      # (its CloudFront host) and uses it directly. A spoke has an EMPTY
      # ingress_domain_name and no public domain of its own, so it falls back to
      # the host of oidc_issuer_url (every spoke carries it, pointing at the hub
      # domain) -> spoke ADOT collectors export traces to the hub Langfuse.
      # No-op on the hub (ingress_domain_name non-empty takes the first branch).
      endpoint: 'https://{{ $d := index .metadata.annotations "ingress_domain_name" }}{{ if $d }}{{ $d }}{{ else }}{{ (splitList "/" (trimPrefix "https://" (index .metadata.annotations "oidc_issuer_url"))) | first }}{{ end }}/api/public/otel'
      # Resource-prefixed so two events with different prefixes in the SAME AWS account
      # do not collide on one SM secret. resource_prefix is present+identical on hub and
      # all spokes (spokes read the hub's secret), and <resource_prefix>-hub == the hub
      # cluster name. Must match the langfuse push-otel-keys Job SECRET_ID exactly.
      secretManagerKey: '{{ index .metadata.annotations "resource_prefix" }}-hub/langfuse-otel'
    bifrost:
      enabled: true
      scrapeEndpoint: 'bifrost.bifrost.svc.cluster.local:8080'
    amp:
      enabled: true
      remoteWriteEndpoint: '{{with (index .metadata.annotations "amp_endpoint_url")}}{{.}}{{end}}'
      clusterName: '{{.metadata.annotations.aws_cluster_name}}'

prometheus-operator-crds:
  namespace: monitoring
  chartName: prometheus-operator-crds
  defaultVersion: '28.0.1'
  chartRepository: 'https://prometheus-community.github.io/helm-charts'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '5'
  selector:
    matchExpressions:
      - key: enable_monitoring
        operator: In
        values: ['true']
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /metadata/annotations
