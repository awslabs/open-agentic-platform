# Gateway domain — LLM gateways (litellm, bifrost) and the agent/MCP auth
# gateway stack (Gateway API CRDs, agentgateway CRDs + controller, agent-gateway).

litellm:
  namespace: litellm
  defaultVersion: '0.1.0'
  path: 'gitops/addons/charts/litellm'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '3'
  selector:
    matchExpressions:
      - key: enable_litellm
        operator: In
        values: ['true']
  valuesObject:
    global:
      awsRegion: '{{.metadata.annotations.aws_region}}'

bifrost:
  namespace: bifrost
  defaultVersion: '0.1.0'
  # Local umbrella chart: wraps upstream maximhq/bifrost and adds the Crossplane
  # Pod Identity (Bedrock access) + ExternalSecret in the same Application.
  path: 'gitops/addons/charts/bifrost'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '5'
  selector:
    matchExpressions:
      - key: enable_bifrost
        operator: In
        values: ['true']
  valuesObject:
    podIdentity:
      clusterName: '{{.metadata.annotations.aws_cluster_name}}'
      region: '{{.metadata.annotations.aws_region}}'
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates

gateway-api-crds:
  namespace: agentgateway-system
  defaultVersion: '0.1.0'
  path: 'gitops/addons/charts/gateway-api-crds'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '7'
  selector:
    matchExpressions:
      - key: enable_agent_gateway
        operator: In
        values: ['true']
  valuesObject:
    gatewayApiVersion: "1.5.0"

# agentgateway 1.4.1 is pinned deliberately, and a HIGHER tag in this registry is not
# necessarily newer. Both charts below must stay on the same version.
#
# cr.agentgateway.dev/charts also publishes v2.2.0 and v2.2.1, which look like a newer
# major but are not agentgateway releases: upstream agentgateway/agentgateway has no 2.x
# release at all, and its newest final release is v1.4.1 (2026-07-29). The v2.2.1 chart
# ships a SMALLER API surface than v1.4.1: its AgentgatewayPolicy backend.auth accepts
# only [aws, key, passthrough, secretRef], with zero occurrences of oauthTokenExchange,
# and it drops the agentgatewaymodels CRD. Those CRDs carry kgateway references, so the
# 2.2.x tags track kgateway's versioning, not this project's.
#
# 1.4.1 is what unblocks token exchange (ADR-6 in
# docs/architecture/agent-identity-and-token-exchange.md). Verified on the pulled chart:
# backend.auth gains oauthTokenExchange and crossAppAccess, versus v1.1.0 which had only
# [aws, azure, gcp, key, passthrough, secretRef].
agentgateway-crds:
  namespace: agentgateway-system
  chartName: agentgateway-crds
  defaultVersion: 'v1.4.1'
  chartRepository: 'cr.agentgateway.dev'
  chartNamespace: charts
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '7'
  selector:
    matchExpressions:
      - key: enable_agent_gateway
        operator: In
        values: ['true']
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /metadata/annotations

# Keep in lockstep with agentgateway-crds above; see the version note there before
# changing this, because a higher tag in this registry can be a downgrade.
agentgateway:
  namespace: agentgateway-system
  chartName: agentgateway
  defaultVersion: 'v1.4.1'
  chartRepository: 'cr.agentgateway.dev'
  chartNamespace: charts
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '8'
  selector:
    matchExpressions:
      - key: enable_agent_gateway
        operator: In
        values: ['true']
  valuesObject:
    controller:
      extraEnv:
        KGW_ENABLE_GATEWAY_API_EXPERIMENTAL_FEATURES: "true"

agent-gateway:
  namespace: agent-core-infra
  defaultVersion: '0.1.0'
  path: 'gitops/addons/charts/agent-gateway'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '9'
  selector:
    matchExpressions:
      - key: enable_agent_gateway
        operator: In
        values: ['true']
  valuesObject:
    global:
      insecure: '{{default "false" .metadata.annotations.insecure}}'
      keycloak:
        issuerUrl: '{{default (printf "https://%s/keycloak/realms/platform" (index .metadata.annotations "ingress_domain_name")) (index .metadata.annotations "oidc_issuer_url")}}'
        serviceName: '{{default "keycloak" (index .metadata.annotations "keycloak_service_name")}}'
        namespace: '{{default "keycloak" (index .metadata.annotations "keycloak_namespace")}}'
    ingress:
      enabled: true
      host: '{{index .metadata.annotations "ingress_domain_name"}}'
      # Agents get a dedicated hostname that is a SIBLING of the main ingress host
      # (same parent domain), so a single wildcard ACM cert covers both. For host
      # "idp.elamaras.people.aws.dev" the agents host is "agents.elamaras.people.aws.dev"
      # — both matched by "*.elamaras.people.aws.dev". (The old "agents.<full-host>"
      # default produced "agents.idp.elamaras..." which a single-level wildcard does
      # NOT cover, so the ALB never provisioned: "no certificate found for host".)
      # If the domain has no parent (bare apex), fall back to "agents.<host>".
      # The agent_gateway_host annotation, when set, overrides this entirely.
      agentHost: '{{ $d := index .metadata.annotations "ingress_domain_name" }}{{ $parent := splitList "." $d | rest | join "." }}{{ $auto := ternary (printf "agents.%s" $parent) (printf "agents.%s" $d) (gt (len (splitList "." $d)) 2) }}{{ default $auto (index .metadata.annotations "agent_gateway_host") }}'
    mcpAuth:
      resourceMetadata:
        resource: '{{default "http://agentgateway-proxy.agentgateway-system.svc.cluster.local:8080/sse" (index .metadata.annotations "agent_gateway_resource_url")}}'
    # Secretless workload identity (Shape A): trust the cluster's own EKS OIDC
    # issuer as a second JWT provider so agent ServiceAccount tokens authenticate
    # without a secret.
    #
    # Reads THREE possible annotation names, because the clusters disagree on which
    # one they carry — verified live, not assumed: peeks-hub (the hub) has
    # eks_oidc_provider and neither of the others; oap-dev (a spoke) has
    # eks_oidc_issuer and oidcProvider and NOT eks_oidc_provider. Keying on
    # eks_oidc_provider alone left spokes with only the Keycloak provider, so every
    # agent ServiceAccount token 401'd with "token uses the unknown key ..." —
    # the gateway had no provider for that issuer at all. The three-way fallback
    # repairs existing spokes with no cluster mutation; whichever annotation a given
    # cluster actually carries wins, and the first with a non-empty value is used.
    workloadIdentity:
      issuer: '{{ $oidc := or (index .metadata.annotations "eks_oidc_provider") (index .metadata.annotations "eks_oidc_issuer") (index .metadata.annotations "oidcProvider") }}{{ $oidc }}'
      jwksHost: '{{ $oidc := or (index .metadata.annotations "eks_oidc_provider") (index .metadata.annotations "eks_oidc_issuer") (index .metadata.annotations "oidcProvider") }}{{ with $oidc }}oidc.eks.{{ index $.metadata.annotations "aws_region" }}.amazonaws.com{{ end }}'
      jwksPath: '{{ $oidc := or (index .metadata.annotations "eks_oidc_provider") (index .metadata.annotations "eks_oidc_issuer") (index .metadata.annotations "oidcProvider") }}{{ with $oidc }}{{ printf "%s/keys" (trimPrefix (printf "https://oidc.eks.%s.amazonaws.com" (index $.metadata.annotations "aws_region")) .) }}{{ end }}'

# Crossplane provider-keycloak. Lives in the gateway domain because the only
# consumer is the identity story: the MCP token exchange needs Keycloak clients
# (one for the gateway, one per MCP server as its audience), and this provider is
# what provisions them.
#
# Installed from OAP rather than upstream, following the precedent that OAP
# already ships its own provider (crossplane-agentcore's 01-provider.yaml), so
# this needs no appmod-blueprints change.
#
# Sync-wave 4 matches crossplane-agentcore: after crossplane-base establishes the
# Provider/DeploymentRuntimeConfig CRDs on the platform side.
#
# Admin credentials are NOT templated by default (credentials.create=false); the
# Secret is expected to exist in crossplane-system already. Enabling this addon
# without that Secret leaves the ProviderConfig unusable, which is why the hub
# flag ships false.
crossplane-keycloak:
  namespace: crossplane-system
  defaultVersion: '0.1.0'
  path: 'gitops/addons/charts/crossplane-keycloak'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '4'
  selector:
    matchExpressions:
      - key: enable_crossplane_keycloak
        operator: In
        values: ['true']
  valuesObject:
    exchange:
      # Token-exchange client for MCP (mcp-server.cue, tokenExchange).
      enabled: true
      # create on the HUB, adopt on spokes. Every cluster talks to the SAME realm
      # (Keycloak is hub-only), so exactly one may create the client. The others adopt
      # it, which also makes their provider read the client secret from Keycloak and
      # publish it locally, and gives the per-server AudienceProtocolMapper's
      # clientIdRef a local resource to resolve. Spokes carry hub_cluster_name; the hub
      # does not (verified: absent on peeks-hub, hub_cluster_name=peeks-hub on oap-dev).
      mode: '{{ if index .metadata.annotations "hub_cluster_name" }}adopt{{ else }}create{{ end }}'
    global:
      keycloak:
        # Scheme + host ONLY, no path. The provider takes base_path separately and
        # normalises both, so including "/keycloak" here would produce a doubled
        # path. oidc_issuer_url is the full issuer
        # (https://<host>/keycloak/realms/platform), so strip the scheme, take the
        # first path segment as the host, and re-prefix https. Same technique as
        # keycloak-backend.yaml, which parses the host out of the same annotation.
        # Falls back to ingress_domain_name when the annotation is absent.
        url: '{{ $iss := index .metadata.annotations "oidc_issuer_url" }}{{ if $iss }}https://{{ index (splitList "/" (trimPrefix "https://" (trimPrefix "http://" $iss))) 0 }}{{ else }}https://{{ index .metadata.annotations "ingress_domain_name" }}{{ end }}'
    credentials:
      externalSecret:
        # Secrets Manager entry holding the Keycloak admin password. Keycloak is
        # hub-only, so a spoke must read the HUB's entry, keyed on
        # hub_cluster_name rather than its own name.
        #
        # The hub itself has NO hub_cluster_name annotation (verified on peeks-hub:
        # absent, while oap-dev carries hub_cluster_name=peeks-hub), so fall back to
        # aws_cluster_name. Both paths resolve to peeks-hub/keycloak, which is the
        # entry that exists. Without the fallback the hub rendered "/keycloak".
        secretManagerKey: '{{ default (index .metadata.annotations "aws_cluster_name") (index .metadata.annotations "hub_cluster_name") }}/keycloak'
