# Gateway domain — LLM gateways (litellm, bifrost) and the agent/MCP auth
# gateway stack (Gateway API CRDs, agentgateway CRDs + controller, agent-gateway).

litellm:
  namespace: litellm
  defaultVersion: '0.1.0'
  path: 'gitops/addons/charts/litellm'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '3'
  selector:
    matchExpressions:
      - key: enable_litellm
        operator: In
        values: ['true']
  valuesObject:
    global:
      awsRegion: '{{.metadata.annotations.aws_region}}'

bifrost:
  namespace: bifrost
  defaultVersion: '0.1.0'
  # Local umbrella chart: wraps upstream maximhq/bifrost and adds the Crossplane
  # Pod Identity (Bedrock access) + ExternalSecret in the same Application.
  path: 'gitops/addons/charts/bifrost'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '5'
  selector:
    matchExpressions:
      - key: enable_bifrost
        operator: In
        values: ['true']
  valuesObject:
    podIdentity:
      clusterName: '{{.metadata.annotations.aws_cluster_name}}'
      region: '{{.metadata.annotations.aws_region}}'
    # Read by the Bedrock provider config (configs/bifrost/values.yaml,
    # bedrock_key_config.region: env.AWS_REGION) so Bedrock is called in the
    # cluster's own region rather than a pinned one.
    bifrost:
      extraEnv:
        AWS_REGION: '{{.metadata.annotations.aws_region}}'
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates

gateway-api-crds:
  namespace: agentgateway-system
  defaultVersion: '0.1.0'
  path: 'gitops/addons/charts/gateway-api-crds'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '7'
  selector:
    matchExpressions:
      - key: enable_agent_gateway
        operator: In
        values: ['true']
  valuesObject:
    gatewayApiVersion: "1.5.0"

# agentgateway v1.7.0 is pinned deliberately, and a HIGHER tag in this registry is not
# necessarily newer. Both charts below must stay on the same version.
#
# cr.agentgateway.dev/charts also publishes v2.2.0 and v2.2.1, which look like a newer
# major but are not agentgateway releases: upstream agentgateway/agentgateway has no 2.x
# release at all, and its newest final release is v1.7.0 (2026-10-27). The v2.2.1 chart
# ships a SMALLER API surface than v1.7.0: its AgentgatewayPolicy backend.auth accepts
# only [aws, key, passthrough, secretRef], with zero occurrences of oauthTokenExchange,
# and it drops the agentgatewaymodels CRD. Those CRDs carry kgateway references, so the
# 2.2.x tags track kgateway's versioning, not this project's.
#
# v1.4.1 unblocked token exchange (ADR-6 in
# docs/architecture/agent-identity-and-token-exchange.md): backend.auth gained
# oauthTokenExchange and crossAppAccess, versus v1.1.0 which had only
# [aws, azure, gcp, key, passthrough, secretRef].
#
# v1.7.0 is the target for the agent guardrails work
# (docs/architecture/agent-guardrails.md, Phase 0). Checked by pulling the
# agentgateway and agentgateway-crds charts at v1.4.1, v1.6.0 and v1.7.0 and comparing:
#   - the CRD chart ships the same four CRDs at all three tags
#     (agentgatewaybackends, agentgatewaymodels, agentgatewayparameters,
#     agentgatewaypolicies);
#   - oauthTokenExchange and crossAppAccess are still in the CRDs, so ADR-6 still holds;
#   - the controller Deployment still templates controller.extraEnv, which the
#     agentgateway entry below relies on.
# Why v1.7.0 and not v1.4.1:
#   - the Bedrock guardrail has failureMode with FailClosed as the default (from v1.6.0;
#     bedrockGuardrails has no failureMode field at v1.4.1);
#   - CEL can read and replace mcp.params;
#   - the default prompt guard scope includes ToolOutput, so tool results are inspected.
# Behavior changes between v1.4.1 and v1.7.0 that touch OAP, and what covers each:
#   - JWT iss is required, and aud when audiences are set (v1.5.0): tests/live identity rows;
#   - equal-specificity policy conflicts go to the oldest policy (v1.6.0): mcp-access.yaml;
#   - CRD defaults are no longer stored (v1.6.0): Argo shows Synced after the upgrade;
#   - error bodies drop internal details (v1.7.0): live tests assert status codes only;
#   - CEL request.headers["x"] is a list for a repeated header (v1.7.0): read by
#     caller-identity-policy.yaml for x-delegated-user, covered by tests/live delegation R3.
agentgateway-crds:
  namespace: agentgateway-system
  chartName: agentgateway-crds
  defaultVersion: 'v1.7.0'
  chartRepository: 'cr.agentgateway.dev'
  chartNamespace: charts
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '7'
  selector:
    matchExpressions:
      - key: enable_agent_gateway
        operator: In
        values: ['true']
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /metadata/annotations

# Keep in lockstep with agentgateway-crds above; see the version note there before
# changing this, because a higher tag in this registry can be a downgrade.
agentgateway:
  namespace: agentgateway-system
  chartName: agentgateway
  defaultVersion: 'v1.7.0'
  chartRepository: 'cr.agentgateway.dev'
  chartNamespace: charts
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '8'
  selector:
    matchExpressions:
      - key: enable_agent_gateway
        operator: In
        values: ['true']
  valuesObject:
    controller:
      extraEnv:
        KGW_ENABLE_GATEWAY_API_EXPERIMENTAL_FEATURES: "true"

agent-gateway:
  namespace: agent-core-infra
  defaultVersion: '0.1.0'
  path: 'gitops/addons/charts/agent-gateway'
  # Same syncPolicy as _defaults.yaml plus RespectIgnoreDifferences. An entry's syncPolicy
  # replaces the default wholesale, so the default is repeated here, and a test fails if the
  # two drift apart. RespectIgnoreDifferences makes a sync leave the guardrail ID and version
  # alone, which the guardrail-binder Job writes into the prompt guard policies after
  # Crossplane creates the guardrails (templates/guardrail-binder.yaml).
  syncPolicy:
    automated:
      selfHeal: true
      allowEmpty: true
      prune: true
    retry:
      limit: -1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: agentgateway.dev
      kind: AgentgatewayPolicy
      jsonPointers:
        - /spec/backend/ai/promptGuard/request/0/bedrockGuardrails/identifier
        - /spec/backend/ai/promptGuard/request/0/bedrockGuardrails/version
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '9'
  selector:
    matchExpressions:
      - key: enable_agent_gateway
        operator: In
        values: ['true']
  valuesObject:
    global:
      awsRegion: '{{.metadata.annotations.aws_region}}'
      awsAccountId: '{{.metadata.annotations.aws_account_id}}'
      clusterName: '{{.metadata.annotations.aws_cluster_name}}'
      insecure: '{{default "false" (index .metadata.annotations "insecure")}}'
      keycloak:
        issuerUrl: '{{default (printf "https://%s/keycloak/realms/platform" (index .metadata.annotations "ingress_domain_name")) (index .metadata.annotations "oidc_issuer_url")}}'
        serviceName: '{{default "keycloak" (index .metadata.annotations "keycloak_service_name")}}'
        namespace: '{{default "keycloak" (index .metadata.annotations "keycloak_namespace")}}'
    # Agent guardrails switch. The SAME expression as crossplane-agentcore's and
    # oam-agent-components' guardrails.enabled (registry/agentcore.yaml).
    guardrails:
      enabled: '{{ if and (eq (index .metadata.labels "enable_agent_guardrails") "true") (eq (index .metadata.labels "enable_agent_gateway") "true") (eq (index .metadata.labels "enable_agent_core") "true") }}true{{ else }}false{{ end }}'
    ingress:
      enabled: true
      host: '{{index .metadata.annotations "ingress_domain_name"}}'
      # Agents get a dedicated hostname that is a SIBLING of the main ingress host
      # (same parent domain), so a single wildcard ACM cert covers both. For host
      # "idp.elamaras.people.aws.dev" the agents host is "agents.elamaras.people.aws.dev"
      # — both matched by "*.elamaras.people.aws.dev". (The old "agents.<full-host>"
      # default produced "agents.idp.elamaras..." which a single-level wildcard does
      # NOT cover, so the ALB never provisioned: "no certificate found for host".)
      # If the domain has no parent (bare apex), fall back to "agents.<host>".
      # The agent_gateway_host annotation, when set, overrides this entirely.
      # DNS: because the agents host is a sibling, the cluster's external-dns
      # must be allowed to manage the PARENT zone. An external-dns domain filter
      # scoped to ingress_domain_name only (a common default) silently skips
      # this host, and no Route53 record is created. Either widen the consumer's
      # external-dns domain filter to the parent zone, or create the record
      # yourself. See https://github.com/awslabs/open-agentic-platform/issues/116
      agentHost: '{{ $d := index .metadata.annotations "ingress_domain_name" }}{{ $parent := splitList "." $d | rest | join "." }}{{ $auto := ternary (printf "agents.%s" $parent) (printf "agents.%s" $d) (gt (len (splitList "." $d)) 2) }}{{ default $auto (index .metadata.annotations "agent_gateway_host") }}'
    mcpAuth:
      resourceMetadata:
        resource: '{{default "http://agentgateway-proxy.agentgateway-system.svc.cluster.local:8080/sse" (index .metadata.annotations "agent_gateway_resource_url")}}'
    # Secretless workload identity (Shape A): trust the cluster's own EKS OIDC
    # issuer as a second JWT provider so agent ServiceAccount tokens authenticate
    # without a secret.
    #
    # Reads THREE possible annotation names, because the clusters disagree on which
    # one they carry — verified live, not assumed: peeks-hub (the hub) has
    # eks_oidc_provider and neither of the others; oap-dev (a spoke) has
    # eks_oidc_issuer and oidcProvider and NOT eks_oidc_provider. Keying on
    # eks_oidc_provider alone left spokes with only the Keycloak provider, so every
    # agent ServiceAccount token 401'd with "token uses the unknown key ..." —
    # the gateway had no provider for that issuer at all. The three-way fallback
    # repairs existing spokes with no cluster mutation; whichever annotation a given
    # cluster actually carries wins, and the first with a non-empty value is used.
    workloadIdentity:
      issuer: '{{ $oidc := or (index .metadata.annotations "eks_oidc_provider") (index .metadata.annotations "eks_oidc_issuer") (index .metadata.annotations "oidcProvider") }}{{ $oidc }}'
      jwksHost: '{{ $oidc := or (index .metadata.annotations "eks_oidc_provider") (index .metadata.annotations "eks_oidc_issuer") (index .metadata.annotations "oidcProvider") }}{{ with $oidc }}oidc.eks.{{ index $.metadata.annotations "aws_region" }}.amazonaws.com{{ end }}'
      jwksPath: '{{ $oidc := or (index .metadata.annotations "eks_oidc_provider") (index .metadata.annotations "eks_oidc_issuer") (index .metadata.annotations "oidcProvider") }}{{ with $oidc }}{{ printf "%s/keys" (trimPrefix (printf "https://oidc.eks.%s.amazonaws.com" (index $.metadata.annotations "aws_region")) .) }}{{ end }}'
