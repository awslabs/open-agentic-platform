# AgentCore domain — Crossplane compositions for AgentCore and the OAM
# (KubeVela) ComponentDefinitions for agentic workloads.

crossplane-agentcore:
  namespace: crossplane-system
  defaultVersion: '0.1.0'
  path: 'gitops/addons/charts/crossplane-agentcore'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '4'
  selector:
    matchExpressions:
      - key: enable_agent_core
        operator: In
        values: ['true']
  valuesObject:
    global:
      awsRegion: '{{.metadata.annotations.aws_region}}'
      eksClusterName: '{{.metadata.annotations.aws_cluster_name}}'
      projectName: '{{default "agent-core" (index .metadata.annotations "agent_core_project_name")}}'
      networkMode: '{{default "PUBLIC" (index .metadata.annotations "agent_core_network_mode")}}'
    # Agent guardrails switch. The SAME expression as agent-gateway's
    # guardrails.enabled (registry/gateway.yaml) and oam-agent-components'
    # global.guardrails.enabled, so the three cannot disagree
    # (test_guardrails_enablement.py).
    guardrails:
      enabled: '{{ if and (eq (index .metadata.labels "enable_agent_guardrails") "true") (eq (index .metadata.labels "enable_agent_gateway") "true") (eq (index .metadata.labels "enable_agent_core") "true") }}true{{ else }}false{{ end }}'
      awsAccountId: '{{.metadata.annotations.aws_account_id}}'
  ignoreDifferences:
    - group: apiextensions.crossplane.io
      kind: Composition
      jsonPointers:
        - /spec/mode
        - /spec/publishConnectionDetailsWithStoreConfigRef
      jqPathExpressions:
        - .spec.resources[].readinessChecks
        - .spec.resources[].patches[].type
    - group: apiextensions.crossplane.io
      kind: CompositeResourceDefinition
      jsonPointers:
        - /metadata/annotations

# OAM Agent Components — KubeVela ComponentDefinitions for agentic workloads
# (agent, mcp-server, agentcore-memory). Requires KubeVela to be running
# (provisioned by the platform via appmod-blueprints' kubevela addon at
# sync-wave 3). Sync-wave 5 here ensures KubeVela CRDs and webhooks are
# established before these CRs are applied.
oam-agent-components:
  namespace: vela-system
  defaultVersion: '0.1.0'
  path: 'gitops/addons/charts/oam-agent-components'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '5'  # after kubevela (wave 3 on platform side)
  selector:
    matchExpressions:
      - key: enable_oam_components
        operator: In
        values: ['true']
  valuesObject:
    global:
      awsRegion: '{{.metadata.annotations.aws_region}}'
      clusterName: '{{.metadata.annotations.aws_cluster_name}}'
      # Tags the chart's IAM role(s) platform.gitops.io/prefix=<prefix> so a prefix-scoped
      # teardown finds and removes them. Empty when the cluster secret has no resource_prefix.
      resourcePrefix: '{{ default "" (index .metadata.annotations "resource_prefix") }}'
      # Scopes the generated bedrock-agentcore IAM Resource ARNs (browser-custom /
      # code-interpreter-custom) to THIS account. The chart defaults it to "*", so
      # omitting it silently re-widens the policy that main's 845e88fa narrowed.
      # Ported from gitops/addons/bootstrap/default/addons.yaml, which this registry
      # layer replaced — that file's edit on main has nowhere else to land.
      awsAccountId: '{{.metadata.annotations.aws_account_id}}'
      # Per-cluster isolation RuntimeClasses for the agent component
      # (properties.sandbox: true) and type: sandbox. Read from the cluster
      # secret, like aws_region, so a Nitro hub and a Kata spoke can disagree
      # without either overriding the chart. Defaults are the Nitro classes,
      # which EKS Auto Mode provisions on demand on k8s 1.36+.
      #
      #   absent  -> the default below
      #   none    -> "", which makes the component REJECT sandbox: true /
      #              sandboxMode: confidential at admission
      #   <value> -> that class
      #
      # `none` is a sentinel because ArgoCD types annotations as
      # map[string]string: `index` returns "" for an absent key and for a
      # present-but-empty one alike, so "" cannot carry "this cluster has no
      # class" and a word has to. Do NOT reach for sprig `default` or `hasKey`
      # here -- both are wrong in ways only a live ApplicationSet shows. Why, and
      # what each one breaks: docs/sandbox-agents/NITRO-DESIGN.md, "Registry
      # template pitfalls".
      #
      # To put a cluster on Kata: sandbox_runtime_class: kata-clh, and
      # confidential_sandbox_runtime_class: none, because Kata cannot attest.
      # A cluster below k8s 1.36 has no isolated-sandbox class at all, so
      # annotate it onto Kata or onto `none`.
      sandboxRuntimeClass: '{{ $v := index .metadata.annotations "sandbox_runtime_class" }}{{ if eq $v "none" }}{{ else if $v }}{{ $v }}{{ else }}isolated-sandbox{{ end }}'
      confidentialSandboxRuntimeClass: '{{ $v := index .metadata.annotations "confidential_sandbox_runtime_class" }}{{ if eq $v "none" }}{{ else if $v }}{{ $v }}{{ else }}confidential-sandbox{{ end }}'
      # Which of those class names are Nitro. See the chart's values.yaml:
      # the Nitro-only fields (networkIsolated, cedarPolicy, confidential mode)
      # are REJECTED on a class that is not in this list, because Kata ignores
      # them silently. Present-and-empty disables them all on this cluster.
      nitroSandboxRuntimeClasses: '{{ $v := index .metadata.annotations "nitro_sandbox_runtime_classes" }}{{ if eq $v "none" }}{{ else if $v }}{{ $v }}{{ else }}isolated-sandbox,confidential-sandbox{{ end }}'
      # Whether this cluster has the agent-sandbox operator, and therefore the
      # Sandbox* CRDs that `type: sandbox` renders into. Derived from the SAME
      # label that installs them, so a cluster cannot have the definition
      # registered and the CRDs missing without the component saying so.
      #
      # A label, not an annotation: enable_agent_sandbox is what the addon's own
      # selector matches on, and reading the selector's input is what keeps this
      # honest.
      sandboxOperator: '{{ if eq (index .metadata.labels "enable_agent_sandbox") "true" }}true{{ else }}false{{ end }}'
      # Whether this cluster runs the agent harness, so the agent component
      # accepts harness.mode: gate. The SAME expression as agent-evaluation's
      # harness.enabled (registry/observability.yaml), from the same labels,
      # so the two cannot disagree (test_harness_enablement.py). Off unless
      # BOTH enable_agent_evaluation and enable_agent_harness are "true": the
      # harness flag on a cluster without the agent-evaluation addon has no
      # verdict endpoint, so it must not let a gate render.
      agentEvaluation:
        harnessEnabled: '{{ if and (eq (index .metadata.labels "enable_agent_evaluation") "true") (eq (index .metadata.labels "enable_agent_harness") "true") }}true{{ else }}false{{ end }}'
      # Whether this cluster runs agent guardrails, so the agent component accepts
      # guardrails.enabled: true. The SAME expression as agent-gateway's
      # guardrails.enabled (registry/gateway.yaml), so the two cannot disagree.
      # Off unless enable_agent_guardrails, enable_agent_gateway and
      # enable_agent_core are all "true".
      guardrails:
        enabled: '{{ if and (eq (index .metadata.labels "enable_agent_guardrails") "true") (eq (index .metadata.labels "enable_agent_gateway") "true") (eq (index .metadata.labels "enable_agent_core") "true") }}true{{ else }}false{{ end }}'
      # Namespaces admitted to agents besides the gateway's (agent component
      # NetworkPolicy). The aiops-agent addon's chat-ui and incident-bridge call the
      # agent's Service directly from its own namespace, so that namespace is admitted
      # where the addon runs. Remove once both go through the gateway.
      agentGateway:
        extraIngressNamespaces: '{{ if eq (index .metadata.labels "enable_aiops_agent") "true" }}aiops-agent{{ end }}'
