syncPolicy:
  automated:
    selfHeal: true
    allowEmpty: true
    prune: true
  retry:
    limit: -1
    backoff:
      duration: 5s
      factor: 2
      maxDuration: 10m
  syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
syncPolicyAppSet:
  preserveResourcesOnDeletion: false
useSelectors: true
repoURLGit: '{{default "https://github.com/aws-samples/sample-open-agentic-platform.git" .metadata.annotations.addons_repo_url}}'
repoURLGitRevision: '{{default "main" .metadata.annotations.addons_repo_revision}}'
repoURLGitBasePath: '{{default "gitops/addons/" .metadata.annotations.addons_repo_basepath}}'

valueFiles:
  - default/addons
  - environments/{{.metadata.labels.environment}}/addons
  - clusters/{{.nameNormalized}}/addons
useValuesFilePrefix: true
valuesFilePrefix: 'tenants/{{.metadata.labels.tenant}}/'

########################################
# Observability — LLM Gateway
########################################

litellm:
  enabled: false
  namespace: litellm
  defaultVersion: '0.1.0'
  path: 'gitops/addons/charts/litellm'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '3'
  selector:
    matchExpressions:
      - key: enable_litellm
        operator: In
        values: ['true']
  valuesObject:
    global:
      awsRegion: '{{.metadata.annotations.aws_region}}'

########################################
# Observability — Tracing & Metrics
########################################

langfuse:
  enabled: true
  namespace: langfuse
  defaultVersion: '0.1.0'
  path: 'gitops/addons/charts/langfuse'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '5'
  selectorMatchLabels:
    enable_langfuse: "true"
  selector:
    matchExpressions:
      - key: enable_langfuse
        operator: In
        values: ['true']
  # Langfuse is a hub singleton (one Keycloak client, hub-domain redirect, shared
  # platform realm). It must run ONLY on the control-plane/hub. alwaysSelector is
  # honored regardless of the global useSelectors flag, so the generated
  # ApplicationSet matches only clusters whose `environment` label is control-plane
  # (the hub) — spoke langfuse apps are pruned. Spoke agents send traces to the hub
  # Langfuse via the OTel pipeline.
  alwaysSelector:
    matchExpressions:
      - key: environment
        operator: In
        values: ['control-plane']
  valuesObject:
    global:
      awsRegion: '{{.metadata.annotations.aws_region}}'
    clusterName: '{{.metadata.annotations.aws_cluster_name}}'
    ingress:
      enabled: true
      host: '{{.metadata.annotations.ingress_domain_name}}'
    keycloak:
      issuerUrl: '{{default (printf "https://%s/keycloak/realms/platform" .metadata.annotations.ingress_domain_name) (index .metadata.annotations "keycloak_issuer_url")}}'
      secretManagerKey: '{{.metadata.annotations.aws_cluster_name}}/keycloak-clients'
  # Suppress server-side defaulting that never converges under ServerSideApply
  # (OutOfSync with an empty diff while Healthy):
  #  - ExternalSecret: ESO defaults target.deletionPolicy / template.mergePolicy
  #    and per-data remoteRef strategy fields the chart does not declare.
  #  - StatefulSet: the API server defaults persistentVolumeClaimRetentionPolicy
  #    and volumeClaimTemplates subfields (apiVersion/kind/spec.volumeMode/status).
  # Business fields (remoteRef.key/property, container images, replicas, storage
  # requests) are outside these pointers, so real changes are still detected.
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /spec/target/deletionPolicy
        - /spec/target/template/mergePolicy
        - /spec/data/0/remoteRef/conversionStrategy
        - /spec/data/0/remoteRef/decodingStrategy
        - /spec/data/0/remoteRef/metadataPolicy
        - /spec/data/0/remoteRef/nullBytePolicy
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/persistentVolumeClaimRetentionPolicy
        - /spec/volumeClaimTemplates

jaeger:
  enabled: false
  namespace: jaeger
  chartName: jaeger
  defaultVersion: '3.4.1'
  chartRepository: 'https://jaegertracing.github.io/helm-charts'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '5'
  selector:
    matchExpressions:
      - key: enable_jaeger
        operator: In
        values: ['true']
  valuesObject:
    provisionDataStore:
      cassandra: false
    allInOne:
      enabled: true
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
    storage:
      type: memory
    agent:
      enabled: false
    collector:
      enabled: false
    query:
      enabled: false

otel-collector:
  enabled: true
  namespace: otel
  defaultVersion: '0.1.0'
  path: 'gitops/addons/charts/otel-collector'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '6'
  selector:
    matchExpressions:
      - key: enable_otel_collector
        operator: In
        values: ['true']
  valuesObject:
    global:
      awsRegion: '{{.metadata.annotations.aws_region}}'
    langfuse:
      enabled: true
      endpoint: 'https://{{.metadata.annotations.ingress_domain_name}}/api/public/otel'
      secretManagerKey: 'hub/langfuse-otel'
    bifrost:
      enabled: true
      scrapeEndpoint: 'bifrost.bifrost.svc.cluster.local:8080'
    amp:
      enabled: true
      remoteWriteEndpoint: '{{with (index .metadata.annotations "amp_endpoint_url")}}{{.}}{{end}}'
      clusterName: '{{.metadata.annotations.aws_cluster_name}}'
  # The External Secrets Operator / API server default several ExternalSecret
  # subfields that the chart does not declare (target.deletionPolicy=Retain,
  # target.template.mergePolicy=Replace, and per-data remoteRef strategy fields:
  # conversionStrategy/decodingStrategy/metadataPolicy/nullBytePolicy). Under
  # ServerSideApply these server-defaulted fields make ArgoCD report the
  # langfuse-otel-auth ExternalSecret perpetually OutOfSync (with an empty CLI
  # diff) while the app is Healthy, driving a selfHeal loop. Ignore the
  # ESO/server-managed fields. Real changes to remoteRef.key/property/secretKey
  # are NOT under these pointers, so they are still detected.
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /spec/target/deletionPolicy
        - /spec/target/template/mergePolicy
        - /spec/data/0/remoteRef/conversionStrategy
        - /spec/data/0/remoteRef/decodingStrategy
        - /spec/data/0/remoteRef/metadataPolicy
        - /spec/data/0/remoteRef/nullBytePolicy
        - /spec/data/1/remoteRef/conversionStrategy
        - /spec/data/1/remoteRef/decodingStrategy
        - /spec/data/1/remoteRef/metadataPolicy
        - /spec/data/1/remoteRef/nullBytePolicy

prometheus-operator-crds:
  enabled: true
  namespace: monitoring
  chartName: prometheus-operator-crds
  defaultVersion: '28.0.1'
  chartRepository: 'https://prometheus-community.github.io/helm-charts'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '5'
  selector:
    matchExpressions:
      - key: enable_monitoring
        operator: In
        values: ['true']
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /metadata/annotations

########################################
# AgentCore — Crossplane Compositions
########################################

crossplane-agentcore:
  enabled: true
  namespace: crossplane-system
  defaultVersion: '0.1.0'
  path: 'gitops/addons/charts/crossplane-agentcore'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '4'
  selector:
    matchExpressions:
      - key: enable_agent_core
        operator: In
        values: ['true']
  valuesObject:
    global:
      awsRegion: '{{.metadata.annotations.aws_region}}'
      eksClusterName: '{{.metadata.annotations.aws_cluster_name}}'
      projectName: '{{default "agent-core" (index .metadata.annotations "agent_core_project_name")}}'
      networkMode: '{{default "PUBLIC" (index .metadata.annotations "agent_core_network_mode")}}'
  ignoreDifferences:
    - group: apiextensions.crossplane.io
      kind: Composition
      jsonPointers:
        - /spec/mode
        - /spec/publishConnectionDetailsWithStoreConfigRef
      jqPathExpressions:
        - .spec.resources[].readinessChecks
        - .spec.resources[].patches[].type
    - group: apiextensions.crossplane.io
      kind: CompositeResourceDefinition
      jsonPointers:
        - /metadata/annotations

########################################
# Bifrost — AI Gateway
########################################

bifrost:
  enabled: true
  namespace: bifrost
  defaultVersion: '0.1.0'
  # Local umbrella chart: wraps upstream maximhq/bifrost and adds the Crossplane
  # Pod Identity (Bedrock access) + ExternalSecret in the same Application.
  path: 'gitops/addons/charts/bifrost'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '5'
  selector:
    matchExpressions:
      - key: enable_bifrost
        operator: In
        values: ['true']
  valuesObject:
    podIdentity:
      clusterName: '{{.metadata.annotations.aws_cluster_name}}'
      region: '{{.metadata.annotations.aws_region}}'
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates

########################################
# AgentGateway — MCP Auth Gateway
########################################

gateway-api-crds:
  enabled: true
  namespace: agentgateway-system
  defaultVersion: '0.1.0'
  path: 'gitops/addons/charts/gateway-api-crds'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '7'
  selector:
    matchExpressions:
      - key: enable_agent_gateway
        operator: In
        values: ['true']
  valuesObject:
    gatewayApiVersion: "1.5.0"

agentgateway-crds:
  enabled: true
  namespace: agentgateway-system
  chartName: agentgateway-crds
  defaultVersion: 'v1.1.0'
  chartRepository: 'cr.agentgateway.dev'
  chartNamespace: charts
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '7'
  selector:
    matchExpressions:
      - key: enable_agent_gateway
        operator: In
        values: ['true']
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /metadata/annotations

agentgateway:
  enabled: true
  namespace: agentgateway-system
  chartName: agentgateway
  defaultVersion: 'v1.1.0'
  chartRepository: 'cr.agentgateway.dev'
  chartNamespace: charts
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '8'
  selector:
    matchExpressions:
      - key: enable_agent_gateway
        operator: In
        values: ['true']
  valuesObject:
    controller:
      extraEnv:
        KGW_ENABLE_GATEWAY_API_EXPERIMENTAL_FEATURES: "true"

agent-gateway:
  enabled: true
  namespace: agent-core-infra
  defaultVersion: '0.1.0'
  path: 'gitops/addons/charts/agent-gateway'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '9'
  selector:
    matchExpressions:
      - key: enable_agent_gateway
        operator: In
        values: ['true']
  valuesObject:
    global:
      keycloak:
        issuerUrl: '{{default (printf "https://%s/keycloak/realms/platform" (index .metadata.annotations "ingress_domain_name")) (index .metadata.annotations "keycloak_issuer_url")}}'
        serviceName: '{{default "keycloak" (index .metadata.annotations "keycloak_service_name")}}'
        namespace: '{{default "keycloak" (index .metadata.annotations "keycloak_namespace")}}'
    ingress:
      enabled: true
      host: '{{index .metadata.annotations "ingress_domain_name"}}'
      # Agents get a dedicated hostname that is a SIBLING of the main ingress host
      # (same parent domain), so a single wildcard ACM cert covers both. For host
      # "idp.elamaras.people.aws.dev" the agents host is "agents.elamaras.people.aws.dev"
      # — both matched by "*.elamaras.people.aws.dev". (The old "agents.<full-host>"
      # default produced "agents.idp.elamaras..." which a single-level wildcard does
      # NOT cover, so the ALB never provisioned: "no certificate found for host".)
      # If the domain has no parent (bare apex), fall back to "agents.<host>".
      # The agent_gateway_host annotation, when set, overrides this entirely.
      agentHost: '{{ $d := index .metadata.annotations "ingress_domain_name" }}{{ $parent := splitList "." $d | rest | join "." }}{{ $auto := ternary (printf "agents.%s" $parent) (printf "agents.%s" $d) (gt (len (splitList "." $d)) 2) }}{{ default $auto (index .metadata.annotations "agent_gateway_host") }}'
    mcpAuth:
      resourceMetadata:
        resource: '{{default "http://agentgateway-proxy.agentgateway-system.svc.cluster.local:8080/sse" (index .metadata.annotations "agent_gateway_resource_url")}}'
    # Secretless workload identity (Shape A): trust the cluster's own EKS OIDC
    # issuer as a second JWT provider so agent ServiceAccount tokens authenticate
    # without a secret. Sourced from the eks_oidc_provider cluster-secret
    # annotation (set automatically by the platform cluster composition for
    # spokes; set manually on the hub — see gitops/DEPLOYMENT.md). When the
    # annotation is absent the value is empty and the workload provider is
    # omitted (humans-only via Keycloak).
    workloadIdentity:
      issuer: '{{ index .metadata.annotations "eks_oidc_provider" }}'
      jwksHost: '{{ with (index .metadata.annotations "eks_oidc_provider") }}oidc.eks.{{ index $.metadata.annotations "aws_region" }}.amazonaws.com{{ end }}'
      jwksPath: '{{ with (index .metadata.annotations "eks_oidc_provider") }}{{ printf "%s/keys" (trimPrefix (printf "https://oidc.eks.%s.amazonaws.com" (index $.metadata.annotations "aws_region")) .) }}{{ end }}'

# OAM Agent Components — KubeVela ComponentDefinitions for agentic workloads
# (agent, mcp-server, agentcore-memory). Requires KubeVela to be running
# (provisioned by the platform via appmod-blueprints' kubevela addon at
# sync-wave 3). Sync-wave 5 here ensures KubeVela CRDs and webhooks are
# established before these CRs are applied.
oam-agent-components:
  enabled: true
  namespace: vela-system
  defaultVersion: '0.1.0'
  path: 'gitops/addons/charts/oam-agent-components'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '5'  # after kubevela (wave 3 on platform side)
  selector:
    matchExpressions:
      - key: enable_oam_components
        operator: In
        values: ['true']
  valuesObject:
    global:
      awsRegion: '{{.metadata.annotations.aws_region}}'
      clusterName: '{{.metadata.annotations.aws_cluster_name}}'
      awsAccountId: '{{.metadata.annotations.aws_account_id}}'
