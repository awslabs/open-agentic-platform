apiVersion: core.oam.dev/v1beta1
kind: ComponentDefinition
metadata:
  annotations:
    definition.oam.dev/alias: ""
    definition.oam.dev/description: Declarative agent with blue-green deployment and pluggable memory
  name: agent
spec:
  schematic:
    cue:
      template: |
        // Agent ComponentDefinition with blue-green deployment and pluggable memory
        import (
        	"strings"
        	"encoding/json"
        )

        // Idempotent Bifrost Virtual Key mint script, run by the vkMintJob.
        //
        // Idempotency is keyed on the VK *name* (== the agent name), because Bifrost
        // generates the id and token, not the caller. We list VKs, reuse the token of
        // the one already named after this agent, and only POST a new one when absent.
        // The token is then written into the <name>-llm-vk Secret. Admin basic-auth
        // credentials come from the bifrost-admin Secret, so this keeps working once
        // the management API is closed (enforceAuthOnInference / auth_config).
        //
        // Fails closed: any Bifrost error leaves the Secret untouched and the Job
        // retries (backoffLimit). While enforcement is still off, a missing Secret is
        // harmless because the agent mounts it optional.
        let _vkMintScript = """
        	set -eu
        	VK_API="$BIFROST_URL/api/governance/virtual-keys"
        	AUTH="$BIFROST_ADMIN_USER:$BIFROST_ADMIN_PASS"

        	echo "Looking up existing virtual key named $AGENT_NAME"
        	LIST=$(wget -q -O- --auth-no-challenge --user="$BIFROST_ADMIN_USER" --password="$BIFROST_ADMIN_PASS" "$VK_API" || echo '')

        	# Extract the token ("value") of the VK whose "name" equals AGENT_NAME.
        	# kubectl's bundled jq is not present, so parse with a small sed/grep pass
        	# over the compact JSON objects.
        	VK=$(printf '%s' "$LIST" \\
        		| tr '}' '\\n' \\
        		| grep "\\"name\\":\\"$AGENT_NAME\\"" \\
        		| sed -n 's/.*"value":"\\([^"]*\\)".*/\\1/p' \\
        		| head -n1)

        	if [ -z "$VK" ]; then
        		echo "No existing VK; creating one"
        		MODELS=$(printf '%s' "$VK_ALLOWED_MODELS" | sed 's/,/","/g')
        		BODY=$(cat <<JSON
        	{
        	  "name": "$AGENT_NAME",
        	  "description": "Auto-minted per-agent key for $AGENT_NAME",
        	  "is_active": true,
        	  "provider_configs": [
        	    { "provider": "$VK_PROVIDER", "allowed_models": ["$MODELS"], "key_ids": ["*"], "weight": 1 }
        	  ],
        	  "budgets": [
        	    { "max_limit": $VK_BUDGET_MAX, "reset_duration": "$VK_BUDGET_RESET" }
        	  ],
        	  "rate_limit": {
        	    "request_max_limit": $VK_REQ_MAX, "request_reset_duration": "$VK_RL_RESET",
        	    "token_max_limit": $VK_TOKEN_MAX, "token_reset_duration": "$VK_RL_RESET"
        	  }
        	}
        	JSON
        	)
        		RESP=$(printf '%s' "$BODY" | wget -q -O- --auth-no-challenge \\
        			--user="$BIFROST_ADMIN_USER" --password="$BIFROST_ADMIN_PASS" \\
        			--header="Content-Type: application/json" --post-data="$BODY" "$VK_API")
        		VK=$(printf '%s' "$RESP" | sed -n 's/.*"value":"\\([^"]*\\)".*/\\1/p' | head -n1)
        	else
        		echo "Reusing existing VK for $AGENT_NAME"
        	fi

        	if [ -z "$VK" ]; then
        		echo "ERROR: could not obtain a virtual key value" >&2
        		exit 1
        	fi

        	echo "Writing VK into secret $SECRET_NAME"
        	kubectl create secret generic "$SECRET_NAME" \\
        		--namespace "$NAMESPACE" \\
        		--from-literal=vk="$VK" \\
        		--dry-run=client -o yaml | kubectl apply -f -
        	echo "Done."
        	"""

        // Build memory env vars from config
        let _memoryEnv = [
        	if parameter.memory != _|_ {
        		{
        			name:  "MEMORY_PROVIDER"
        			value: parameter.memory.provider
        		}
        	},
        	if parameter.memory != _|_ && parameter.memory.config != _|_ {
        		{
        			name:  "MEMORY_CONFIG"
        			value: json.Marshal(parameter.memory.config)
        		}
        	},
        ]

        output: {
        	apiVersion: "argoproj.io/v1alpha1"
        	kind:       "Rollout"
        	metadata: {
        		name:      context.name
        		namespace: context.namespace
        		labels: {
        			"app.kubernetes.io/name":      context.name
        			"app.kubernetes.io/component": "ai-agent"
        		}
        	}
        	spec: {
        		// Only set replicas when asked, so an hpa/cpuscaler trait can own the count
        		// without KubeVela reconciling it back and flapping.
        		if parameter.replicas != _|_ {
        			replicas: parameter.replicas
        		}
        		strategy: blueGreen: {
        			activeService:        context.name + "-stable"
        			previewService:       context.name + "-preview"
        			autoPromotionEnabled: parameter.autoPromotionEnabled
        			if parameter.autoPromotionSeconds != _|_ {
        				autoPromotionSeconds: parameter.autoPromotionSeconds
        			}
        			if parameter.scaleDownDelaySeconds != _|_ {
        				scaleDownDelaySeconds: parameter.scaleDownDelaySeconds
        			}
        		}
        		selector: matchLabels: "app.kubernetes.io/name": context.name
        		template: {
        			metadata: labels: "app.kubernetes.io/name": context.name
        			spec: {
        				serviceAccountName: context.name
        				containers: [{
        					name:  context.name
        					image: parameter.image
        					// Auto-instrument for tracing. This lived only in the generated YAML,
        					// so every regeneration silently deleted it and broke tracing
        					// (issue #50). It belongs in the image via AGENT_OBSERVABILITY_ENABLED
        					// rather than a hardcoded Python command, but until then it lives here,
        					// where regeneration preserves it.
        					if parameter.observability.mode == "decentralized" {
        						command: ["opentelemetry-instrument", "python", "-m", "app.main"]
        					}
        					ports: [{
        						name:          "a2a"
        						containerPort: 8083
        						protocol:      "TCP"
        					}]
        					env: [
        						{name: "AGENT_NAME", value: context.name},
        						{name: "AGENT_DESCRIPTION", value: parameter.description},
        						{name: "MODEL_ID", value: parameter.modelConfig.modelId},
        						{name: "SYSTEM_PROMPT", value: parameter.systemMessage},
        						{name: "PORT", value: "8083"},
        						{name: "LLM_GATEWAY_URL", value: parameter.modelConfig.llmGatewayUrl},
        						// The Bifrost virtual key. Two mutually exclusive sources:
        						//  - mint on (default): the mint Job writes <name>-llm-vk and the agent
        						//    reads it here via secretKeyRef. optional=true so the pod still
        						//    starts before the Job has run (and while enforcement is off), then
        						//    picks up the VK on its next restart. This is the same
        						//    "start now, converge later" stance the servers take elsewhere.
        						//  - mint off: fall back to the literal llmGatewayApiKey (empty by
        						//    default), preserving the previous behaviour for a static key.
        						if parameter.modelConfig.mintVirtualKey {
        							{
        								name: "LLM_GATEWAY_API_KEY"
        								valueFrom: secretKeyRef: {
        									name:     context.name + "-llm-vk"
        									key:      "vk"
        									optional: true
        								}
        							}
        						},
        						if !parameter.modelConfig.mintVirtualKey {
        							{name: "LLM_GATEWAY_API_KEY", value: parameter.modelConfig.llmGatewayApiKey}
        						},
        						// Observability env vars — mode-dependent
        						{name: "OTEL_SERVICE_NAME", value: context.name},
        						{name: "OTEL_TRACES_EXPORTER", value: "otlp"},
        						if parameter.observability.mode == "centralized" {
        							{name: "OTEL_EXPORTER_OTLP_ENDPOINT", value: "http://otel-collector.otel.svc.cluster.local:4318"}
        						},
        						if parameter.observability.mode == "decentralized" {
        							{name: "OTEL_PYTHON_DISTRO", value: "aws_distro"}
        						},
        						if parameter.observability.mode == "decentralized" {
        							{name: "OTEL_PYTHON_CONFIGURATOR", value: "aws_configurator"}
        						},
        						if parameter.observability.mode == "decentralized" {
        							{name: "OTEL_EXPORTER_OTLP_PROTOCOL", value: "http/protobuf"}
        						},
        						if parameter.observability.mode == "decentralized" {
        							{name: "OTEL_RESOURCE_ATTRIBUTES", value: "service.name=" + context.name}
        						},
        						if parameter.observability.mode == "decentralized" {
        							{name: "AGENT_OBSERVABILITY_ENABLED", value: "true"}
        						},
        						// Langfuse: direct OTLP from agent (Strands StrandsTelemetry)
        						{name: "LANGFUSE_PUBLIC_KEY", value: parameter.langfuse.publicKey},
        						{name: "LANGFUSE_SECRET_KEY", value: parameter.langfuse.secretKey},
        						{name: "LANGFUSE_BASE_URL", value: parameter.langfuse.baseUrl},
        					] + _memoryEnv + [
        						if len(parameter.mcpServers) > 0 {
        							{
        								name: "MCP_SERVER_NAMES"
        								value: strings.Join([for s in parameter.mcpServers {s.name}], ",")
        							}
        						},
        						for e in parameter.env {e},
        					]
        					livenessProbe: {
        						httpGet: {
        							path: "/health"
        							port: 8083
        						}
        						initialDelaySeconds: 10
        						periodSeconds:       30
        					}
        					readinessProbe: {
        						httpGet: {
        							path: "/health"
        							port: 8083
        						}
        						initialDelaySeconds: 5
        						periodSeconds:       10
        					}
        					if parameter.resources != _|_ {
        						resources: parameter.resources
        					}
        				}]
        			}
        		}
        	}
        }

        outputs: {
        	// Dedicated ServiceAccount — the agent's single identity anchor. The
        	// gateway-identity and aws-service-identity traits attach their
        	// capabilities to this SA (name == context.name).
        	serviceAccount: {
        		apiVersion: "v1"
        		kind:       "ServiceAccount"
        		metadata: {
        			name:      context.name
        			namespace: context.namespace
        			labels: "app.kubernetes.io/name": context.name
        		}
        	}

        	// ── Per-agent Bifrost Virtual Key minting ───────────────────────────────
        	// Every agent gets its own VK (identity + budget + rate limit) with no
        	// operator action. The Job is idempotent: it GETs the VK by id first and
        	// only POSTs when absent, so a redeploy reuses the existing key. It writes
        	// the token into <name>-llm-vk, which the Rollout mounts as
        	// LLM_GATEWAY_API_KEY. See gitops/addons/charts/bifrost/DESIGN.md.
        	if parameter.modelConfig.mintVirtualKey {
        		// Dedicated SA for the Job, distinct from the agent SA, so its Secret-write
        		// permission does not widen the agent's own identity.
        		vkMintServiceAccount: {
        			apiVersion: "v1"
        			kind:       "ServiceAccount"
        			metadata: {
        				name:      context.name + "-vk-mint"
        				namespace: context.namespace
        				labels: "app.kubernetes.io/name": context.name
        			}
        		}

        		// Least-privilege Role: create the VK Secret, and read/update only the one
        		// this agent owns (resourceNames cannot scope create, so create is unnamed).
        		vkMintRole: {
        			apiVersion: "rbac.authorization.k8s.io/v1"
        			kind:       "Role"
        			metadata: {
        				name:      context.name + "-vk-mint"
        				namespace: context.namespace
        				labels: "app.kubernetes.io/name": context.name
        			}
        			rules: [
        				{
        					apiGroups: [""]
        					resources: ["secrets"]
        					verbs: ["create"]
        				},
        				{
        					apiGroups: [""]
        					resources: ["secrets"]
        					resourceNames: [context.name + "-llm-vk"]
        					verbs: ["get", "update", "patch"]
        				},
        			]
        		}

        		vkMintRoleBinding: {
        			apiVersion: "rbac.authorization.k8s.io/v1"
        			kind:       "RoleBinding"
        			metadata: {
        				name:      context.name + "-vk-mint"
        				namespace: context.namespace
        				labels: "app.kubernetes.io/name": context.name
        			}
        			roleRef: {
        				apiGroup: "rbac.authorization.k8s.io"
        				kind:     "Role"
        				name:     context.name + "-vk-mint"
        			}
        			subjects: [{
        				kind:      "ServiceAccount"
        				name:      context.name + "-vk-mint"
        				namespace: context.namespace
        			}]
        		}

        		// The mint Job. Shell + wget approach (per DESIGN.md) — no CUE HTTP
        		// complexity. Idempotent, and safe to re-run on every redeploy.
        		vkMintJob: {
        			apiVersion: "batch/v1"
        			kind:       "Job"
        			metadata: {
        				name:      context.name + "-vk-mint"
        				namespace: context.namespace
        				labels: "app.kubernetes.io/name": context.name
        			}
        			spec: {
        				// Let a redeploy re-run the (idempotent) Job rather than erroring on an
        				// immutable completed Job with the same name.
        				ttlSecondsAfterFinished: 600
        				backoffLimit:            6
        				template: {
        					metadata: labels: "app.kubernetes.io/name": context.name
        					spec: {
        						serviceAccountName: context.name + "-vk-mint"
        						restartPolicy:      "OnFailure"
        						containers: [{
        							name:  "mint"
        							image: parameter.modelConfig.mintJobImage
        							env: [
        								{name: "AGENT_NAME", value: context.name},
        								{name: "NAMESPACE", value: context.namespace},
        								{name: "SECRET_NAME", value: context.name + "-llm-vk"},
        								{name: "BIFROST_URL", value: parameter.modelConfig.bifrostAdminUrl},
        								{name: "VK_PROVIDER", value: parameter.modelConfig.vkProvider},
        								{name: "VK_ALLOWED_MODELS", value: strings.Join(parameter.modelConfig.vkAllowedModels, ",")},
        								{name: "VK_BUDGET_MAX", value: "\(parameter.modelConfig.vkBudgetMaxUsd)"},
        								{name: "VK_BUDGET_RESET", value: parameter.modelConfig.vkBudgetResetDuration},
        								{name: "VK_REQ_MAX", value: "\(parameter.modelConfig.vkRequestMaxLimit)"},
        								{name: "VK_TOKEN_MAX", value: "\(parameter.modelConfig.vkTokenMaxLimit)"},
        								{name: "VK_RL_RESET", value: parameter.modelConfig.vkRateLimitResetDuration},
        								{
        									name: "BIFROST_ADMIN_USER"
        									valueFrom: secretKeyRef: {
        										name: parameter.modelConfig.bifrostAdminSecret
        										key:  parameter.modelConfig.bifrostAdminUsernameKey
        									}
        								},
        								{
        									name: "BIFROST_ADMIN_PASS"
        									valueFrom: secretKeyRef: {
        										name: parameter.modelConfig.bifrostAdminSecret
        										key:  parameter.modelConfig.bifrostAdminPasswordKey
        									}
        								},
        							]
        							command: ["/bin/sh", "-c", _vkMintScript]
        						}]
        					}
        				}
        			}
        		}
        	}

        	// Stable service (active)
        	stableService: {
        		apiVersion: "v1"
        		kind:       "Service"
        		metadata: {
        			name:      context.name + "-stable"
        			namespace: context.namespace
        			labels: "app.kubernetes.io/name": context.name
        		}
        		spec: {
        			selector: "app.kubernetes.io/name": context.name
        			ports: [{
        				name:        "a2a", port: 8083, targetPort: 8083, protocol: "TCP"
        				appProtocol: "kgateway.dev/a2a"
        			}]
        			type: "ClusterIP"
        		}
        	}

        	// Preview service (for blue-green)
        	previewService: {
        		apiVersion: "v1"
        		kind:       "Service"
        		metadata: {
        			name:      context.name + "-preview"
        			namespace: context.namespace
        			labels: "app.kubernetes.io/name": context.name
        		}
        		spec: {
        			selector: "app.kubernetes.io/name": context.name
        			ports: [{
        				name:        "a2a", port: 8083, targetPort: 8083, protocol: "TCP"
        				appProtocol: "kgateway.dev/a2a"
        			}]
        			type: "ClusterIP"
        		}
        	}

        	// Agent card ConfigMap
        	agentCard: {
        		apiVersion: "v1"
        		kind:       "ConfigMap"
        		metadata: {
        			name:      context.name + "-card"
        			namespace: context.namespace
        			labels: {
        				"app.kubernetes.io/name": context.name
        				"agent.dev/type":         "agent-card"
        			}
        		}
        		data: {
        			name:        context.name
        			description: parameter.description
        			model:       parameter.modelConfig.modelId
        		}
        		if parameter.memory != _|_ {
        			data: memoryProvider: parameter.memory.provider
        		}
        		if parameter.mcpServers != _|_ && len(parameter.mcpServers) > 0 {
        			data: mcpServers: strings.Join([for s in parameter.mcpServers {s.name}], ",")
        		}
        	}

        	// HTTPRoute for AgentGateway registration (optional)
        	if parameter.registerWithGateway {
        		gatewayRoute: {
        			apiVersion: "gateway.networking.k8s.io/v1"
        			kind:       "HTTPRoute"
        			metadata: {
        				name:      context.name
        				namespace: context.namespace
        				labels: "app.kubernetes.io/name": context.name
        			}
        			spec: {
        				parentRefs: [{
        					name:      "agentgateway-proxy"
        					namespace: parameter.gatewayNamespace
        				}]
        				rules: [{
        					matches: [{
        						path: {
        							type:  "PathPrefix"
        							value: "/" + context.name
        						}
        					}]
        					filters: [{
        						type: "URLRewrite"
        						urlRewrite: path: {
        							type:               "ReplacePrefixMatch"
        							replacePrefixMatch: "/"
        						}
        					}]
        					backendRefs: [{
        						name:      context.name + "-stable"
        						port:      8083
        						namespace: context.namespace
        					}]
        				}]
        			}
        		}
        	}

        }

        parameter: {
        	// Required fields
        	description:   string
        	systemMessage: string

        	// Image
        	image: *"public.ecr.aws/z0a4o2j5/strands-agent:latest" | string

        	// Optional fields with defaults
        	// +usage=Number of replicas. Omitted means 1, and omitting it also lets an
        	// autoscaler own the count.
        	//
        	// IMPORTANT: more than one replica is only safe when conversation state lives
        	// outside the pod. Agents cache one Agent object per session in memory
        	// (app/agent.py `_agents`), and there is no A2A session affinity available in
        	// this stack, so a follow-up request that lands on another pod starts from
        	// nothing. Verified: same contextId, one pod answered "Teal" and another said it
        	// had no such information. Set a memory provider first (the agentcore-memory
        	// trait, MEMORY_PROVIDER=agentcore), which attaches a session manager that
        	// rehydrates state on any pod. The previous default of 3 was unsafe for exactly
        	// this reason.
        	replicas?: int

        	// Blue-green deployment settings
        	autoPromotionEnabled:  *true | bool
        	autoPromotionSeconds:  *10 | int
        	scaleDownDelaySeconds: *30 | int

        	// AgentGateway registration
        	registerWithGateway: *true | bool
        	gatewayNamespace:    *"agentgateway-system" | string

        	// Model configuration
        	// Gateway is Bifrost (OpenAI-compatible endpoint at /v1). llmGatewayApiKey
        	// is the Bifrost virtual key (presented by the agent via the x-bf-vk header).
        	modelConfig: {
        		modelId:       *"claude-sonnet" | string
        		llmGatewayUrl: *"http://bifrost.bifrost.svc.cluster.local:8080/v1" | string
        		// Static fallback virtual key. Only used when mintVirtualKey is false;
        		// when minting is on the VK comes from the <name>-llm-vk Secret instead.
        		llmGatewayApiKey: *"" | string

        		// +usage=Automatically mint a per-agent Bifrost Virtual Key at deploy time.
        		// On (default) emits a mint Job that GET-then-POSTs the VK keyed on the
        		// agent name and writes it into the <name>-llm-vk Secret, which the agent
        		// mounts as LLM_GATEWAY_API_KEY. This is what gives each agent its own
        		// identity, budget, and rate limit at the gateway. Turn off only to pin a
        		// key by hand via llmGatewayApiKey.
        		mintVirtualKey: *true | bool
        		// +usage=Bifrost management API base URL the mint Job calls (no trailing /v1).
        		bifrostAdminUrl: *"http://bifrost.bifrost.svc.cluster.local:8080" | string
        		// +usage=Provider the minted VK is scoped to (Bifrost provider name).
        		vkProvider: *"bedrock" | string
        		// +usage=Models the minted VK may use. ["*"] allows all models on the provider.
        		vkAllowedModels: *["*"] | [...string]
        		// +usage=Monthly USD spend cap attached to the minted VK.
        		vkBudgetMaxUsd: *50.0 | number
        		// +usage=Budget reset window (Bifrost duration: 1h, 1d, 1w, 1M, 1Q, 1Y).
        		vkBudgetResetDuration: *"1M" | string
        		// +usage=Per-VK request cap per rate-limit window.
        		vkRequestMaxLimit: *5000 | int
        		// +usage=Per-VK token cap per rate-limit window.
        		vkTokenMaxLimit: *500000 | int
        		// +usage=Rate-limit reset window (Bifrost duration).
        		vkRateLimitResetDuration: *"1h" | string
        		// +usage=Container image for the mint Job. Needs a shell, wget/curl, and
        		// kubectl to write the Secret. bitnami/kubectl carries kubectl + wget.
        		mintJobImage: *"bitnami/kubectl:1.31" | string
        		// +usage=Kubernetes Secret holding the Bifrost admin credentials the mint
        		// Job authenticates with (created once at bootstrap, not per-agent). Keys
        		// default to username/password.
        		bifrostAdminSecret:      *"bifrost-admin" | string
        		bifrostAdminUsernameKey: *"username" | string
        		bifrostAdminPasswordKey: *"password" | string
        	}

        	// Langfuse direct OTLP (Strands StrandsTelemetry sends traces directly)
        	langfuse: {
        		publicKey: *"" | string
        		secretKey: *"" | string
        		baseUrl:   *"" | string
        	}

        	// Observability mode
        	// centralized: Agent → OTel Collector → Langfuse (traces) + AMP (metrics)
        	// decentralized: Agent → ADOT → CloudWatch GenAI Console (traces + logs + metrics)
        	observability: {
        		mode: *"centralized" | "decentralized"
        	}

        	// Memory configuration — pluggable providers
        	// mem0 providers: milvus, qdrant, opensearch, pgvector, redis, chroma, s3vectors
        	// native provider: agentcore (uses Strands session manager directly, not mem0)
        	memory?: {
        		provider: "milvus" | "qdrant" | "opensearch" | "pgvector" | "redis" | "chroma" | "s3vectors" | "agentcore"
        		config: {
        			// mem0 vector store providers
        			// milvus:     url, collectionName
        			// qdrant:     url, apiKey?
        			// opensearch: url, indexName
        			// pgvector:   host, port, user, password, dbName
        			// redis:      url, password?
        			// chroma:     host, port
        			// s3vectors:  bucket, region
        			// agentcore:  memoryId, region
        			{[string]: string}
