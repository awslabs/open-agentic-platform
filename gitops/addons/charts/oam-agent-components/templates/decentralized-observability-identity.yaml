{{- $roleName := include "oam-agent-components.cwObservabilityRoleName" . }}
{{- if .Values.decentralizedObservability.enabled }}
# IAM Role for agents using decentralized observability (CloudWatch GenAI)
# Grants CW Logs, X-Ray, and CW Metrics write access.
# One role per cluster, named after the cluster and tagged with the install prefix
# (templates/_helpers.tpl): IAM names are account-wide, so a fixed name was shared by
# every cluster and install in the account and was invisible to a prefix-based teardown.
apiVersion: iam.aws.upbound.io/v1beta1
kind: Role
metadata:
  name: {{ $roleName }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    crossplane.io/external-name: {{ $roleName }}
spec:
  forProvider:
    tags:
      {{- include "oam-agent-components.awsTags" . | nindent 6 }}
    assumeRolePolicy: |
      {
        "Version": "2012-10-17",
        "Statement": [{
          "Effect": "Allow",
          "Principal": {"Service": "pods.eks.amazonaws.com"},
          "Action": ["sts:AssumeRole", "sts:TagSession"]
        }]
      }
    inlinePolicy:
      - name: cloudwatch-xray-write
        policy: |
          {
            "Version": "2012-10-17",
            "Statement": [{
              "Effect": "Allow",
              "Action": [
                "logs:PutLogEvents",
                "logs:CreateLogGroup",
                "logs:CreateLogStream",
                "logs:DescribeLogGroups",
                "logs:DescribeLogStreams",
                "xray:PutTraceSegments",
                "xray:PutTelemetryRecords",
                "xray:GetSamplingRules",
                "xray:GetSamplingTargets",
                "cloudwatch:PutMetricData"
              ],
              "Resource": "*"
            }]
          }
---
# Pod Identity Association — binds default SA in default namespace to CW role
apiVersion: eks.aws.upbound.io/v1beta1
kind: PodIdentityAssociation
metadata:
  name: {{ include "oam-agent-components.cwObservabilityAssociationName" . }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  forProvider:
    clusterName: "{{ .Values.global.clusterName }}"
    namespace: {{ .Values.decentralizedObservability.namespace }}
    region: "{{ .Values.global.awsRegion | default "us-west-2" }}"
    # resolve: Always re-resolves the ARN on every reconcile. The default (IfNotPresent)
    # keeps an already-set forProvider.roleArn, so on an upgrade that renames the role this
    # existing association would stay on the old role while Argo CD prunes it. role_arn is
    # updated in place (UpdatePodIdentityAssociation).
    roleArnRef:
      name: {{ $roleName }}
      policy:
        resolve: Always
    serviceAccount: {{ .Values.decentralizedObservability.serviceAccount }}
{{- end }}
---
# TraitDefinition: attaches the shared CW observability IAM role to the
# agent's own ServiceAccount via a per-agent PodIdentityAssociation.
apiVersion: core.oam.dev/v1beta1
kind: TraitDefinition
metadata:
  annotations:
    definition.oam.dev/alias: ""
    definition.oam.dev/description: Grant a workload CloudWatch/X-Ray write access for decentralized observability via EKS Pod Identity
  name: decentralized-observability-identity
spec:
  appliesToWorkloads:
    - deployments.apps
    - rollouts.argoproj.io
  conflictsWith: []
  podDisruptive: false
  schematic:
    cue:
      template: |
        parameter: {
        	// +usage=IAM role name for CW/X-Ray write access (shared across all decentralized agents)
        	roleName: *"{{ $roleName }}" | string
        	// +usage=AWS region for the PodIdentityAssociation
        	region: *"{{ .Values.global.awsRegion }}" | string
        	// +usage=EKS cluster name
        	clusterName: *"{{ .Values.global.clusterName }}" | string
        }
        outputs: {
        	"\(context.name)-cw-pod-identity": {
        		apiVersion: "eks.aws.upbound.io/v1beta1"
        		kind:       "PodIdentityAssociation"
        		metadata: {
        			name: "\(context.name)-cw-observability"
        			annotations: {
        				"argocd.argoproj.io/sync-options": "SkipDryRunOnMissingResource=true"
        			}
        		}
        		spec: forProvider: {
        			clusterName:    parameter.clusterName
        			namespace:      context.namespace
        			region:         parameter.region
        			// resolve: Always so an existing association follows a renamed role
        			// instead of keeping the ARN it resolved first (see the cluster PIA above).
        			roleArnRef: {
        				name: parameter.roleName
        				policy: resolve: "Always"
        			}
        			serviceAccount: context.name
        		}
        	}
        }
