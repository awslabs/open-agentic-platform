        // "-" and "_") and regions contain no ".", so the first two "."-separated fields
        // identify the install without ambiguity; the region is there because the same
        // cluster name can exist in two regions of one account. It starts with the cluster
        // name, hence with the resource prefix, which the workshop's account sweep matches.
        // If that exceeds IAM's 128 characters: its first 100 characters, "-", 16 hex
