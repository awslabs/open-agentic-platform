global:
  awsRegion: us-west-2
  clusterName: ""
  # Install prefix (cluster secret resource_prefix annotation). Only used to tag the AWS
  # resources this chart creates with platform.gitops.io/prefix, the tag a prefix-scoped
  # teardown uses to find them. Empty: no prefix tag.
  resourcePrefix: ""
  # Default container image for the `agent` component, so an ordinary
  # Application does not name one ("imageless"). A cluster that mirrors the
  # image into its own registry overrides this once here, rather than every
  # Application setting `image` or the CUE default naming one account's
  # private ECR.
  #
  # It must be an image that emits the cluster-scoped
  # `agent:<cluster>/<namespace>/<name>` Langfuse trace tag, or continuous agent
  # evaluation cannot match the agent's traces: evaluation is then configured
  # and silently never scored. The tag is emitted by
  # applications/strands-agent-base (app/agent.py), so this default must point
  # at a build that includes it.
  #
  # v1.7.0 emits that tag next to the bare ['<agent>', 'source:chat'] tags, and
  # adds supervisor delegation (docs/agent-delegation/DESIGN.md §9 "Image
  # contract").
  # v1.8.0 sends the projected agentgateway ServiceAccount token on model calls when
  # LLM_GATEWAY_AUTH_MODE=workload-token, which the agent component sets for agents with
  # guardrails on (the guardrail routes need it). Agents without guardrails behave as in v1.7.0. THE IMAGE VERSION LINE: keep this tag in step with version in
  # applications/strands-agent-base/pyproject.toml, which the build scripts
  # there use as their default IMAGE_TAG.
  agentImage: public.ecr.aws/z0a4o2j5/strands-agent:v1.8.0
  # Account id for scoping IAM resource ARNs. "*" keeps generated ARNs valid when
  # the platform has not supplied it; the addon wiring passes the real value from
  # the cluster secret's aws_account_id annotation.
  awsAccountId: "*"
  # How agents identify themselves to MCP servers. Platform-owned: no developer
  # Application sets this. A string, because it is substituted into CUE as text.
  agentIdentity:
    # "false": agents present their OWN ServiceAccount identity to MCP servers, so the
    # gateway knows which agent is calling and allowedAgents / mcpAccess can restrict by
    # agent. "true": agents forward the user's Keycloak token (main's behaviour, the token
    # passthrough the MCP spec forbids).
    propagateCallerToken: "false"
    # Audience of the projected ServiceAccount token an agent sends to the agent gateway
    # (the MCP routes and, with guardrails on, the /llm routes). Must match the audience
    # the gateway's workload identity provider expects, and the gateway-identity trait default.
    workloadAudience: agentgateway
  # Namespace of the agentgateway-proxy Gateway. Platform-owned: agents admit ingress
  # only from this namespace (NetworkPolicy emitted by the agent component), and their
  # HTTPRoutes attach to the Gateway here by default. Set it where the gateway is
  # installed somewhere else; an application developer cannot change the ingress side.
  agentGateway:
    namespace: agentgateway-system
    # Comma-separated namespaces also admitted to agents, for callers that cannot go
    # through the gateway yet. Any pod in a listed namespace can name any user toward
    # every agent on the cluster, so keep it empty unless a known caller needs it. The
    # registry adds aiops-agent on clusters that run the aiops-agent addon, whose chat-ui
    # and incident-bridge call the agent's Service directly.
    extraIngressNamespaces: ""
  # Namespace of the agent-evaluation addon. Platform-owned. An agent whose harness block
  # is enabled admits ingress on TCP 8083 from the harness runner pods
  # (harness.oap.io/run: "true") in this namespace, because the harness Jobs call the
  # agent's <agent>-preview Service directly. Agents without a harness block do not.
  # Agent guardrails policy. Platform-owned; an application developer cannot change it.
  guardrails:
    # Whether this cluster runs agent guardrails. Not set by hand: the registry derives it
    # from the enable_agent_guardrails, enable_agent_gateway and enable_agent_core
    # cluster-secret labels with the same expression as agent-gateway's
    # guardrails.enabled, so the two cannot disagree. A string, because it is substituted
    # into CUE as text. This "false" is the default for a render outside the registry.
    enabled: "false"
    # Profile order, weakest first, comma separated. Same names in the same order as
    # agent-gateway guardrails.order (a test pins both). A profile an agent names must be
    # in this list, and it can only be raised, never lowered, below its namespace minimum.
    order: "observe,standard,strict"
    # Minimum profile for a namespace that requiredNamespaces does not list. Same value as
    # agent-gateway guardrails.defaultProfile.
    defaultProfile: standard
    # Namespaces with their own minimum, as comma separated namespace=profile pairs, for
    # example "team-payments=strict,team-b=standard". An agent in a listed namespace must
    # turn guardrails on (enabled: false is rejected) and cannot pick a profile below that
    # namespace's minimum. Empty by default. An application developer cannot set it.
    requiredNamespaces: ""
  agentEvaluation:
    namespace: agent-evaluation
    # Port of the verdict endpoint (Service agent-evaluation-harness-api) that the
    # harness AnalysisTemplate calls. Must match harness.api.port in the
    # agent-evaluation chart.
    harnessApiPort: 8081
    # Whether this cluster runs the agent harness. Not set by hand: the registry
    # entry (gitops/addons/registry/agentcore.yaml) derives it from the
    # enable_agent_evaluation and enable_agent_harness cluster-secret labels with
    # the same expression that sets harness.enabled on the agent-evaluation
    # addon, so the two cannot disagree. This "false" is the default for a render
    # outside the registry. With "false" the agent component REJECTS
    # harness.mode: gate at render, because without the verdict endpoint every
    # revision would abort. A string, because it is substituted into CUE as text.
    harnessEnabled: "false"
    # consecutiveErrorLimit of the harness AnalysisTemplate's verdict poll (every
    # 15 s). The run errors, and a gate revision aborts, after limit+1 polls in a
    # row get no answer, so this must exceed the agent-evaluation reconciler's
    # restart time (Recreate: the old pod stops first). 12 tolerates 13 polls,
    # 195 s when the connection is refused, up to 13 x 35 s when polls time out
    # (413 s measured on the hub with a NetworkPolicy drop).
    # Measured on the hub: a restart leaves the endpoint unanswered for 5 to 6 s,
    # the pod Ready after 19 to 22 s, plus up to 5 s for a cold image pull.
    # ceil((27 + 60) / 15) - 1 = 5 would cover that; 12 also covers a start on a
    # node that has to be created (not measured). Lower it only with a new
    # measurement. A string, like the other globals (KubeVela reads it with
    # strconv).
    harnessConsecutiveErrorLimit: "12"
  # RuntimeClass a sandboxed agent's pod selects for the DEFAULT trust model
  # (agent component, properties.sandbox: true, sandboxMode: isolated).
  # Platform-owned: an application developer cannot set this from their OAM,
  # because which isolation technology a cluster runs is ambient environment
  # config. The developer chooses the TRUST MODEL (sandboxMode), never the class.
  #
  # isolated-sandbox is AWS Nitro Sandboxes: a Firecracker microVM per pod,
  # hardware-isolated by the Nitro hypervisor. It is the default because it needs
  # NO node layer of our own -- on EKS Auto Mode (k8s >= 1.36) the class and a
  # sandbox-capable node are provisioned on demand, where every Kata class needs
  # the self-managed nested-virt pool (kata_nodepool) plus kata-deploy first.
  #
  # KATA IS STILL FULLY SUPPORTED and is one value away. Set this to kata-clh,
  # kata-qemu or kata-fc for a cluster whose Kata node layer is provisioned; the
  # agent component's rendering is identical either way, because the RuntimeClass
  # admission controller supplies the nodeSelector, tolerations and overhead for
  # whichever class is named. Prefer the per-cluster route: the
  # sandbox_runtime_class annotation on the cluster secret (see
  # gitops/addons/registry/agentcore.yaml), so a Nitro hub and a Kata spoke can
  # disagree without either overriding the chart.
  #
  # Leaving this EMPTY makes the agent component fail the render on sandbox: true,
  # rather than silently scheduling an unisolated runc pod.
  # See docs/sandbox-agents/NITRO-DESIGN.md.
  sandboxRuntimeClass: isolated-sandbox
  # RuntimeClass for sandboxMode: confidential -- the trust model where the PARENT
  # INSTANCE is untrusted, so a cluster administrator cannot read the pod's memory
  # and the guest attests to AWS KMS before any secret is released.
  #
  # Separate from sandboxRuntimeClass because the two are different security
  # boundaries, not two spellings of one: confidential-sandbox additionally
  # encrypts the overlay, denies exec and stdin from the host, and measures the
  # pod's Cedar policy into PCR17.
  #
  # Kata HAS NO EQUIVALENT. On a Kata-only cluster leave this empty: the agent
  # component then fails the render on sandboxMode: confidential, rather than
  # quietly handing out a kata-clh pod that cannot attest anything.
  confidentialSandboxRuntimeClass: confidential-sandbox
  # Which RuntimeClass names are AWS Nitro Sandboxes classes.
  #
  # networkIsolated, cedarPolicy / PCR17 attestation and confidential mode are
  # all features of the NITRO runtime. A Kata class accepts a pod carrying them
  # and IGNORES them: the sandbox.amazonaws.com/policy annotation means nothing
  # to kata-clh, and a "network-isolated" Kata pod has an ordinary network
  # device. That is the worst failure shape available -- the Application renders,
  # the agent card advertises the guarantee, and the guarantee is absent.
  #
  # So the components check the class they are about to emit against this list
  # and REJECT those fields when it is not here, rather than rendering a pod that
  # lies about its own isolation.
  #
  # A cluster that names its Nitro classes something else adds those names here;
  # the list is comma-separated, platform-owned (no Application can set it), and
  # per-cluster via the nitro_sandbox_runtime_classes annotation on the cluster
  # secret. Emptying it disables every Nitro-only field on this cluster.
  nitroSandboxRuntimeClasses: "isolated-sandbox,confidential-sandbox"
  # Whether the agent-sandbox OPERATOR is installed on this cluster, which is the
  # only source of the SandboxTemplate / SandboxWarmPool / SandboxClaim CRDs.
  # A string, because it is substituted into CUE as text.
  #
  # "false" by default, and that default is load-bearing. This chart ships to
  # EVERY cluster, so the `sandbox` ComponentDefinition is registered on spokes
  # too -- while the CRDs come only from the agent_sandbox addon, which is off on
  # spokes. Without this value a `type: sandbox` Application on a spoke is
  # ADMITTED and then fails on apply with "no matches for kind SandboxWarmPool",
  # which reads like a platform bug rather than a missing addon.
  #
  # The registry derives it from the enable_agent_sandbox label -- the same label
  # that installs the CRDs -- so the two cannot drift apart.
  sandboxOperator: "false"

# Decentralized observability Pod Identity
# Creates an IAM Role + PodIdentityAssociation for agents using
# observability.mode=decentralized (CloudWatch GenAI direct export).
decentralizedObservability:
  enabled: true
  # AWS name of the role. Empty (default): derived per cluster,
  # "<global.clusterName>-agent-cw-observability-role" with the cluster name lowercased and
  # "_" mapped to "-" (hashed when over 64 chars). global.clusterName is required: without
  # it no role is rendered and the decentralized-observability-identity trait fails the
  # render. IAM role names are account-wide, so a fixed name here is shared by every cluster
  # and install in the account. This is a platform setting: the trait always uses this role
  # and an Application cannot choose another one.
  roleName: ""
  namespace: "default"
  serviceAccount: "default"
