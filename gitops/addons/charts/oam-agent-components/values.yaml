global:
  awsRegion: us-west-2
  clusterName: ""
  # Install prefix (cluster secret resource_prefix annotation). Only used to tag the AWS
  # resources this chart creates with platform.gitops.io/prefix, the tag a prefix-scoped
  # teardown uses to find them. Empty: no prefix tag.
  resourcePrefix: ""
  # Default container image for the `agent` component, so an ordinary
  # Application does not name one ("imageless"). A cluster that mirrors the
  # image into its own registry overrides this once here, rather than every
  # Application setting `image` or the CUE default naming one account's
  # private ECR.
  #
  # It must be an image that emits the cluster-scoped
  # `agent:<cluster>/<namespace>/<name>` Langfuse trace tag, or continuous agent
  # evaluation cannot match the agent's traces: evaluation is then configured
  # and silently never scored. The tag is emitted by
  # applications/strands-agent-base (app/agent.py), so this default must point
  # at a build that includes it.
  #
  # v1.7.0 emits that tag next to the bare ['<agent>', 'source:chat'] tags, and
  # adds supervisor delegation (docs/agent-delegation/DESIGN.md §9 "Image
  # contract"). THE IMAGE VERSION LINE: keep this tag in step with version in applications/strands-agent-base/pyproject.toml,
  # which the build scripts there use as their default IMAGE_TAG.
  agentImage: public.ecr.aws/z0a4o2j5/strands-agent:v1.7.0-rc.1
  # Account id for scoping IAM resource ARNs. "*" keeps generated ARNs valid when
  # the platform has not supplied it; the addon wiring passes the real value from
  # the cluster secret's aws_account_id annotation.
  awsAccountId: "*"
  # How agents identify themselves to MCP servers. Platform-owned: no developer
  # Application sets this. A string, because it is substituted into CUE as text.
  agentIdentity:
    # "false": agents present their OWN ServiceAccount identity to MCP servers, so the
    # gateway knows which agent is calling and allowedAgents / mcpAccess can restrict by
    # agent. "true": agents forward the user's Keycloak token (main's behaviour, the token
    # passthrough the MCP spec forbids).
    propagateCallerToken: "false"
  # Namespace of the agentgateway-proxy Gateway. Platform-owned: agents admit ingress
  # only from this namespace (NetworkPolicy emitted by the agent component), and their
  # HTTPRoutes attach to the Gateway here by default. Set it where the gateway is
  # installed somewhere else; an application developer cannot change the ingress side.
  agentGateway:
    namespace: agentgateway-system
    # Comma-separated namespaces also admitted to agents, for callers that cannot go
    # through the gateway yet. Any pod in a listed namespace can name any user toward
    # every agent on the cluster, so keep it empty unless a known caller needs it. The
    # registry adds aiops-agent on clusters that run the aiops-agent addon, whose chat-ui
    # and incident-bridge call the agent's Service directly.
    extraIngressNamespaces: ""
  # Kata RuntimeClass a sandboxed agent's pod selects (agent component,
  # properties.sandbox: true). Platform-owned: an application developer cannot set
  # this from their OAM, because the VMM is ambient environment config.
  #
  # kata-clh is the platform's verified, default-on VMM. kata-qemu is a one-line
  # change -- it shares clh's node pool, taint and kata-deploy release. kata-fc
  # needs its node layer enabled FIRST (kata-nodepool kataFc.enabled plus the
  # agent_sandbox_kata_fc addon), or every sandboxed pod sits Pending forever
  # because no node carries katacontainers.io/kata-runtime-fc.
  #
  # Leaving this EMPTY makes the agent component fail the render on sandbox: true,
  # rather than silently scheduling an unisolated runc pod.
  # See docs/sandbox-agents/DESIGN.md.
  sandboxRuntimeClass: kata-clh

# Decentralized observability Pod Identity
# Creates an IAM Role + PodIdentityAssociation for agents using
# observability.mode=decentralized (CloudWatch GenAI direct export).
decentralizedObservability:
  enabled: true
  # AWS name of the role. Empty (default): derived per cluster,
  # "<global.clusterName>-agent-cw-observability-role" with the cluster name lowercased and
  # "_" mapped to "-" (hashed when over 64 chars). global.clusterName is required: without
  # it no role is rendered and the decentralized-observability-identity trait fails the
  # render. IAM role names are account-wide, so a fixed name here is shared by every cluster
  # and install in the account. This is a platform setting: the trait always uses this role
  # and an Application cannot choose another one.
  roleName: ""
  namespace: "default"
  serviceAccount: "default"
