apiVersion: v2
name: crossplane-keycloak
description: |
  Crossplane provider-keycloak, so the platform can provision Keycloak clients
  declaratively.

  Consumer is the MCP token exchange (mcp-server.cue, tokenExchange). That needs a
  confidential client with standard token exchange enabled whose secret lands in a
  Kubernetes Secret, plus one client per MCP server to act as that server's
  audience. No existing mechanism can produce those.
  See docs/architecture/agent-identity-and-token-exchange.md.
type: application
version: 0.1.0
appVersion: "3.1.0"
