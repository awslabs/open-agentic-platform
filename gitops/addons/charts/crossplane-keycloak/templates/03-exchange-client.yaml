{{- if .Values.exchange.enabled }}
{{- /*
Keycloak objects for the MCP token exchange (mcp-server.cue, tokenExchange).

THE MECHANISM, established empirically against live Keycloak 26.x rather than from
docs. Three things must be true before `audience=<server>` yields a token audienced
to that server, and each was confirmed by observing the failure when it was absent:

  1. The exchange client must have standard token exchange enabled, or Keycloak
     rejects the grant outright.
  2. The exchange client must appear in the SUBJECT token's `aud`. Without it:
         access_denied - Client is not within the token audience
     and that holds even when no `audience` parameter is sent. This is what the
     AudienceProtocolMapper on each caller client below provides.
  3. The requested audience must already be resolvable in the exchanged token.
     Keycloak's `audience` parameter FILTERS, it never adds, so an unknown target
     gives:
         invalid_request - Requested audience not available: <target>
     The per-server mapper that fixes this is emitted by mcp-server.cue, attached to
     the exchange client created here.

With all three in place, `audience=<server>` returns `aud = <server>` exactly, with
`sub` still the user and `realm_access` intact (so the gateway's existing CEL still
passes). Verified for two different targets from one exchange client.
*/ -}}
{{- /*
MODE MATTERS, because every cluster running this chart points at the SAME Keycloak
realm (Keycloak is hub-only; spokes reach it over the public host). Two clusters both
CREATING this client would fight over one external object.

  mode: create  -> exactly ONE cluster, the hub. Creates the client and writes its
                   generated secret to a connection Secret.
  mode: adopt   -> every other cluster. import + Observe, so Crossplane only reads,
                   purely so this resource exists locally for the per-server
                   AudienceProtocolMapper's clientIdRef to resolve a UUID from.

Spokes need the resource to exist locally because clientIdRef resolves within the
cluster, but they must not own the external client.
*/ -}}
apiVersion: openidclient.keycloak.crossplane.io/v1alpha2
kind: Client
metadata:
  name: {{ .Values.exchange.clientId }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "4"
spec:
  providerConfigRef:
    name: default
{{- if eq .Values.exchange.mode "adopt" }}
  managementPolicies: ["Observe"]
{{- else }}
  writeConnectionSecretToRef:
    name: {{ .Values.exchange.secretName }}
    namespace: {{ .Values.namespace }}
{{- end }}
  forProvider:
{{- if eq .Values.exchange.mode "adopt" }}
    import: true
{{- end }}
    realmId: {{ .Values.exchange.realm | quote }}
    clientId: {{ .Values.exchange.clientId | quote }}
    name: {{ .Values.exchange.clientId | quote }}
    description: "Gateway client for RFC 8693 token exchange to MCP servers (managed by OAP)"
    # CONFIDENTIAL so there is a secret to authenticate the exchange with. The
    # generated secret lands in the connection Secret above under key `clientSecret`,
    # which is the key the policy's clientAuth.secretRef reads by default.
    accessType: CONFIDENTIAL
    standardTokenExchangeEnabled: true
    # This client never authenticates a user; it only exchanges tokens minted
    # elsewhere. So every user-facing flow stays off.
    standardFlowEnabled: false
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false

{{- if eq .Values.exchange.mode "create" }}
{{- range .Values.exchange.callerClients }}
---
{{- /*
Adopts the pre-existing caller client {{ . }} WITHOUT managing it.

`import: true` means "assume this client already exists and import it into state
instead of creating it", and the provider documents that such a client is not removed
on destruction. `managementPolicies: [Observe]` then makes this read-only: Crossplane
resolves the client's Keycloak UUID into status so the mapper below can reference it,
and never writes to the client.

That read-only stance is deliberate. These clients are created by the platform's
Keycloak bootstrap Job (a hardcoded script in appmod's keycloak chart, with no values
hook), so OAP does not own their fields and must not reset any it fails to restate.
*/ -}}
apiVersion: openidclient.keycloak.crossplane.io/v1alpha2
kind: Client
metadata:
  name: {{ $.Values.exchange.clientId }}-caller-{{ . }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "4"
spec:
  providerConfigRef:
    name: default
  managementPolicies: ["Observe"]
  forProvider:
    realmId: {{ $.Values.exchange.realm | quote }}
    clientId: {{ . | quote }}
    import: true
---
{{- /*
Puts the exchange client into {{ . }}'s token audience, which is prerequisite 2 above.

An audience protocol mapper is the mechanism that avoids touching anything shared. The
alternative that was tested first — a client role on the exchange client added to the
realm's `default-roles-platform` composite — also works and needs no per-user step, but
it would mean managing that composite's membership as a WHOLE LIST of role IDs
(the provider's defaults Roles resource owns `defaultRoles` entirely), so a mistake
would silently strip users of `offline_access`, `uma_authorization`, `manage-account`
or `view-profile`. Not worth it to add one audience.

addToAccessToken is the one that matters: the exchange reads the access token.
*/ -}}
apiVersion: openidgroup.keycloak.crossplane.io/v1alpha1
kind: AudienceProtocolMapper
metadata:
  name: {{ $.Values.exchange.clientId }}-aud-on-{{ . }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "5"
spec:
  providerConfigRef:
    name: default
  forProvider:
    realmId: {{ $.Values.exchange.realm | quote }}
    name: {{ $.Values.exchange.clientId }}-audience
    clientIdRef:
      name: {{ $.Values.exchange.clientId }}-caller-{{ . }}
    includedClientAudience: {{ $.Values.exchange.clientId | quote }}
    addToAccessToken: true
    addToIdToken: false
{{- end }}
{{- end }}
{{- end }}
