{{- /*
Keycloak admin credentials for the provider, pulled from AWS Secrets Manager.

Why an ExternalSecret rather than templating the Secret: the password must not
reach git. The chart's credentials.create path exists only for throwaway clusters.

Why this works identically on the hub and on spokes, even though Keycloak is
hub-only:
  - The credential source is AWS Secrets Manager, not an in-cluster Secret, so a
    spoke does not need to read across clusters. Verified: the spoke's
    external-secrets role (oap-dev-external-secrets-role) carries
    SecretsManagerReadWrite, and both clusters live in the same account.
  - The `url` the provider connects to is Keycloak's PUBLIC host, derived per
    cluster from the oidc_issuer_url annotation by the addon registry. Same
    reasoning as keycloak-backend.yaml: a cluster-internal Service reference
    resolves to nothing on a spoke, so the public URL is the one code path that
    works on both.

The provider wants a single JSON blob, so target.template assembles it: the
password comes from Secrets Manager, everything else from chart values. ESO's
template engine substitutes {{ .adminPassword }} from the fetched `data` entry
below; the surrounding Helm quoting emits that as a literal for ESO to resolve.

Sync-wave 2, alongside the Provider, so the Secret exists before the
ProviderConfig at wave 3 references it.
*/ -}}
{{- if and (not .Values.credentials.create) .Values.credentials.externalSecret.enabled }}
{{- if not .Values.credentials.externalSecret.secretManagerKey }}
{{- fail "credentials.externalSecret.enabled is true but secretManagerKey is empty" }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.credentials.secretName }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.credentials.externalSecret.clusterSecretStore }}
  refreshInterval: {{ .Values.credentials.externalSecret.refreshInterval | quote }}
  target:
    name: {{ .Values.credentials.secretName }}
    creationPolicy: Owner
    template:
      # v1 of the ESO API names this engineVersion, not engine; v2 is the only
      # accepted value and is the default. Kept explicit so the templating dialect
      # is visible at the call site.
      engineVersion: v2
      data:
        {{ .Values.credentials.secretKey }}: |
          {
            "client_id": {{ .Values.credentials.clientId | quote }},
            "username": {{ .Values.credentials.username | quote }},
            "password": "{{ "{{ .adminPassword }}" }}",
            "url": {{ required "global.keycloak.url is required (supplied per cluster by the addon registry)" .Values.global.keycloak.url | quote }},
            "base_path": {{ .Values.global.keycloak.basePath | quote }},
            "realm": {{ .Values.global.keycloak.adminRealm | quote }}
          }
  data:
    - secretKey: adminPassword
      remoteRef:
        key: {{ .Values.credentials.externalSecret.secretManagerKey }}
        property: {{ .Values.credentials.externalSecret.passwordProperty }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- end }}
