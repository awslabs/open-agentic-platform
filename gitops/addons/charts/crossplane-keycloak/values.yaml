global:
  keycloak:
    # Public base URL of Keycloak, WITHOUT the realm path. The provider validates
    # and normalises this: it must be an absolute URL with scheme and host, must
    # not carry query parameters or a fragment, and a trailing "/" is stripped.
    # Per-cluster value comes from the addon registry, derived from the same
    # annotation the agent-gateway chart uses for its issuer URL.
    url: ""
    # Keycloak's http-relative-path. Kept separate from url because the provider
    # takes it as base_path; "/" is normalised to empty to avoid double slashes.
    basePath: /keycloak
    # Realm the provider authenticates against (NOT the realm it manages objects
    # in; that is per-resource). Admin credentials live in the master realm.
    adminRealm: master

# Crossplane provider. Pinned by tag; v3.1.0 is the newest release published to
# xpkg.upbound.io/crossplane-contrib/provider-keycloak (1055 tags, verified).
provider:
  version: "v3.1.0"
  # Resource requests for the provider pod.
  #
  # 512Mi/1Gi rather than Crossplane's 1Gi/2Gi default, from measurement on a hub
  # running ten providers: actual steady-state was 153-384Mi, so 1Gi requests
  # over-reserved ~3.4x. 512Mi keeps ~33% headroom over the observed high-water
  # mark. Upjet providers embed the Terraform provider plugin and load its
  # resource schema into memory, plus controller-runtime informer caches, which
  # is why the floor is a few hundred MiB rather than ~100Mi. Raise these if the
  # provider is OOMKilled or evicted. Same change proposed upstream for the
  # shared providers in aws-samples/appmod-blueprints#941.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  # Concurrency. The embedded terraform-provider-keycloak client is NOT safe for
  # concurrent use; the provider gives each in-flight reconcile its own client
  # from a per-ProviderConfig pool. clientPoolSize is therefore the real ceiling
  # on concurrent calls against Keycloak — raising maxConcurrentReconciles above
  # it only adds queueing. Defaults match the provider's own (10/5/5).
  maxReconcileRate: 10
  maxConcurrentReconciles: 5
  clientPoolSize: 5

# Admin credentials the provider uses to talk to Keycloak.
#
# Default path: an ExternalSecret pulls the admin password from AWS Secrets
# Manager and target.template assembles the JSON blob the provider expects, so no
# password reaches git. This works on the hub and on spokes alike, because the
# source is Secrets Manager rather than an in-cluster Secret and the Keycloak URL
# is the public host.
#
# credentials.create=true instead renders the Secret straight from values. Only
# for local or throwaway clusters: it puts the admin password into the rendered
# manifest and therefore into git if values are committed. Setting it disables the
# ExternalSecret path.
credentials:
  create: false
  secretName: keycloak-provider-credentials
  # Key holding the JSON credential blob the provider expects.
  secretKey: credentials
  clientId: admin-cli
  username: admin
  # Only read when create is true. Leave empty otherwise.
  password: ""
  externalSecret:
    enabled: true
    clusterSecretStore: aws-secrets-manager
    refreshInterval: 1h
    # Secrets Manager entry holding the Keycloak admin password. Verified to exist
    # as `peeks-hub/keycloak` with properties keycloak_admin_password,
    # keycloak_postgres_password, user_password. Supplied per cluster by the addon
    # registry so a spoke can point at the hub's entry.
    secretManagerKey: ""
    passwordProperty: keycloak_admin_password

# The Keycloak client the gateway authenticates as when exchanging a caller's token
# for one audienced to a specific MCP server (mcp-server.cue, tokenExchange).
#
# DEFAULT FALSE. Enabling this creates objects in the realm and changes the `aud` of
# tokens issued to the caller clients listed below, so turn it on deliberately.
exchange:
  enabled: false
  realm: platform
  clientId: agentgateway-exchange
  # Connection secret the provider writes the generated client secret into, under key
  # `clientSecret` — the key the policy's clientAuth.secretRef reads by default.
  # The policy's secretRef has no namespace field, so mcp-server.cue replicates this
  # Secret into each MCP server's namespace via a provider-kubernetes Object.
  secretName: agentgateway-exchange-idp
  # Clients users authenticate THROUGH. Each gets a read-only adoption (import +
  # Observe, never written) plus an audience mapper that puts the exchange client into
  # its tokens' `aud`. Without that, Keycloak rejects every exchange with
  # "Client is not within the token audience" — verified, and it applies even when no
  # audience parameter is sent.
  #
  # mcp-client is the agent-facing client created by the platform's Keycloak bootstrap.
  # Add any other client whose users should reach MCP servers through an agent.
  callerClients:
    - mcp-client

namespace: crossplane-system
