{{- /*
GitHub credentials for the HUB-side identities, pulled from AWS Secrets Manager.

Two DISTINCT credentials, deliberately not one shared token (review C1 — the
coder VM used to receive the orchestrator's full-power token):

  1. events       (argo-events ns)  — Argo Events EventSource: HMAC validation
                                       + repo read. Keys `token`+`webhook-secret`
                                       (key names are fixed by the EventSource
                                       spec, see 41-eventsource-github.yaml).
  2. orchestrator (release ns)      — df-run/df-iterate/df-merge workflows:
                                       opens the PR, maintains the sticky status
                                       comment, performs the merge. Key `token`.

The CODER credential is NOT here — it belongs to the agent-sandbox chart, which
runs on the spoke where the sandbox VMs live. Keeping them in separate SM secrets
means the spoke's ESO IRSA never needs read access to these hub tokens.

Sync-wave 0 (before the wave-1+ workflow/eventsource objects that consume it).
*/ -}}
{{- /* MUST be argo.namespace, NOT Release.Namespace: the df-run/df-iterate/
       df-merge WorkflowTemplates render into .Values.argo.namespace, and the
       Workflow pods resolve secretKeyRef in their OWN namespace. Secrets are
       namespace-scoped, so putting this in the release namespace would leave
       the workflows unable to read it. */ -}}
{{- $ns := .Values.argo.namespace -}}
{{- with .Values.github.externalSecret }}
{{- if and .enabled .secretManagerKey }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $.Values.github.tokenSecret }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    {{- include "dark-factory.labels" $ | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .clusterSecretStore | default "aws-secrets-manager" }}
  refreshInterval: {{ .refreshInterval | default "1h" | quote }}
  target:
    name: {{ $.Values.github.tokenSecret }}
    creationPolicy: Owner
  data:
    # ORCHESTRATOR token. Needs Metadata:read, Contents:write, Pull
    # requests:write, Commit statuses:write, Issues:write.
    #
    # Contents:write IS required (an earlier comment here said it was not):
    # fine-grained PATs gate PUT /pulls/{n}/merge on Contents, and merge.js also
    # DELETEs the branch ref afterwards. Issues:write is for comment.js's sticky
    # status comment. Branch protection remains the merge GATE (review C3) — it
    # is what stops a non-green or unapproved merge — but it is not a substitute
    # for the permission the merge call itself needs.
    - secretKey: {{ $.Values.github.tokenKey }}
      remoteRef:
        key: {{ .secretManagerKey }}
        property: {{ .property | default "token" }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- end }}
{{- end }}
{{- if .Values.trigger.argoEvents.enabled }}
{{- with .Values.trigger.argoEvents.externalSecret }}
{{- if and .enabled .secretManagerKey }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $.Values.trigger.argoEvents.githubSecret }}
  namespace: {{ $.Values.trigger.argoEvents.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    {{- include "dark-factory.labels" $ | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .clusterSecretStore | default "aws-secrets-manager" }}
  refreshInterval: {{ .refreshInterval | default "1h" | quote }}
  target:
    name: {{ $.Values.trigger.argoEvents.githubSecret }}
    creationPolicy: Owner
  data:
    # EVENTS token. With trigger.argoEvents.active=true (the default) this needs
    # Metadata:read + Contents:read + Webhooks:write (admin:repo_hook), since
    # Argo Events self-registers the repo webhook. It has no PR/merge rights and
    # never leaves the trusted hub. Set active=false to keep it read-only.
    - secretKey: token
      remoteRef:
        key: {{ .secretManagerKey }}
        property: {{ .tokenProperty | default "token" }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    # Shared HMAC string validating GitHub's X-Hub-Signature-256. Not a GitHub
    # credential — any strong random value, must match the repo webhook config.
    - secretKey: webhook-secret
      remoteRef:
        key: {{ .secretManagerKey }}
        property: {{ .webhookSecretProperty | default "webhook-secret" }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- end }}
{{- end }}
{{- end }}
