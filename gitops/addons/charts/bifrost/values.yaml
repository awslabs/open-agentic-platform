podIdentity:
  enabled: true
  clusterName: ""
  region: ""
  namespace: bifrost
  serviceAccountName: bifrost

# ── Admin credential bootstrap (templates/admin-init.yaml) ───────────────────
# Rendered when bifrost.bifrost.authConfig.isEnabled is true. A PreSync hook Job
# creates the Secret named by authConfig.existingSecret with a random password,
# only if the Secret is missing. Nothing is stored in git.
adminInit:
  image: alpine/k8s:1.31.0   # needs kubectl
  username: admin
# ── Metrics proxy (templates/metrics-proxy.yaml) ─────────────────────────────
# Serves /metrics to the OTel collector so the admin password stays in this
# namespace. Rendered when bifrost.bifrost.authConfig.isEnabled is true. The
# collector scrapes bifrost-metrics.<namespace>.svc (otel-collector chart,
# bifrost.scrapeEndpoint).
metricsProxy:
  enabled: true
  image: python:3.12-alpine
  port: 8080
  collectorNamespace: otel
# ── Harness judge key minter (templates/vk-minter.yaml) ──────────────────────
# Off by default. Turn on in the clusters that run the agent harness
# (agent-evaluation harness.enabled). A PostSync hook Job and a CronJob in this
# namespace create a budgeted, rate-limited virtual key and write it to ONE
# Secret in the evaluation namespace. The evaluation chart grants this
# ServiceAccount access to that Secret name only.
judgeKey:
  enabled: false
  image: python:3.12-alpine
  schedule: "*/15 * * * *"
  # Where the key goes. Must match harness.judge.virtualKey.secretRef in the
  # agent-evaluation chart; the namespace is the agent-evaluation release namespace.
  targetNamespace: agent-evaluation
  secretName: agent-evaluation-harness-judge-key
  # Bifrost model aliases the key may call.
  models: [judge-default]
  budget:
    maxLimitUsd: 20
    resetDuration: 1M
  rateLimit:
    requestMaxLimit: 2000
    requestResetDuration: 1h
# ── Pinned-ClusterIP Service (templates/static-service.yaml) ─────────────────
# A SECOND Service pointing at the same pods, at a fixed address, for clients
# that cannot use cluster DNS — today that is the Kata sandbox coder, which the
# agent-sandbox operator gives `dnsPolicy: None` + public resolvers, and which
# runs on a self-managed Karpenter node where this Auto Mode cluster provides no
# kube-dns Service at all.
#
# The main Service is NOT modified: it comes from the vendored subchart (no
# clusterIP knob) and spec.clusterIP is immutable, so pinning it in place would
# mean deleting and recreating it — an outage for every other Bifrost client.
# DNS-capable clients should keep using bifrost.bifrost.svc.cluster.local.
staticService:
  enabled: true
  # Distinct name so it cannot collide with the subchart's Service.
  name: bifrost-static
  # Fixed address, deliberately inside the STATIC subrange (172.20.0.0/24 of the
  # 172.20.0.0/16 service CIDR) that Kubernetes never allocates dynamically — so
  # it cannot be handed to another Service before this one is created. `.100`
  # echoes CoreDNS's conventional `.10`, so it is recognisable on sight.
  #
  # ⚠️ NOT .10 — Auto Mode's node-local DNS answers on 172.20.0.10 with no
  # Service object owning it, so the allocator thinks it is free.
  #
  # ⚠️ Immutable after creation. To change it, delete the bifrost-static Service
  # and let ArgoCD recreate it.
  #
  # ⚠️ COUPLED to two values in the agent-sandbox chart that must be changed
  # together — coderTemplate.bifrostUrl and networkPolicy.bifrostClusterIp
  # (the NetworkPolicy needs it as an ipBlock because VPC-CNI matches egress on
  # the ClusterIP *before* kube-proxy DNAT). Grep 172.20.0.100 before editing.
  clusterIP: 172.20.0.100
  port: 8080
  # Named port on the Bifrost container — tracks the subchart's own containerPort
  # rather than duplicating a number.
  targetPort: http
  # MUST match the subchart's Service selector or this Service resolves to zero
  # endpoints and sandbox requests fail with connection refused. Verified against
  # the live Service (bifrost-2.1.16) — re-check when bumping the subchart.
  selector:
    app.kubernetes.io/name: bifrost
    app.kubernetes.io/instance: bifrost
    app.kubernetes.io/component: server

bifrost:
  image:
    tag: "v1.5.0"
    pullPolicy: IfNotPresent
  serviceAccount:
    create: true
    name: bifrost
  # OTEL plugin — exports LLM call spans to the local OTel Collector.
  # Bifrost reads inbound W3C traceparent headers and creates child spans,
  # producing a unified trace tree with agent + Bifrost spans correlated.
  plugins:
    otel:
      enabled: true
      version: 1
      config:
        service_name: "bifrost"
        collector_url: "otel-collector.otel.svc.cluster.local:4317"
        trace_type: "genai_extension"
        protocol: "grpc"
        insecure: true
