{{- /*
  vk-minter.yaml — the platform minter for the agent harness judge key.

  A Bifrost virtual key is valid only in the Bifrost that created it, and every
  cluster runs its own Bifrost, so the key is created here, in the cluster. The
  minter runs in namespace `bifrost`, signs in with the admin Secret mounted
  only in this namespace, and writes the key into one Secret in the evaluation
  namespace. The admin credential never leaves namespace `bifrost`. The
  evaluation chart pre-creates that Secret and grants this ServiceAccount
  get/update/patch on that one name (templates/10-rbac.yaml in
  agent-evaluation). Where the harness is not enabled that Role is absent, the
  Secret read gets 403, and the minter exits 0 with a log line, so this hook
  does not fail the Bifrost sync. Old keys are deleted only when no harness Job
  is unfinished, checked again right before the delete.

  Runs as a PostSync hook (first key as soon as Bifrost is healthy) and as a
  CronJob (reconciles a deleted Secret, a changed configuration, a rotated
  key). Off by default; turn on with judgeKey.enabled where the harness runs.
  Script and tests: files/vk-minter.py.
*/ -}}
{{- $jk := .Values.judgeKey | default dict -}}
{{- if $jk.enabled }}
{{- $ns := .Release.Namespace | default "bifrost" }}
{{- $bf := .Values.bifrost | default dict -}}
{{- $inner := $bf.bifrost | default dict -}}
{{- $auth := $inner.authConfig | default dict -}}
{{- if not $auth.isEnabled }}{{ fail "judgeKey.enabled needs bifrost.bifrost.authConfig.isEnabled: the minter signs in to the management API" }}{{ end }}
{{- $adminSecret := $auth.existingSecret | default "bifrost-admin" }}
{{- $budget := $jk.budget | default dict }}
{{- $rl := $jk.rateLimit | default dict }}
{{- $port := ($bf.service | default dict).port | default 8080 }}
{{- $url := $jk.bifrostUrl | default (printf "http://bifrost.%s.svc.cluster.local:%v" $ns $port) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: bifrost-vk-minter
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: bifrost
    app.kubernetes.io/component: vk-minter
data:
  vk-minter.py: |
{{ .Files.Get "files/vk-minter.py" | indent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bifrost-vk-minter
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: bifrost
    app.kubernetes.io/component: vk-minter
{{- $ctx := dict "jk" $jk "url" $url "adminSecret" $adminSecret "userKey" ($auth.usernameKey | default "username") "passKey" ($auth.passwordKey | default "password") "budget" $budget "rl" $rl }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: bifrost-vk-minter
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: bifrost
    app.kubernetes.io/component: vk-minter
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bifrost
        app.kubernetes.io/component: vk-minter
    spec:
      {{- include "bifrost.minterPod" $ctx | nindent 6 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bifrost-vk-minter
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: bifrost
    app.kubernetes.io/component: vk-minter
spec:
  schedule: {{ $jk.schedule | default "*/15 * * * *" | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: bifrost
            app.kubernetes.io/component: vk-minter
        spec:
          {{- include "bifrost.minterPod" $ctx | nindent 10 }}
{{- end }}
