{{- /*
  admin-secret.yaml — provisions the admin-credentials Secret consumed by the
  upstream maximhq/bifrost subchart when governance admin auth is enabled
  (bifrost.bifrost.authConfig.isEnabled=true, existingSecret=<name>).

  The subchart only *reads* an existing Secret (injects BIFROST_ADMIN_USERNAME /
  BIFROST_ADMIN_PASSWORD env from it) and nothing else creates it, so a
  governance-enabled deploy otherwise fails at container start with
  CreateContainerConfigError: secret "bifrost-admin" not found.

  Credentials are deterministic (read from values, not randomly generated) so
  ArgoCD stays Synced — a random per-render value would differ on every
  server-side diff and churn the Secret endlessly. Override the password per
  environment via the fleet-config overlay when a stronger secret is desired.
*/ -}}
{{- $bf := .Values.bifrost | default dict -}}
{{- $inner := $bf.bifrost | default dict -}}
{{- $auth := $inner.authConfig | default dict -}}
{{- $admin := .Values.adminAuth | default dict -}}
{{- if $auth.isEnabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $auth.existingSecret | default "bifrost-admin" }}
  namespace: {{ .Release.Namespace | default "bifrost" }}
  labels:
    app.kubernetes.io/name: bifrost
    app.kubernetes.io/part-of: bifrost
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    # Apply ahead of the workload so the container can mount it on first start.
    argocd.argoproj.io/sync-wave: "-5"
type: Opaque
stringData:
  {{ $auth.usernameKey | default "username" }}: {{ $admin.username | default "admin" | quote }}
  {{ $auth.passwordKey | default "password" }}: {{ $admin.password | default "bifrost-admin" | quote }}
{{- end -}}
