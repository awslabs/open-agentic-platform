{{- /*
CODER GitHub credential, pulled from AWS Secrets Manager into the namespace where
the sandbox VMs run. Mounted read-only at /etc/secrets by 20-sandboxtemplate.yaml.

This is deliberately a SEPARATE credential from the hub-side orchestrator/events
tokens (review C1): the coder VM runs model-written code whose prompt is
attacker-controllable issue text, so it must not hold a token that can merge to
main, push to a protected branch, or administer webhooks.

Required permissions (target repo only) — the minimum entrypoint.js exercises:
  Metadata read, Issues read (GET /issues/{n} → SPEC.md), Contents write (push),
  Pull requests write (POST /pulls — THE CODER OPENS ITS OWN PR), Commit statuses
  write (POST /statuses/{sha} = dark-factory/implementation, the signal df-run
  polls for). NOT Webhooks:write — that belongs to the events credential.

This is NOT "Contents:write and nothing else"; that claim was wrong and made a
run fail at PR creation with a 403 after the model had already done the work.

⚠️ Fine-grained PATs gate PUT /pulls/{n}/merge on CONTENTS, so this token CAN
merge its own PR. Branch protection / a ruleset requiring the dark-factory/*
checks on the default branch is the only real prevention — and it is UNAVAILABLE
on private repos on the GitHub free plan (403 from both APIs). Verify protection
is actually in force before treating this boundary as real.

The remote SM secret stores the value under `token`; it is projected to the k8s
key `gh-token` because that is the filename the coder reads at /etc/secrets.

FOLLOW-UP (review C1 as written): this is a standing credential. The stronger
design mints a short-TTL GitHub App installation token per run and injects it via
the SandboxClaim, so the VM never holds a reusable secret. Tracked separately.
*/ -}}
{{- /*
GATED ON THE WARM POOL. Nothing consumes this credential unless a sandbox is actually
instantiated from the `coder-sandbox` SandboxTemplate, and the warm pool is what does that
(Dark Factory claims FROM the pool rather than creating sandboxes directly). With
warmPool.enabled=false there is no consumer, so rendering the ExternalSecret only creates a
resource that points at a Secrets Manager key the deployment never provisioned:

  SecretSyncedError: could not get secret data from provider

which ArgoCD reports as a permanently Degraded Application — agent-sandbox, and its parent
agent-platform-addons with it — for a capability the cluster deliberately did not enable.
The chart cannot detect whether the key exists, so it keys off the thing that needs it.

A cluster running the Dark Factory has the warm pool on, so this is a no-op there.
*/ -}}
{{- if and .Values.coderTemplate.secretsMount.enabled .Values.warmPool.enabled }}
{{- with .Values.coderTemplate.secretsMount.externalSecret }}
{{- if and .enabled .secretManagerKey }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $.Values.coderTemplate.secretsMount.secretName }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    # Before the wave-2 SandboxTemplate/warm pool that mounts it.
    argocd.argoproj.io/sync-wave: "0"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .clusterSecretStore | default "aws-secrets-manager" }}
  refreshInterval: {{ .refreshInterval | default "1h" | quote }}
  target:
    name: {{ $.Values.coderTemplate.secretsMount.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ $.Values.coderTemplate.secretsMount.key | default "gh-token" }}
      remoteRef:
        key: {{ .secretManagerKey }}
        property: {{ .property | default "token" }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- end }}
{{- end }}
{{- end }}
