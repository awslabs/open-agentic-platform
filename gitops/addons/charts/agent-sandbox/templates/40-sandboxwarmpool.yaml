{{- if .Values.warmPool.enabled }}
{{- /*
Native SandboxWarmPool (operator v0.5.0+). The operator keeps `replicas` idle
sandboxes pre-warmed from the referenced SandboxTemplate; a consumer (the Dark
Factory) binds one via a SandboxClaim and the operator refills the buffer. This
replaces the custom pool-manager CronJob — the warm pool is now a first-class
operator primitive (requires the vendored v0.5.1 upstream, NOT v0.1.0).
*/ -}}
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: {{ .Values.warmPool.name | default "coder-warmpool" }}
  namespace: {{ include "agent-sandbox.namespace" . }}
  labels:
    {{- include "agent-sandbox.labels" . | nindent 4 }}
spec:
  # Target number of pre-warmed idle sandboxes (the warm buffer).
  replicas: {{ .Values.warmPool.targetIdle }}
  sandboxTemplateRef:
    name: {{ .Values.warmPool.templateName }}
{{- end }}
