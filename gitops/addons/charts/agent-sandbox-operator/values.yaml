namespace:
  # create controls whether the namespace is created by this chart.
  #
  # Keep this TRUE. This addon is sync-wave 0 and the agent-sandbox capability
  # chart is wave 2, so creating the namespace here guarantees it exists — with
  # the PSS labels below — before any workload is placed in it. The addon default
  # syncOption CreateNamespace=true would otherwise create it implicitly and
  # UNLABELLED, silently disabling Pod Security enforcement.
  create: true
  name: agent-sandbox-system
  # ⚠️ LOCAL DEVIATION from upstream (see templates/namespace.yaml) — extra labels
  # merged onto the Namespace. Upstream has no such knob.
  #
  # Set to the PSS labels in the registry entry (registry/sandbox.yaml). Use
  # `baseline`, NOT `restricted`: this namespace hosts BOTH the coder sandboxes
  # AND this controller, and neither the controller nor the kata tooling is
  # restricted-compliant (live-test lesson: restricted here blocks the controller
  # pod entirely). The coder sandboxes get their real isolation from the Kata
  # micro-VM boundary plus the restricted securityContext baked into the
  # SandboxTemplate pod spec — not from namespace PSS.
  labels: {}

image:
  repository: registry.k8s.io/agent-sandbox/agent-sandbox-controller
  tag: ""  # required, eg. v0.3.10
  pullPolicy: IfNotPresent

replicaCount: 1

# podAnnotations are added to the controller pod template.
# Useful for service-mesh sidecar injection toggles, Prometheus scrape
# autodiscovery (e.g. Datadog `ad.datadoghq.com/...`), or any platform-
# specific pod-level annotation.
podAnnotations: {}
  # ad.datadoghq.com/agent-sandbox-controller.check_names: '["openmetrics"]'
  # ad.datadoghq.com/agent-sandbox-controller.init_configs: '[{}]'
  # ad.datadoghq.com/agent-sandbox-controller.instances: |
  #   [{"openmetrics_endpoint": "http://%%host%%:8080/metrics", "namespace": "agent_sandbox", "metrics": [".*"]}]

# podLabels are added to the controller pod template, in addition to
# the chart's selector labels. Useful for cost-allocation labels,
# network policy selectors, or pod-level metadata.
podLabels: {}
  # team: platform

controller:
  ##### Unset flags are omitted
  # clusterDomain: "cluster.local"
  leaderElect: true
  # leaderElectionNamespace: ""
  extensions: false
  # enableTracing: false
  # enablePprof: false
  # enablePprofDebug: false
  # pprofBlockProfileRate: 1000000
  # pprofMutexProfileFraction: 10
  # kubeApiQps: -1.0
  # kubeApiBurst: 10
  # sandboxConcurrentWorkers: 1
  ##### The following workers are only active when controller.extensions=true.
  # sandboxClaimConcurrentWorkers: 50
  # sandboxWarmPoolConcurrentWorkers: 1
  # sandboxTemplateConcurrentWorkers: 1
  ##### extraArgs passes additional flags not listed above (e.g. zap logging flags).
  extraArgs: []

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 128Mi
  # requests:
  #   cpu: 10m
  #   memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Pod-level securityContext (spec.template.spec.securityContext). Default null — omitted unless set.
# Example for Kyverno / restricted Pod Security:
# podSecurityContext:
#   runAsNonRoot: true
#   seccompProfile:
#     type: RuntimeDefault
podSecurityContext: null

# Container-level securityContext for the controller. Default null — omitted unless set.
# Example:
# containerSecurityContext:
#   allowPrivilegeEscalation: false
#   capabilities:
#     drop:
#       - ALL
#   runAsNonRoot: true
#   seccompProfile:
#     type: RuntimeDefault
containerSecurityContext: null

# Name of the webhook service.
webhookServiceName: agent-sandbox-webhook-service
