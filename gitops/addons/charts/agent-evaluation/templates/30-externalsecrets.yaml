{{- /*
Credentials. Both are read from Secrets Manager into this namespace only, never
into an agent namespace, and never written as a literal into a chart value.

langfuse: the seeded project's public/secret key pair — the same pair the OTel
Collector uses for ingestion, so no admin key is minted. The short refresh
mirrors the collector's: on a fresh environment the langfuse addon's
push-otel-keys Sync hook may land after this ExternalSecret's first sync, and a
1h refresh would leave the reconciler at 401 for up to an hour.

bifrost judge key: optional. Bifrost runs with is_vk_mandatory: false, so the
judge reaches Bedrock without it and only loses budget attribution. Off by
default because an ExternalSecret pointing at a non-existent Secrets Manager
entry stays permanently NotReady, which is a worse first-run experience than a
warning and a metric. Turn it on once the entry exists.
*/ -}}
{{- if .Values.langfuse.secretManagerKey }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-evaluation-langfuse
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-evaluation.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  refreshInterval: "1m"
  target:
    name: {{ .Values.langfuse.apiKeySecretRef }}
    creationPolicy: Owner
  data:
    - secretKey: LANGFUSE_PUBLIC_KEY
      remoteRef:
        key: {{ .Values.langfuse.secretManagerKey }}
        property: LANGFUSE_PUBLIC_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: LANGFUSE_SECRET_KEY
      remoteRef:
        key: {{ .Values.langfuse.secretManagerKey }}
        property: LANGFUSE_SECRET_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- else }}
{{- fail "agent-evaluation: langfuse.secretManagerKey is required. It is the Secrets Manager entry the langfuse addon writes (<resourcePrefix>-hub/langfuse-otel); without it the reconciler has no credential for the Langfuse API." }}
{{- end }}
{{- if and (eq (include "agent-evaluation.role" .) "hub") .Values.judge.virtualKey.enabled }}
{{- if not .Values.judge.virtualKey.secretManagerKey }}
{{- fail "agent-evaluation: judge.virtualKey.enabled is true but judge.virtualKey.secretManagerKey is empty. Set the Secrets Manager entry holding the judge Bifrost virtual key, or leave the key disabled to run the judge un-budgeted." }}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-evaluation-judge-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-evaluation.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  refreshInterval: "1h"
  target:
    name: {{ .Values.judge.virtualKey.secretRef }}
    creationPolicy: Owner
  data:
    - secretKey: BIFROST_VIRTUAL_KEY
      remoteRef:
        key: {{ .Values.judge.virtualKey.secretManagerKey }}
        property: {{ .Values.judge.virtualKey.property }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- end }}
