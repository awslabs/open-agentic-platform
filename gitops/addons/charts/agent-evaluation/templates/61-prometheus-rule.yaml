{{- /*
Alerts. The design leaves "where quality alerts live" open (Q7) between a
PrometheusRule and a Grafana alert CR; this takes the PrometheusRule. It only
applies where the prometheus-operator CRDs (monitoring.coreos.com/v1) are
present, i.e. the observability domain's prometheus-operator-crds addon
(enable_monitoring) is installed, and something reconciles PrometheusRules.
Elsewhere the rule is not rendered: Argo CD passes the destination cluster's API
versions to Helm, and a kind with no CRD would otherwise make Argo CD reject the
whole sync.

These alert on the PIPELINE, not on agent quality. A pass ratio falling is a
product signal for the owning team to read on the dashboard, and it would be
wrong for the platform to page on it: a deliberately strict evaluator on a
hard task is supposed to score low. What the platform owns is whether the
numbers are current and real — which is exactly what the staleness alert and the
error-rate alert say.
*/ -}}
{{- if and .Values.metrics.enabled .Values.alerts.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/PrometheusRule") }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: agent-evaluation
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-evaluation.labels" . | nindent 4 }}
spec:
  groups:
    - name: agent-evaluation
      rules:
        - alert: AgentEvaluationDataStale
          # Per cluster, so one stalled cluster is not hidden by a healthy one.
          expr: >-
            time() - max by (cluster)
            (oap_agent_eval_last_success_timestamp_seconds{loop="metrics"})
            > {{ .Values.alerts.dataAgeSeconds }}
          for: 10m
          labels:
            severity: warning
            component: agent-evaluation
          annotations:
            summary: >-
              Agent evaluation scores on cluster {{ `{{ $labels.cluster }}` }}
              have not refreshed for over
              {{ div .Values.alerts.dataAgeSeconds 60 }} minutes.
            description: >-
              The metrics loop has not completed a full pass. The dashboard is
              showing the last good values, so pass ratios are stale rather than
              wrong. Usual causes: Langfuse rate-limiting the metrics endpoint
              (check oap_agent_eval_errors_total{loop="metrics"} and raise
              metrics.intervalSeconds), Langfuse unreachable, or the reconciler
              not running.

        - alert: AgentEvaluationReconcileErrors
          expr: >-
            sum by (cluster, loop) (rate(oap_agent_eval_errors_total[15m])) > 0
          for: 30m
          labels:
            severity: warning
            component: agent-evaluation
          annotations:
            summary: >-
              Agent evaluation {{ `{{ $labels.loop }}` }} loop is failing on
              cluster {{ `{{ $labels.cluster }}` }}.
            description: >-
              Langfuse calls have been failing for 30 minutes. For loop="rules"
              new or changed agents are not being evaluated; for loop="project"
              the hub cannot publish judge prompts, so every cluster keeps
              scoring on the previous version. Check the reconciler's logs in the
              {{ .Release.Namespace }} namespace.

        - alert: AgentEvaluationRuleBudgetHigh
          # The cap is per Langfuse project and the whole fleet shares one, so
          # this sums every cluster's owned rules rather than alerting per
          # cluster.
          expr: sum(oap_agent_eval_rules_active) > {{ div (mul .Values.maxActiveRules 8) 10 }}
          for: 15m
          labels:
            severity: warning
            component: agent-evaluation
          annotations:
            summary: >-
              The shared Langfuse project is near its evaluation rule cap
              ({{ .Values.maxActiveRules }}).
            description: >-
              Rules are grouped by (evaluator, judge, sampling) per cluster, so
              this rises when teams use many distinct sampling rates or judges.
              Prefer the three coverage levels over explicit `sampling` values,
              which group far better. Past the cap, new agents' rules are not
              created and the reconciler reports it.
{{- if eq (include "agent-evaluation.role" .) "hub" }}

        - alert: AgentEvaluationJudgeKeyMissing
          # Hub only: the hub owns the judge LLM connection, so it is the only
          # instance for which this is actionable.
          expr: max by (cluster) (oap_agent_eval_judge_key_present) == 0
          for: 1h
          labels:
            severity: info
            component: agent-evaluation
          annotations:
            summary: Judge LLM calls are running without a Bifrost virtual key.
            description: >-
              Judge spend is reaching Bedrock through Bifrost but is not
              attributed to a budget or rate limit, because no judge virtual key
              is mounted. Evaluation still works. To fix, create the Secrets
              Manager entry and set judge.virtualKey.enabled with its
              secretManagerKey on the agent-evaluation addon.
{{- end }}
{{- if .Values.harness.enabled }}
{{- $harnessStale := max (mul 3 (int .Values.harness.intervalSeconds)) 900 }}
        # Harness (report mode). Pipeline alerts only, like the rest of this
        # file: a low harness pass ratio is the owning team's signal on the
        # dashboard, not a page.
        - alert: AgentHarnessStale
          # The harness loop is not in /readyz (an unready pod would hide every
          # evaluation series), so this is how a stuck loop is seen.
          expr: >-
            time() - max by (cluster)
            (oap_agent_eval_last_success_timestamp_seconds{loop="harness"})
            > {{ $harnessStale }}
          for: 15m
          labels:
            severity: warning
            component: agent-evaluation
          annotations:
            summary: >-
              The agent harness loop on cluster {{ `{{ $labels.cluster }}` }}
              has not completed a pass for over
              {{ div $harnessStale 60 }} minutes.
            description: >-
              New agent revisions are not being run against their harness
              datasets, so harness results on the dashboard are stale. Usual
              causes: the Kubernetes API refusing the reconciler's Job or Rollout
              calls (check oap_agent_eval_errors_total{loop="harness"}), the
              required harness judge key being unavailable (see
              AgentHarnessJudgeKeyMissing), or the reconciler not running.
        - alert: AgentHarnessJudgeKeyMissing
          expr: max by (cluster) (oap_agent_harness_judge_key_present) == 0
          for: 30m
          labels:
            severity: warning
            component: agent-evaluation
          annotations:
            summary: >-
              The harness judge Bifrost virtual key is missing on cluster
              {{ `{{ $labels.cluster }}` }}.
            description: >-
              With harness.judge.virtualKey.required true (the default) no
              harness run starts while this fires. The reconciler mints the key
              in this cluster's Bifrost through the management API and writes it
              to Secret {{ .Values.harness.judge.virtualKey.secretRef }} in the
              {{ .Release.Namespace }} namespace. Check the reconciler's logs and
              the HarnessJudgeKeyUnavailable Events, and that Bifrost answers at
              {{ .Values.harness.judge.virtualKey.bifrostAdminUrl }}.
{{- end }}
{{- end }}
