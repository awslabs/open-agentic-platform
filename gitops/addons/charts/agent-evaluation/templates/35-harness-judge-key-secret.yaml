{{- /*
The harness judge key Secret, pre-created empty by this chart (harness.enabled).
The platform minter (bifrost chart, judgeKey.enabled) fills `data` and the
key-name annotation with a merge patch, so its Role needs get/update/patch on
this one name and no `create` (RBAC cannot scope create by name).

No `data` here on purpose. Argo CD syncs with ServerSideApply, so it owns only
the fields below and leaves the minter's `data` alone; the registry entry also
ignores /data and the key-name annotation in the diff, so the app stays Synced.
While the minter has not written it, the Secret is empty, which the reconciler
and the endpoint read as "key missing" (no run starts while it is required).
A chart object: turning the harness off prunes it with the chart.
*/ -}}
{{- if .Values.harness.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.harness.judge.virtualKey.secretRef }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-evaluation.labels" . | nindent 4 }}
type: Opaque
{{- end }}
