{{- /*
The reconciler. One replica on purpose.

A second replica would not make this faster or safer: both would run the same
level-triggered diff against the same Langfuse project and race on the same
objects. Every pass is idempotent, so a restart loses nothing — the next pass
rebuilds the whole picture. Availability is not a concern either: evaluation is
an offline reporting path, and an agent keeps serving users while this pod is
down.

Probes are split deliberately. /healthz answers as soon as the process serves
HTTP and never consults Langfuse, so a slow ExternalSecret or an IAM policy still
propagating cannot restart the pod in a loop. /readyz is the one that reports the
dependency.
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-evaluation-reconciler
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-evaluation.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # The old pod must release its Langfuse writes before the new one starts, and
  # two reconcilers mid-rollout would PATCH the same rules.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "agent-evaluation.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agent-evaluation.labels" . | nindent 8 }}
        {{- include "agent-evaluation.selectorLabels" . | nindent 8 }}
      annotations:
        # Restart when a prompt, a coverage rate or a judge alias changes, so a
        # catalog edit actually reaches Langfuse instead of waiting for an
        # unrelated restart.
        checksum/catalog: {{ include "agent-evaluation.catalogChecksum" . }}
        {{- if .Values.harness.enabled }}
        # Same for a harness dataset, check prompt or harness value.
        checksum/harness: {{ include "agent-evaluation.harnessChecksum" . }}
        {{- end }}
    spec:
      serviceAccountName: agent-evaluation-reconciler
      securityContext:
        runAsNonRoot: true
        # Numeric uid: the kubelet cannot verify runAsNonRoot from a named USER,
        # so a restricted namespace would refuse the pod without it.
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reconciler
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: ROLE
              value: {{ include "agent-evaluation.role" . | quote }}
            - name: CLUSTER_NAME
              value: {{ include "agent-evaluation.clusterName" . | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LANGFUSE_URL
              value: {{ include "agent-evaluation.langfuseUrl" . | quote }}
            - name: LANGFUSE_TIMEOUT_SECONDS
              value: {{ .Values.langfuse.timeoutSeconds | quote }}
            - name: BIFROST_URL
              value: {{ .Values.judge.bifrostUrl | quote }}
            - name: RECONCILE_INTERVAL_SECONDS
              value: {{ .Values.reconcile.intervalSeconds | quote }}
            - name: METRICS_INTERVAL_SECONDS
              value: {{ .Values.metrics.intervalSeconds | quote }}
            - name: METRICS_WINDOWS
              value: {{ join "," .Values.metrics.windows | quote }}
            - name: METRICS_PORT
              value: {{ .Values.metrics.port | quote }}
            - name: METRICS_CONCURRENCY
              value: {{ .Values.metrics.concurrency | quote }}
            - name: TAG_QUERY_BUDGET_BYTES
              value: {{ .Values.metrics.tagQueryBudgetBytes | quote }}
            - name: MAX_ACTIVE_RULES
              value: {{ .Values.maxActiveRules | quote }}
            - name: CATALOG_PATH
              value: /etc/agent-evaluation/catalog.yaml
            - name: CREDENTIALS_DIR
              value: /etc/agent-evaluation/credentials
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            # Harness (report mode). Always rendered so the reconciler's choice
            # is explicit; the rest is read only when it is "true".
            - name: HARNESS_ENABLED
              value: {{ ternary "true" "false" (.Values.harness.enabled | default false) | quote }}
            {{- if .Values.harness.enabled }}
            {{- $h := .Values.harness }}
            - name: HARNESS_INTERVAL_SECONDS
              value: {{ $h.intervalSeconds | quote }}
            - name: HARNESS_MAX_CONCURRENT_JOBS
              value: {{ $h.maxConcurrentJobs | quote }}
            - name: HARNESS_HISTORY_LIMIT
              value: {{ $h.historyLimit | quote }}
            - name: HARNESS_CHECKS_PATH
              value: /etc/agent-evaluation/harness-checks/checks.yaml
            - name: HARNESS_DATASETS_DIR
              value: /etc/agent-evaluation/harness-datasets
            - name: HARNESS_CATALOG_CONFIGMAP
              value: agent-evaluation-harness-catalog
            - name: HARNESS_DATASETS_CONFIGMAP
              value: agent-evaluation-harness-datasets
            # The Job runs this same image with `python -m app.harness_runner`.
            - name: HARNESS_JOB_IMAGE
              value: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
            - name: HARNESS_JOB_IMAGE_PULL_POLICY
              value: {{ .Values.image.pullPolicy | quote }}
            - name: HARNESS_RUNNER_SERVICE_ACCOUNT
              value: agent-evaluation-harness-runner
            - name: HARNESS_RUNNER_RESOURCES
              value: {{ toJson $h.runner.resources | quote }}
            - name: HARNESS_CASE_CONCURRENCY
              value: {{ $h.caseConcurrency | quote }}
            - name: HARNESS_CASE_TIMEOUT_SECONDS
              value: {{ $h.caseTimeoutSeconds | quote }}
            - name: HARNESS_READY_TIMEOUT_SECONDS
              value: {{ $h.readyTimeoutSeconds | quote }}
            - name: HARNESS_RUN_TIMEOUT_SECONDS
              value: {{ $h.runTimeoutSeconds | quote }}
            - name: HARNESS_MAX_CASES
              value: {{ $h.maxCases | quote }}
            - name: HARNESS_JUDGE_ALIAS
              value: {{ $h.judge.alias | default "" | quote }}
            - name: HARNESS_JUDGE_KEY_MINT
              value: {{ ternary "true" "false" $h.judge.virtualKey.mint | quote }}
            - name: HARNESS_JUDGE_KEY_REQUIRED
              value: {{ ternary "true" "false" $h.judge.virtualKey.required | quote }}
            - name: HARNESS_JUDGE_KEY_SECRET
              value: {{ $h.judge.virtualKey.secretRef | quote }}
            - name: BIFROST_ADMIN_URL
              value: {{ $h.judge.virtualKey.bifrostAdminUrl | quote }}
            - name: HARNESS_JUDGE_BUDGET_USD
              value: {{ $h.judge.virtualKey.budget.maxLimitUsd | quote }}
            - name: HARNESS_JUDGE_BUDGET_RESET
              value: {{ $h.judge.virtualKey.budget.resetDuration | quote }}
            - name: HARNESS_JUDGE_RATE_LIMIT_REQUESTS
              value: {{ $h.judge.virtualKey.rateLimit.requestMaxLimit | quote }}
            - name: HARNESS_JUDGE_RATE_LIMIT_RESET
              value: {{ $h.judge.virtualKey.rateLimit.requestResetDuration | quote }}
            - name: HARNESS_JUDGE_ALLOWED_MODELS
              value: {{ join "," ($h.judge.virtualKey.allowedModels | default list) | quote }}
            {{- end }}
          ports:
            # Scraped through a ClusterIP Service. No hostPort and no Ingress:
            # this listener is reachable only from inside the cluster.
            - name: http-metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          # Credentials are mounted as files rather than envFrom: a file is not
          # visible in `kubectl describe pod` and it updates in place when the
          # ExternalSecret refreshes.
          volumeMounts:
            - name: catalog
              mountPath: /etc/agent-evaluation/catalog.yaml
              subPath: catalog.yaml
              readOnly: true
            - name: langfuse-credentials
              mountPath: /etc/agent-evaluation/credentials/LANGFUSE_PUBLIC_KEY
              subPath: LANGFUSE_PUBLIC_KEY
              readOnly: true
            - name: langfuse-credentials
              mountPath: /etc/agent-evaluation/credentials/LANGFUSE_SECRET_KEY
              subPath: LANGFUSE_SECRET_KEY
              readOnly: true
            {{- if and (eq (include "agent-evaluation.role" .) "hub") .Values.judge.virtualKey.enabled }}
            - name: judge-key
              mountPath: /etc/agent-evaluation/credentials/BIFROST_VIRTUAL_KEY
              subPath: BIFROST_VIRTUAL_KEY
              readOnly: true
            {{- end }}
            {{- if .Values.harness.enabled }}
            # Two sibling directories, the same layout the harness Jobs mount.
            - name: harness-checks
              mountPath: /etc/agent-evaluation/harness-checks
              readOnly: true
            - name: harness-datasets
              mountPath: /etc/agent-evaluation/harness-datasets
              readOnly: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-metrics
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http-metrics
            initialDelaySeconds: 5
            periodSeconds: 15
            # One reconcile interval plus headroom: a cold start lists every
            # ConfigMap and every Langfuse object before it can report ready.
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: catalog
          configMap:
            name: agent-evaluation-catalog
        - name: langfuse-credentials
          secret:
            secretName: {{ .Values.langfuse.apiKeySecretRef }}
        {{- if and (eq (include "agent-evaluation.role" .) "hub") .Values.judge.virtualKey.enabled }}
        - name: judge-key
          secret:
            secretName: {{ .Values.judge.virtualKey.secretRef }}
        {{- end }}
        {{- if .Values.harness.enabled }}
        - name: harness-checks
          configMap:
            name: agent-evaluation-harness-catalog
        - name: harness-datasets
          configMap:
            name: agent-evaluation-harness-datasets
        {{- end }}
