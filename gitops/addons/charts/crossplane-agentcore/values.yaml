global:
  awsRegion: us-west-2
  eksClusterName: ""
  projectName: "agent-core"
  networkMode: "PUBLIC"

# Crossplane provider version
provider:
  version: "v2.5.3"
  # Pod resources for the bedrockagentcore provider. Any key overrides the default in
  # templates/01-provider.yaml. Same contract as appmod-blueprints crossplane-base
  # (merged to appmod main), which measured this provider:
  #
  #   provider-aws-bedrockagentcore v2.5.3, kind with the hub's 790 CRDs,
  #   GODEBUG=gctrace=1: live heap peaks ~190MB at controller start and does not
  #   depend on managed-resource or CRD count. Without GOMEMLIMIT, Go grows the heap
  #   to 2x live whatever the cgroup limit is: 280Mi was OOMKilled without it and ran
  #   with it; 256Mi OOMed even with it; 288Mi was the smallest that survived.
  #
  # On the clusters, the previous 256Mi request / 512Mi limit with no GOMEMLIMIT was
  # OOMKilled 15 times on oap-dev and 6 times on peeks-hub (Oct 2026), at ~330Mi steady.
  #
  # Defaults:
  #   cpuRequest    100m
  #   memoryRequest 320Mi  expected steady usage with GOGC=50 (to be confirmed on a cluster)
  #   memoryLimit   512Mi  OOM safety; the chart rejects a limit below 288Mi
  #   goGC          "50"   GC runs at 1.5x live instead of 2x
  #   goMemLimit    90% of memoryLimit unless set; "" disables the env var
  resources: {}

# AgentCore capabilities to enable
capabilities:
  memory: true
  browser: true
  codeInterpreter: true

# Memory configuration
memory:
  eventExpiryDuration: 30

# Pod Identity for the Crossplane provider
podIdentity:
  # ServiceAccount name used by the bedrockagentcore provider
  serviceAccountName: provider-aws-bedrockagentcore
  namespace: crossplane-system
# Agent guardrails (docs/architecture/agent-guardrails.md). The enabled switch is not set
# by hand: the registry derives it from the enable_agent_guardrails, enable_agent_gateway
# and enable_agent_core cluster-secret labels with the same expression as agent-gateway and
# oam-agent-components. A string, because the registry renders text. Default off: nothing
# in templates/04-bedrock-provider.yaml renders.
guardrails:
  enabled: "false"
  # IAM partition of the guardrail ARNs in the provider role policy.
  arnPartition: aws
  provider:
    # provider-aws-bedrock. v2.9.0 is the first family release with GuardrailVersion, so the
    # chart refuses a lower tag. The Upbound registry needs a login to list tags from
    # outside a cluster, so this default is the newest tag seen in the provider repository
    # (https://github.com/crossplane-contrib/provider-upjet-aws/tags). Bump it deliberately.
    #
    # Version family: appmod-blueprints crossplane-base installs the v2.7.0 family providers
    # (provider-family-aws, provider-aws-iam, provider-aws-eks) that supply the ProviderConfig
    # CRDs and the Role and PodIdentityAssociation kinds. This package is a separate member
    # at a newer tag, so the Provider keeps skipDependencyResolution: true (as the
    # bedrockagentcore Provider already does) and Crossplane does not try to align it with
    # the family. The Guardrail kinds use the ProviderConfig named "default" that the family
    # provider already supplies. If a cluster rejects that pairing (for example a changed
    # ProviderConfig schema), the fallback is to raise the family in appmod-blueprints to the
    # same tag.
    version: "v2.10.0"
  podIdentity:
    # ServiceAccount the provider-aws-bedrock pod runs as. Its own Pod Identity role keeps
    # guardrail management separate from the AgentCore provider role. The namespace is
    # podIdentity.namespace above.
    serviceAccountName: provider-aws-bedrock
  # Account that owns the guardrails. Set by the registry from the aws_account_id
  # annotation. Required when guardrails are enabled, because the provider role is scoped
  # to this account's guardrail ARNs.
  awsAccountId: ""
  # Profile order, weakest to strongest. The agent-gateway chart names the same profiles in
  # the same order (guardrails.order there), and a test fails if the two differ. Every
  # profile below must be listed here, and every name listed must have a profile.
  order:
    - observe
    - standard
    - strict
  # Catalog revision. A GuardrailVersion is an immutable snapshot of its Guardrail, so
  # editing a profile below does not change what the gateway applies until a new version is
  # cut. The revision is part of each GuardrailVersion description, and changing it makes
  # Crossplane create a new version. The gateway then binds the new version number. Raise
  # it in the same change as any edit to a profile.
  catalogRevision: "1"
  # Tier for content filters and denied topics. STANDARD needs the cross-Region guardrail
  # profile below: Bedrock may route a guardrail evaluation to another Region of the same
  # geography. CLASSIC needs no profile and stays in one Region, with weaker detection. Set
  # CLASSIC and an empty crossRegion.profileId where cross-Region routing is not allowed.
  tier: STANDARD
  crossRegion:
    # System-defined guardrail profile for the cluster's Region. Pick the profile of the
    # geography that contains awsRegion, from
    # https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-cross-region-support.html
    # (us.guardrail.v1:0 for us-east-1, us-east-2, us-west-1 and us-west-2;
    # eu.guardrail.v1:0 for the EU Regions listed there). The gateway role needs the same ID,
    # so agent-gateway has the same key and a test pins both.
    profileId: "us.guardrail.v1:0"
  # Text returned to the caller when a guardrail blocks. The Bedrock API requires both.
  blockedInputMessaging: "This request was blocked by the platform guardrail."
  blockedOutputsMessaging: "This response was blocked by the platform guardrail."
  # STARTER CATALOG. The platform maintainers own the final contents of every profile. These
  # values are a working starting point, not a reviewed policy. Allowed keys per profile:
  #   description   free text
  #   contentFilters  map of filter type -> strength. Types: SEXUAL, VIOLENCE, HATE, INSULTS,
  #                   MISCONDUCT, PROMPT_ATTACK. Strengths: NONE, LOW, MEDIUM, HIGH.
  #                   PROMPT_ATTACK is checked on input only (Bedrock requires its output
  #                   strength to be NONE).
  #   piiEntities   list of {type, action}. Action: BLOCK, ANONYMIZE or NONE.
  #   deniedTopics  list of {name, definition, examples}. Each is a DENY topic.
  # Any other key fails the render.
  profiles:
    observe:
      description: Starter observe profile. Content filters at low strength. The gateway runs it in Audit mode, so nothing is rejected.
      contentFilters:
        SEXUAL: LOW
        VIOLENCE: LOW
        HATE: LOW
        INSULTS: LOW
        MISCONDUCT: LOW
    standard:
      description: Starter standard profile. Content filters at medium strength, prompt attack detection, PII anonymized.
      contentFilters:
        SEXUAL: MEDIUM
        VIOLENCE: MEDIUM
        HATE: MEDIUM
        INSULTS: MEDIUM
        MISCONDUCT: MEDIUM
        PROMPT_ATTACK: MEDIUM
      piiEntities:
        - {type: EMAIL, action: ANONYMIZE}
        - {type: PHONE, action: ANONYMIZE}
        - {type: NAME, action: ANONYMIZE}
        - {type: ADDRESS, action: ANONYMIZE}
        - {type: CREDIT_DEBIT_CARD_NUMBER, action: ANONYMIZE}
        - {type: AWS_ACCESS_KEY, action: ANONYMIZE}
        - {type: AWS_SECRET_KEY, action: ANONYMIZE}
        - {type: PASSWORD, action: ANONYMIZE}
    strict:
      description: Starter strict profile. Content filters and prompt attack detection at high strength, PII anonymized, one example denied topic.
      contentFilters:
        SEXUAL: HIGH
        VIOLENCE: HIGH
        HATE: HIGH
        INSULTS: HIGH
        MISCONDUCT: HIGH
        PROMPT_ATTACK: HIGH
      piiEntities:
        - {type: EMAIL, action: ANONYMIZE}
        - {type: PHONE, action: ANONYMIZE}
        - {type: NAME, action: ANONYMIZE}
        - {type: ADDRESS, action: ANONYMIZE}
        - {type: CREDIT_DEBIT_CARD_NUMBER, action: ANONYMIZE}
        - {type: AWS_ACCESS_KEY, action: ANONYMIZE}
        - {type: AWS_SECRET_KEY, action: ANONYMIZE}
        - {type: PASSWORD, action: ANONYMIZE}
      # Example only: replace with the topics the platform actually denies.
      deniedTopics:
        - name: investment-advice
          definition: Specific recommendations to buy, sell or hold a financial instrument.
          examples:
            - Which stocks should I buy this week?
            - Should I move my retirement savings into one fund?
