global:
  awsRegion: us-west-2
  eksClusterName: ""
  projectName: "agent-core"
  networkMode: "PUBLIC"

# Crossplane provider version
provider:
  version: "v2.5.3"
  # Pod resources for the bedrockagentcore provider. Any key overrides the default in
  # templates/01-provider.yaml. Same contract as appmod-blueprints crossplane-base
  # (PR #941), which measured this provider:
  #
  #   provider-aws-bedrockagentcore v2.5.3, kind with the hub's 790 CRDs,
  #   GODEBUG=gctrace=1: live heap peaks ~190MB at controller start and does not
  #   depend on managed-resource or CRD count. Without GOMEMLIMIT, Go grows the heap
  #   to 2x live whatever the cgroup limit is: 280Mi was OOMKilled without it and ran
  #   with it; 256Mi OOMed even with it; 288Mi was the smallest that survived.
  #
  # On the clusters, the previous 256Mi request / 512Mi limit with no GOMEMLIMIT was
  # OOMKilled 15 times on oap-dev and 6 times on peeks-hub (Oct 2026), at ~330Mi steady.
  #
  # Defaults:
  #   cpuRequest    100m
  #   memoryRequest 320Mi  expected steady usage with GOGC=50 (to be confirmed on a cluster)
  #   memoryLimit   512Mi  OOM safety
  #   goGC          "50"   GC runs at 1.5x live instead of 2x
  #   goMemLimit    90% of memoryLimit unless set; "" disables the env var
  resources: {}

# AgentCore capabilities to enable
capabilities:
  memory: true
  browser: true
  codeInterpreter: true

# Memory configuration
memory:
  eventExpiryDuration: 30

# Pod Identity for the Crossplane provider
podIdentity:
  # ServiceAccount name used by the bedrockagentcore provider
  serviceAccountName: provider-aws-bedrockagentcore
  namespace: crossplane-system
