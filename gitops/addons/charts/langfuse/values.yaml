global:
  awsRegion: ""
  # insecure=true: ingress serves plain HTTP; TLS is terminated upstream of the
  # ALB (e.g. by CloudFront). Set from the cluster secret's insecure annotation,
  # same convention as the keycloak/argo-workflows charts.
  insecure: "false"
  # Resource prefix of this deployment (e.g. "peeks"). Used by push-otel-secret.yaml
  # to name the OTEL SM secret <resourcePrefix>-hub/langfuse-otel so two events with
  # different prefixes in one AWS account don't collide. Set from the registry entry's
  # valuesObject.global.resourcePrefix (cluster-secret resource_prefix annotation).
  # Left empty here on purpose: the templates guard it via the "langfuse.resourcePrefix"
  # helper, so a missing annotation FAILS the render instead of silently producing
  # "-hub/langfuse-otel".
  resourcePrefix: ""

clusterName: ""

replicas: 1

image:
  repository: langfuse/langfuse
  # Pinned to a concrete version (was a floating "3", so each fresh install could
  # pull a different build, making the init-time/CPU behaviour non-reproducible).
  # #1057
  #
  # v4 requires ClickHouse >= 25.12, which the clickhouse block below now pins.
  # Do not raise this above the ClickHouse floor in the same change: the server
  # runs its ClickHouse schema migrations on startup.
  tag: "4.72.0"
  pullPolicy: IfNotPresent

worker:
  image:
    repository: langfuse/langfuse-worker
    # Pinned for the same reason as the web image above, which had been fixed
    # while this one was left floating on "3" — so the worker could silently run
    # a different build from the web container it is supposed to match.
    tag: "4.72.0"
  replicas: 1
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

ingress:
  enabled: false
  className: platform
  host: ""
  # ALB rule priority within the shared "platform" ingress group. Langfuse must be
  # served at "/" (Next.js has no runtime basePath), so this "/" catch-all is given a
  # high order to be evaluated LAST and avoid shadowing specific-path ingresses.
  groupOrder: "900"

keycloak:
  clientSecret: ""
  issuerUrl: ""
  # AUTH_DISABLE_SIGNUP. Keep "false" when Keycloak is the login path: Langfuse
  # refuses to create ANY new user when it is "true", SSO included (its Prisma
  # adapter createUser throws "Sign up is disabled."). A Keycloak user who has
  # never opened Langfuse could then not sign in, and the seed CronJob only
  # attaches users that already exist. Set "true" only to freeze the user list.
  disableSignup: "false"
  # AUTH_DISABLE_USERNAME_PASSWORD. "true" turns off Langfuse's local
  # email/password sign-up AND sign-in, so nobody who can reach the UI can create
  # a local account. Keycloak SSO is unaffected: first-time SSO users are still
  # created. Nothing in this chart signs in with a password (the seed job writes
  # to Postgres directly).
  # Default "false": this chart cannot tell whether a working Keycloak exists
  # (OAP does not ship one), and with no SSO provider nobody could sign in. The
  # registry sets "true" only on clusters labelled enable_keycloak=true, the same
  # label that deploys the Keycloak addon.
  disableUsernamePassword: "false"
  secretManagerKey: ""  # Set dynamically: <cluster>/keycloak-clients

# Application secrets (override for production)
nextauthSecret: "changeme-generate-random-secret"
# SALT is used by Langfuse to hash API keys (createShaHash: sha256(sk || hex(sha256(SALT)))).
# It MUST be deterministic across every ArgoCD render (no rand*/lookup — those would change
# the salt on each sync and break the OTEL key auth), and the langfuse deployment (langfuse.yaml
# -> langfuse-secrets/SALT) and the seed job (seed-job.yaml fast_hashed_secret_key) MUST read the
# SAME value so the seeded fast-hash matches what Langfuse computes at ingestion time.
# In production you MUST override this with a unique, secret per-env value — do not ship the
# shared default below. It is deterministic by design and acceptable only for the workshop/demo
# platform (the OTEL key is internal, not a production credential). Changing the value re-hashes
# the API key, so the seed job and the langfuse deployment must be re-rendered together.
salt: "langfuse-otel-salt-v1"

# Langfuse v3's Next.js boot is CPU- and memory-heavy and /api/public/health does
# deep dependency checks. Request 2Gi (not 1Gi) so EKS Auto Mode places the web pod
# on a node with real headroom instead of a tightly-packed small instance where the
# boot was starved; the limit stays 4Gi.
# cpu request raised 500m->1 (#1057): the web init is CPU-bound and at a 500m request
# the container got too few CPU shares on a busy node, slowing /api/public/health past
# the liveness timeout and crash-looping it (exitCode 137, reason=Error — NOT OOMKilled).
resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    cpu: 2000m
    memory: 4Gi

postgres:
  image:
    repository: postgres
    tag: "16-alpine"
  user: langfuse
  password: langfuse-password
  storage: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

# ClickHouse (required for Langfuse v3+ — OLAP trace storage)
clickhouse:
  image:
    repository: clickhouse/clickhouse-server
    # Langfuse v4 requires ClickHouse >= 25.12 and its schema migrations run
    # automatically on server startup, so ClickHouse MUST be upgraded BEFORE the
    # Langfuse image. Current v3 releases work fine against 25.12, which is what
    # makes that ordering safe to do as a separate step.
    #
    # Pinned to a full patch version, not "25.12": a floating tag means a fresh
    # install and an existing one can run different builds, which is the same
    # reproducibility problem #1057 fixed for the Langfuse image itself.
    tag: "25.12.11.4"
  password: clickhouse
  storage: 20Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

# Redis (required for Langfuse v3 — async queue + cache)
redis:
  image:
    repository: redis
    tag: "7-alpine"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# MinIO (S3-compatible blob storage for Langfuse v3 event upload)
minio:
  # Default to the seb-demo public ECR mirror with an IMMUTABLE pinned tag.
  # Why: the upstream community MinIO images are no longer anonymously pullable
  # (docker.io/minio/minio -> 404; quay.io/minio/minio + mc -> 401 gated), so the
  # former quay.io/minio/minio:latest default is unpullable -> ImagePullBackOff on
  # langfuse-minio, which takes down the S3 blob store and blocks trace ingestion.
  # Tag `mirror-20260921` is immutable and pins digest
  #   sha256:52dfd5c0bbd38d3219f2058c7af216d9f9a27a994b7b5baad09bbd38866015ff
  #   (MinIO RELEASE.2025-09-07T16-13-09Z, amd64). The chart builds image refs as
  #   repository:tag (no @digest support), so the immutable tag IS the digest pin.
  # Override to another private/ECR mirror via a per-cluster overlay when air-gapped.
  # INTERIM: seb-demo is a personal namespace; tracked in
  # awslabs/open-agentic-platform#42 for a durable project-owned registry.
  image:
    repository: public.ecr.aws/seb-demo/minio
    tag: "mirror-20260921"
  # MinIO client (mc) image used by the bucket-init job. Same seb-demo mirror:
  # that image bundles the `mc` binary + a shell, which the langfuse-minio-init
  # job (sh -c 'mc ...') requires.
  mcImage:
    repository: public.ecr.aws/seb-demo/mc
    tag: "mirror-20260921"
  storage: 10Gi
  rootUser: minio
  rootPassword: miniosecret
  bucket: langfuse
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Seed: auto-creates org, project, API keys on first deploy
# Also writes LANGFUSE_PUBLIC_KEY + LANGFUSE_SECRET_KEY to Secrets Manager
# so spoke OTel collectors can read them via ExternalSecret.
seed:
  enabled: true
  orgId: "org-agent-platform"
  orgName: "Agent Platform"
  projectId: "proj-agent-platform"
  projectName: "agent-platform"
  # Secrets Manager path where OTEL keys are stored. The actual path is built in
  # push-otel-secret.yaml as "<global.resourcePrefix>-hub/langfuse-otel" (prefix-scoped
  # to avoid cross-event collisions in a shared account); this default is documentation only.
  secretManagerPath: "<resourcePrefix>-hub/langfuse-otel"
  apiKey:
    id: "ak-otel-collector"
    publicKey: "pk-lf-otel-platform"
    secretKey: "sk-lf-otel-platform-2026"

# Continuous agent evaluation (docs/architecture/agent-evaluation.md).
# Langfuse itself runs no evaluation here; it only needs to be allowed to reach
# the judge's model gateway, which is a cluster-internal address its SSRF check
# blocks by default.
# Langfuse v4 migration controls.
# https://langfuse.com/self-hosting/upgrade/upgrade-guides/upgrade-v3-to-v4
#
# v4 introduces a new event-based storage model and three write modes. The
# platform upgraded the SERVER to v4 while deliberately staying in `legacy`
# write mode, because those are two independent decisions:
#
#   - the server version is what exposes the STABLE /api/public/v2 evaluator
#     API that continuous agent evaluation needs (on v3 it was /unstable/, and
#     its preflight could not resolve a provider config at all)
#   - the write mode is what changes ingestion and read behaviour, and
#     `events_only` is a ONE-WAY cutover that breaks the legacy ingestion and
#     read endpoints
#
# So the version moves now and the cutover is a later, deliberate change rather
# than a side effect of a bump.
migrationV4:
  # legacy | dual | events_only  (v4's own default is events_only)
  #
  # `legacy` keeps full v3 ingestion and read behaviour: the OTel collector's
  # ingestion path and every v1 read endpoint keep working untouched.
  #
  # Before moving to events_only, these have to be dealt with first:
  #   - the agent-evaluation reconciler's metrics loop uses /api/public/metrics,
  #     which refuses requests in events_only mode (it has to move to v2/v3)
  #   - producers need Python SDK >= 4.7.0 / JS-TS >= 5.4.0
  #   - trace-level and legacy-dataset LLM-as-a-judge evaluators stop running
  # `dual`, not `legacy`, and this is load-bearing for continuous agent
  # evaluation rather than a preference.
  #
  # v4's online evaluation pipeline consumes the NEW events stream. In `legacy`
  # mode nothing writes it, so an evaluation rule can be active, enabled, with
  # sampling 1 and a filter that matches the trace — and no evaluation job is
  # ever created. Observed exactly that on the hub: the trace arrived with the
  # right tag, the rule was correct, and the worker logged no evaluation
  # activity at all.
  #
  # `dual` writes BOTH the old and the new tables, so every v3 read surface
  # keeps working (the UI, the v1 read APIs, this addon's metrics loop) AND the
  # evaluation pipeline has the events it needs. It is the documented
  # transitional mode and is reversible, unlike `events_only`.
  writeMode: dual
  # direct | dual_write
  #
  # MUST be dual_write whenever writeMode is legacy, and this is not advisory:
  # v4 validates the combination at startup and the WORKER exits with
  #   Invalid V4 config: LANGFUSE_MIGRATION_V4_NATIVE_OTEL_BEHAVIOUR=direct
  #   requires LANGFUSE_MIGRATION_V4_WRITE_MODE in {dual, events_only}.
  #   Direct OTel writes target events_full, which is not read in legacy mode.
  # so leaving v4's `direct` default in place crash-loops the worker — which is
  # the container that runs the evaluation judge. `dual_write` keeps the
  # server-side propagation that makes OTel-ingested traces readable through the
  # v3 read path, which is exactly what legacy mode means.
  nativeOtelBehaviour: dual_write
  # The historic backfill must stay off while in `legacy` mode. It also wants
  # roughly 3x the current ClickHouse volume as working space.
  enableHistoricBackfill: false
  # Gates the v4 UI toggle and the /api/public/v2 APIs. Required for the stable
  # evaluator API, which is the whole reason for this upgrade, and harmless in
  # legacy mode.
  allowPreviewOptIn: true

evaluation:
  # The one host exempted from Langfuse's LLM-connection SSRF check: Bifrost's
  # in-cluster Service. Keep this a single host — it is an exemption from a
  # security control, not a convenience setting. Must match the host in the
  # agent-evaluation addon's judge.bifrostUrl.
  judgeGatewayHost: "bifrost.bifrost.svc.cluster.local"

# ENCRYPTION_KEY: Langfuse encrypts stored secrets at rest with it, and without
# it the whole LLM-connection API returns 500 "Missing environment variable:
# ENCRYPTION_KEY" — so no evaluation judge can be registered. Langfuse still
# boots and serves traces without it, which is why its absence is invisible
# until something writes a connection.
#
# The key is generated in-cluster into Secrets Manager and read back through an
# ExternalSecret; it is never a chart value, so no copy of it is in git. See
# templates/encryption-key.yaml, and note that it must NEVER be rotated.
encryptionKey:
  enabled: true
  # Name of the Secret the ExternalSecret creates, loaded by the web and worker
  # Deployments with envFrom.
  secretRef: langfuse-encryption
