global:
  awsRegion: ""
  # insecure=true: ingress serves plain HTTP; TLS is terminated upstream of the
  # ALB (e.g. by CloudFront). Set from the cluster secret's insecure annotation,
  # same convention as the keycloak/argo-workflows charts.
  insecure: "false"

clusterName: ""

replicas: 1

image:
  repository: langfuse/langfuse
  tag: "3"
  pullPolicy: IfNotPresent

worker:
  image:
    repository: langfuse/langfuse-worker
    tag: "3"
  replicas: 1
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

ingress:
  enabled: false
  className: platform
  host: ""
  # ALB rule priority within the shared "platform" ingress group. Langfuse must be
  # served at "/" (Next.js has no runtime basePath), so this "/" catch-all is given a
  # high order to be evaluated LAST and avoid shadowing specific-path ingresses.
  groupOrder: "900"

keycloak:
  clientSecret: ""
  issuerUrl: ""
  disableSignup: "false"
  secretManagerKey: ""  # Set dynamically: <cluster>/keycloak-clients

# Application secrets (override for production)
nextauthSecret: "changeme-generate-random-secret"
salt: "changeme-generate-salt"

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 4Gi

postgres:
  image:
    repository: postgres
    tag: "16-alpine"
  user: langfuse
  password: langfuse-password
  storage: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

# ClickHouse (required for Langfuse v3 — OLAP trace storage)
clickhouse:
  image:
    repository: clickhouse/clickhouse-server
    tag: "24.12"
  password: clickhouse
  storage: 20Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

# Redis (required for Langfuse v3 — async queue + cache)
redis:
  image:
    repository: redis
    tag: "7-alpine"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# MinIO (S3-compatible blob storage for Langfuse v3 event upload)
minio:
  # Default to quay.io: anonymous Docker Hub pulls (minio/minio, minio/mc) are
  # rate-limited and break fresh installs behind a shared NAT egress IP with
  # "toomanyrequests"/"insufficient_scope". quay.io hosts the same official
  # images without that throttle. Override repository to a private mirror
  # (e.g. an ECR repo) via a per-cluster overlay when air-gapped.
  image:
    repository: quay.io/minio/minio
    tag: "latest"
  # MinIO client (mc) image used by the bucket-init job. Kept as a value so it
  # can be mirrored/overridden alongside the server image.
  mcImage:
    repository: quay.io/minio/mc
    tag: "latest"
  storage: 10Gi
  rootUser: minio
  rootPassword: miniosecret
  bucket: langfuse
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Seed: auto-creates org, project, API keys on first deploy
# Also writes LANGFUSE_PUBLIC_KEY + LANGFUSE_SECRET_KEY to Secrets Manager
# so spoke OTel collectors can read them via ExternalSecret.
seed:
  enabled: true
  orgId: "org-agent-platform"
  orgName: "Agent Platform"
  projectId: "proj-agent-platform"
  projectName: "agent-platform"
  # Secrets Manager path where OTEL keys are stored
  secretManagerPath: "hub/langfuse-otel"
  apiKey:
    id: "ak-otel-collector"
    publicKey: "pk-lf-otel-platform"
    secretKey: "sk-lf-otel-platform-2026"
