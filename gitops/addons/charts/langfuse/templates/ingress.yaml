{{- if .Values.ingress.enabled }}
{{- /* insecure: HTTP-only ingress, no cert (consumer terminates TLS upstream, e.g. CloudFront). Same convention as keycloak/argo-workflows. */}}
{{- $insecure := eq (toString (.Values.global.insecure | default "false")) "true" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: langfuse
  namespace: {{ .Release.Namespace }}
  annotations:
    alb.ingress.kubernetes.io/target-type: ip
    {{- if $insecure }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    {{- else }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    {{- end }}
    alb.ingress.kubernetes.io/healthcheck-path: /api/public/health
    # Langfuse (Next.js) can only be served at "/" (assets use absolute /_next paths;
    # no runtime basePath), so on a shared ALB group its "/" rule is a catch-all.
    # Give it a high group.order so it is evaluated LAST and never shadows
    # specific-path ingresses on the same group (e.g. app chat, CI/CD webhooks).
    alb.ingress.kubernetes.io/group.order: {{ .Values.ingress.groupOrder | default "900" | quote }}
    argocd.argoproj.io/sync-wave: "10"
spec:
  ingressClassName: {{ .Values.ingress.className | default "platform" }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: langfuse
                port:
                  number: 3000
{{- end }}
