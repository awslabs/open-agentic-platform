{{- if .Values.seed.enabled }}
# K8s Secret holding Langfuse OTEL API keys (local reference)
apiVersion: v1
kind: Secret
metadata:
  name: langfuse-otel-keys
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  LANGFUSE_PUBLIC_KEY: "{{ .Values.seed.apiKey.publicKey }}"
  LANGFUSE_SECRET_KEY: "{{ .Values.seed.apiKey.secretKey }}"
---
# Job: writes keys to Secrets Manager as SecretString (not binary)
# So spoke ExternalSecrets can read them as JSON properties
# Sync hook (not PostSync): a PostSync hook only fires once the entire
# Application reaches a completed, healthy sync. langfuse-hub rarely reaches that
# state (StatefulSets/ExternalSecrets can sit OutOfSync), so the PostSync hook
# never ran and <resourcePrefix>-hub/langfuse-otel was never created — leaving every
# otel-collector ExternalSecret in SecretSyncedError. A Sync hook runs during the
# sync operation itself (in wave order), so the keys land in Secrets Manager
# regardless of whether other resources have converged. Wave 5 runs after the
# langfuse-seed SA + its pod-identity (earlier waves) are applied.
apiVersion: batch/v1
kind: Job
metadata:
  name: langfuse-push-otel-keys
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "5"
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: langfuse-seed
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: push
          image: amazon/aws-cli:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: AWS_REGION
              value: "{{ .Values.global.awsRegion | default "us-west-2" }}"
          command:
            - sh
            - -c
            - |
              SECRET_ID="{{ include "langfuse.resourcePrefix" . }}-hub/langfuse-otel"
              SECRET_VALUE='{"LANGFUSE_PUBLIC_KEY":"{{ .Values.seed.apiKey.publicKey }}","LANGFUSE_SECRET_KEY":"{{ .Values.seed.apiKey.secretKey }}"}'

              if aws secretsmanager describe-secret --secret-id "$SECRET_ID" --region "$AWS_REGION" >/dev/null 2>&1; then
                aws secretsmanager put-secret-value --secret-id "$SECRET_ID" --secret-string "$SECRET_VALUE" --region "$AWS_REGION"
                echo "Updated $SECRET_ID"
              else
                aws secretsmanager create-secret --name "$SECRET_ID" --secret-string "$SECRET_VALUE" --region "$AWS_REGION"
                echo "Created $SECRET_ID"
              fi
{{- end }}
