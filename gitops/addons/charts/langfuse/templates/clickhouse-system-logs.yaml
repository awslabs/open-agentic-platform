{{- /*
Bound ClickHouse's own system log tables.

WHY THIS EXISTS. ClickHouse ships with every system log table enabled and NONE
of them bounded. On the hub that filled the 20 GiB data volume in ten days and
took the whole telemetry path down:

  system.trace_log   15.08 GiB   675,133,331 rows
  system.text_log     2.37 GiB    29,709,126 rows
  system.text_log_0   0.93 GiB    23,983,027 rows
  system.part_log     0.42 GiB     2,626,471 rows
  ---------------------------------------------------
  default.events_full  712 KiB         3,117 rows   <- the actual Langfuse data

So 19 of 20 GiB was ClickHouse talking to itself, against 712 KiB of user data.

HOW IT FAILED, which is the part worth preventing. Nothing reported an error
where anyone would look:

  - the OTel Collector kept exporting happily: 300 spans sent, 0 failed, because
    Langfuse's web tier accepts a span and enqueues it
  - the Langfuse worker then dropped every record on insert --
    `Cannot reserve 1.00 MiB, not enough space (code 243, NOT_ENOUGH_SPACE)` --
    visible ONLY in the worker's own log
  - so traces silently stopped existing, no agent was ever scored again, and
    every oap_agent_eval_* gauge read a plausible 0
  - and because TRUNCATE itself needs ~1 MiB of metadata space, the database
    could not even be cleaned up once full: recovery needed DROP TABLE, which
    unlinks rather than writes

Every system log gets a short TTL: still useful for debugging a live incident,
no longer able to consume the volume. TTL is the ONLY mechanism used here, and
deliberately so -- see the note on `clickhouse.systemLogs` in values.yaml for
the two things that were tried and do not work: `remove="1"` (silently
ineffective) and a `<profiles>` block (crash-loops the server, because
`profiles` is not accepted in config.d).

TTLs apply to existing tables too -- ClickHouse picks up the new setting and
prunes on the next merge -- so this heals a cluster that is already filling up,
as long as it has enough free space to merge.
*/ -}}
{{- if .Values.clickhouse.systemLogs.bound }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: langfuse-clickhouse-system-logs
  namespace: {{ .Release.Namespace }}
data:
  # Dropped into /etc/clickhouse-server/config.d/, which ClickHouse merges over
  # its packaged defaults. Disabling a log needs the `remove` attribute: an empty
  # element would leave the default in place.
  # TTL ON EVERYTHING, rather than trying to disable individual logs.
  #
  # The first version of this used `<trace_log remove="1"/>`. MEASURED: it does
  # not work. After the restart that applied it, trace_log was recreated and had
  # collected 119,289 rows within 11 hours -- `remove` drops the config element,
  # and ClickHouse then falls back to its compiled-in default, which is enabled.
  # The TTLs in that same file DID apply, verified as
  # `TTL event_date + toIntervalDay(3)` on every table carrying one.
  #
  # So retention is the mechanism that actually holds, and it is applied
  # uniformly. A TTL bounds a table whatever its write rate, which matters here
  # because the rate varies enormously with load: trace_log grew 1.5 GiB/day
  # under the load that filled the disk, and ~5 MiB/day when idle. Disabling
  # tables is left to the profiler settings below, which stop the data being
  # produced instead of arguing with the config loader.
  system-logs.xml: |
    <clickhouse>
      <!-- Was 15.08 GiB / 675M rows. Bounded, not disabled — see above. -->
      <trace_log>
        <ttl>event_date + INTERVAL {{ .Values.clickhouse.systemLogs.ttlDays }} DAY DELETE</ttl>
      </trace_log>
      <text_log>
        <ttl>event_date + INTERVAL {{ .Values.clickhouse.systemLogs.ttlDays }} DAY DELETE</ttl>
        <level>warning</level>
      </text_log>
      <part_log>
        <ttl>event_date + INTERVAL {{ .Values.clickhouse.systemLogs.ttlDays }} DAY DELETE</ttl>
      </part_log>
      <metric_log>
        <ttl>event_date + INTERVAL {{ .Values.clickhouse.systemLogs.ttlDays }} DAY DELETE</ttl>
      </metric_log>
      <asynchronous_metric_log>
        <ttl>event_date + INTERVAL {{ .Values.clickhouse.systemLogs.ttlDays }} DAY DELETE</ttl>
      </asynchronous_metric_log>
      <!-- Langfuse v4's "legacy API usage" job reads query_log, so it stays. -->
      <query_log>
        <ttl>event_date + INTERVAL {{ .Values.clickhouse.systemLogs.ttlDays }} DAY DELETE</ttl>
      </query_log>
      <processors_profile_log>
        <ttl>event_date + INTERVAL {{ .Values.clickhouse.systemLogs.ttlDays }} DAY DELETE</ttl>
      </processors_profile_log>
      <opentelemetry_span_log>
        <ttl>event_date + INTERVAL {{ .Values.clickhouse.systemLogs.ttlDays }} DAY DELETE</ttl>
      </opentelemetry_span_log>
      <error_log>
        <ttl>event_date + INTERVAL {{ .Values.clickhouse.systemLogs.ttlDays }} DAY DELETE</ttl>
      </error_log>

    </clickhouse>
{{- end }}
