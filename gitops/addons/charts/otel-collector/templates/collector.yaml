apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: {{ .Release.Namespace }}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      {{- if .Values.bifrost.enabled }}
      prometheus:
        config:
          scrape_configs:
            - job_name: bifrost-llm-gateway
              scrape_interval: 15s
              static_configs:
                - targets: ["{{ .Values.bifrost.scrapeEndpoint }}"]
      {{- end }}

    processors:
      probabilistic_sampler:
        sampling_percentage: 100.0
      memory_limiter:
        check_interval: 1s
        limit_percentage: 85
        spike_limit_percentage: 10
      batch:
        send_batch_size: 1024
        timeout: 500ms
        send_batch_max_size: 2048

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      {{- if and .Values.amp.enabled .Values.amp.remoteWriteEndpoint }}
      sigv4auth:
        region: {{ .Values.global.awsRegion }}
      {{- end }}

    exporters:
      {{- if and .Values.langfuse.enabled .Values.langfuse.endpoint }}
      otlphttp/langfuse:
        endpoint: "{{ .Values.langfuse.endpoint }}"
        timeout: 30s
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 5m
        headers:
          Authorization: "Basic ${env:LANGFUSE_OTEL_AUTH}"
          x-langfuse-ingestion-version: "4"
      {{- end }}
      {{- if .Values.bifrost.enabled }}
      debug:
        verbosity: basic
      {{- end }}
      {{- if and .Values.amp.enabled .Values.amp.remoteWriteEndpoint }}
      prometheusremotewrite/amp:
        endpoint: "{{ .Values.amp.remoteWriteEndpoint }}api/v1/remote_write"
        auth:
          authenticator: sigv4auth
      {{- end }}

    service:
      extensions:
        - health_check
        {{- if and .Values.amp.enabled .Values.amp.remoteWriteEndpoint }}
        - sigv4auth
        {{- end }}
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, probabilistic_sampler, batch]
          exporters:
            {{- if and .Values.langfuse.enabled .Values.langfuse.endpoint }}
            - otlphttp/langfuse
            {{- end }}
        {{- if .Values.bifrost.enabled }}
        metrics:
          receivers: [prometheus]
          processors: [batch]
          exporters:
            {{- if and .Values.amp.enabled .Values.amp.remoteWriteEndpoint }}
            - prometheusremotewrite/amp
            {{- else }}
            - debug
            {{- end }}
        {{- end }}
      telemetry:
        logs:
          level: "info"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: {{ .Release.Namespace }}
  labels:
    app: otel-collector
spec:
  replicas: {{ .Values.collector.replicas }}
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
      annotations:
        # Roll the collector pods when the config changes. Include a config
        # revision string alongside the key values so a config.yaml-only change
        # (e.g. the exporter auth header) triggers a restart — the collector
        # reads its config only at startup. Bump configRevision when editing
        # config.yaml without a values change.
        checksum/config: {{ printf "%s-%s-%s-%s-%s" (.Values.configRevision | default "1" | toString) (.Values.langfuse.endpoint | default "") (.Values.bifrost.scrapeEndpoint | default "") (.Values.amp.remoteWriteEndpoint | default "") (.Values.amp.enabled | toString) | sha256sum | trunc 32 }}
        checksum/langfuse-auth: {{ .Values.langfuse.secretManagerKey | default "none" | sha256sum | trunc 8 }}
    spec:
      serviceAccountName: otel-collector
      containers:
        - name: collector
          image: {{ .Values.collector.image }}
          args:
            - '--config=/conf/config.yaml'
          ports:
            - containerPort: 4317
              name: otlp-grpc
              protocol: TCP
            - containerPort: 4318
              name: otlp-http
              protocol: TCP
          env:
            - name: AWS_REGION
              value: {{ .Values.global.awsRegion }}
            {{- if and .Values.langfuse.enabled .Values.langfuse.endpoint }}
            - name: LANGFUSE_OTEL_AUTH
              valueFrom:
                secretKeyRef:
                  name: langfuse-otel-auth
                  key: LANGFUSE_OTEL_AUTH
                  optional: true
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /conf
          resources:
            {{- toYaml .Values.collector.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
  type: ClusterIP
