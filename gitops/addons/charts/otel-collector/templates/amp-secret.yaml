{{- if include "otel-collector.ampFromSecret" . }}
# AMP workspace endpoint + region for remote write, from the Secrets Manager secret
# the platform seeds once AMP exists (properties amp-workspace / amp-region). Lets
# every cluster, hub and spokes, find the workspace without an endpoint in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: otel-collector-amp
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  refreshInterval: "5m"
  target:
    name: otel-collector-amp
    creationPolicy: Owner
  data:
    - secretKey: AMP_WORKSPACE
      remoteRef:
        key: {{ .Values.amp.secretManagerKey }}
        property: amp-workspace
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: AMP_REGION
      remoteRef:
        key: {{ .Values.amp.secretManagerKey }}
        property: amp-region
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- end }}
