{{- if and .Values.langfuse.enabled .Values.langfuse.endpoint .Values.langfuse.secretManagerKey }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-otel-auth
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  # Fast self-heal: the source SM secret `<resourcePrefix>-hub/langfuse-otel` is written by the langfuse
  # push-otel-keys Sync hook, which may land AFTER this ExternalSecret's first sync on a
  # fresh env. A short refresh creates langfuse-otel-auth within ~1m of the SM key
  # appearing (was "1h" -> the collector sat at 401 for up to an hour on a new env).
  refreshInterval: "1m"
  target:
    # Content-addressed name (see _helpers.tpl): changes whenever the token
    # template or SM key changes, so the collector waits for a fresh render.
    name: {{ include "otel-collector.langfuseAuthSecretName" . }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Token template and why b64enc is required: see _helpers.tpl.
        LANGFUSE_OTEL_AUTH: |-
          {{ include "otel-collector.langfuseAuthTemplate" . }}
  data:
    - secretKey: publicKey
      remoteRef:
        key: {{ .Values.langfuse.secretManagerKey }}
        property: LANGFUSE_PUBLIC_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: secretKey
      remoteRef:
        key: {{ .Values.langfuse.secretManagerKey }}
        property: LANGFUSE_SECRET_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- end }}
