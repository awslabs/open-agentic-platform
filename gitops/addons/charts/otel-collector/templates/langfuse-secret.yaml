{{- if and .Values.langfuse.enabled .Values.langfuse.endpoint .Values.langfuse.secretManagerKey }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-otel-auth
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  refreshInterval: "1h"
  target:
    name: langfuse-otel-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Base64(publicKey:secretKey) for HTTP Basic Auth
        LANGFUSE_OTEL_AUTH: |-
          {{`{{ printf "%s:%s" .publicKey .secretKey | b64enc }}`}}
  data:
    - secretKey: publicKey
      remoteRef:
        key: {{ .Values.langfuse.secretManagerKey }}
        property: LANGFUSE_PUBLIC_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: secretKey
      remoteRef:
        key: {{ .Values.langfuse.secretManagerKey }}
        property: LANGFUSE_SECRET_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- end }}
