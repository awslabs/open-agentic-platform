global:
  awsRegion: us-west-2

collector:
  image: public.ecr.aws/aws-observability/aws-otel-collector:v0.43.1
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi

# Langfuse OTLP trace export (via collector — merges agent + Bifrost spans)
langfuse:
  enabled: true
  # Endpoint set dynamically by ApplicationSet (https://<ingress>/api/public/otel)
  endpoint: ""
  # Secret Manager key holding LANGFUSE_PUBLIC_KEY and LANGFUSE_SECRET_KEY
  secretManagerKey: ""

# Bifrost Prometheus metrics scraping
bifrost:
  enabled: true
  scrapeEndpoint: "bifrost.bifrost.svc.cluster.local:8080"

# AMP remote write for Grafana dashboards (requires Pod Identity with AMP write permissions)
amp:
  enabled: false
  # Workspace endpoint ending in "/" (".../workspaces/ws-xxx/"). When set it wins.
  remoteWriteEndpoint: ""
  # Otherwise, Secrets Manager secret the platform already seeds with the AMP workspace:
  # properties `amp-workspace` (endpoint ending in "/") and `amp-region`. Read via the
  # ClusterSecretStore, so the endpoint never has to be known in git.
  secretManagerKey: ""
  # Cluster name: Pod Identity target, IAM role name prefix and the `cluster` label on
  # every remote-written series (keeps hub and spoke series apart in one workspace).
  clusterName: ""
  # Secrets Manager path only: render the IAM Role + PodIdentityAssociation for the
  # collector service account. Set false where another chart already associates
  # otel/otel-collector on this cluster. The literal-endpoint path always renders them.
  podIdentity: true
