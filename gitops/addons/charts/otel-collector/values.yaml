# Bump to force a collector rollout on config.yaml-only changes (see collector.yaml checksum/config)
configRevision: "2"

global:
  awsRegion: us-west-2

collector:
  image: public.ecr.aws/aws-observability/aws-otel-collector:v0.43.1
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi

# Langfuse OTLP trace export (via collector — merges agent + Bifrost spans)
langfuse:
  enabled: true
  # Endpoint set dynamically by ApplicationSet (https://<ingress>/api/public/otel)
  endpoint: ""
  # Secret Manager key holding LANGFUSE_PUBLIC_KEY and LANGFUSE_SECRET_KEY
  secretManagerKey: ""

# Bifrost Prometheus metrics scraping
bifrost:
  enabled: true
  scrapeEndpoint: "bifrost.bifrost.svc.cluster.local:8080"

# AMP remote write for Grafana dashboards (requires Pod Identity with AMP write permissions)
amp:
  enabled: false
  remoteWriteEndpoint: ""
