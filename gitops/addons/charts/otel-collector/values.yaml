global:
  awsRegion: us-west-2

collector:
  image: public.ecr.aws/aws-observability/aws-otel-collector:v0.43.1
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi

# Langfuse OTLP trace export (via collector — merges agent + Bifrost spans)
langfuse:
  enabled: true
  # Endpoint set dynamically by ApplicationSet (https://<ingress>/api/public/otel)
  endpoint: ""
  # Secret Manager key holding LANGFUSE_PUBLIC_KEY and LANGFUSE_SECRET_KEY
  secretManagerKey: ""

# Bifrost Prometheus metrics scraping. Bifrost's management plane needs a login,
# so the collector scrapes the bifrost chart's metrics proxy, which holds the
# credential in namespace bifrost. No Bifrost credential belongs in this chart.
bifrost:
  enabled: true
  scrapeEndpoint: "bifrost-metrics.bifrost.svc.cluster.local:8080"

# AMP remote write for Grafana dashboards (requires Pod Identity with AMP write permissions)
amp:
  enabled: false
  # Workspace endpoint ending in "/" (".../workspaces/ws-xxx/"). When set it wins.
  remoteWriteEndpoint: ""
  # Otherwise, Secrets Manager secret the platform already seeds with the AMP workspace:
  # properties `amp-workspace` (endpoint ending in "/") and `amp-region`. Read via the
  # ClusterSecretStore, so the endpoint never has to be known in git.
  secretManagerKey: ""
  # Cluster name: Pod Identity target, IAM role name prefix and the `cluster` label on
  # every remote-written series (keeps hub and spoke series apart in one workspace).
  clusterName: ""
  # Secrets Manager path only: render the IAM Role + PodIdentityAssociation for the
  # collector service account. Set false where another chart already associates
  # otel/otel-collector on this cluster. The literal-endpoint path always renders them.
  podIdentity: true
# Per-agent guardrail outcomes from the gateway access log (docs/architecture/agent-guardrails.md,
# D8). The gateway cannot put the caller on its own guardrail counter, so it exports one OTLP
# log record per /llm request to this collector, a count connector turns the records into
# counters, and they are written to AMP next to the Bifrost series. Not set by hand: the
# registry derives enabled from the enable_agent_guardrails, enable_agent_gateway and
# enable_agent_core labels with the same expression as agent-gateway. A string, because the
# registry renders text. Off by default: the collector config is unchanged.
guardrails:
  accessLog:
    enabled: "false"
    # The count connector and the deltatocumulative processor are not in the ADOT build pinned
    # in collector.image, so the collector that hosts this pipeline runs this OpenTelemetry
    # Collector contrib release instead. Pinned, so an upgrade is deliberate.
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.165.0
    # A stream with no record for this long is dropped, so an idle agent disappears from the
    # series instead of staying at its last count.
    maxStale: 1h
    # Cluster-internal Service the gateway exports to (agent-gateway guardrails.accessLog.collector
    # names the same Service).
    serviceName: otel-collector-guardrail
