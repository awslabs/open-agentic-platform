global:
  # KeyCloak configuration
  keycloak:
    # Kubernetes service name for JWKS fetching (cluster-internal)
    serviceName: keycloak
    # Namespace where KeyCloak is deployed
    namespace: keycloak
    # Service port
    servicePort: 8080
    # External issuer URL (must match 'iss' claim in JWT tokens)
    # This is the externally-reachable KeyCloak URL
    # For internal-only use: http://keycloak.keycloak.svc.cluster.local:8080/realms/master
    issuerUrl: "https://idp.hmmuthus.people.aws.dev/keycloak/realms/platform"
    # Realm to use
    realm: platform
    # HTTP relative path prefix (matches KeyCloak's http-relative-path setting)
    pathPrefix: "/keycloak"
  # Gateway listener port
  gatewayPort: 8080

# Ingress for exposing agent gateway via the platform ALB
ingress:
  enabled: true
  className: platform
  host: ""
  # Dedicated hostname for agent routes (e.g. agents.peeks.dev.shapirov.people.a2z.com).
  # Covered by the wildcard ACM cert. ExternalDNS creates the Route53 record automatically.
  # Defaults to "agents.<host>" if not set.
  agentHost: ""

# MCP backend targets - the agent-core MCP servers
mcpBackend:
  namespace: agent-core-infra
  targets:
    - name: code
      host: execute-code-mcp-v1.agent-core-infra.svc.cluster.local
      port: 8080
      protocol: StreamableHTTP
    - name: browser
      host: browser-mcp-v1.agent-core-infra.svc.cluster.local
      port: 8080
      protocol: StreamableHTTP
    - name: memory
      host: memory-mcp-v1.agent-core-infra.svc.cluster.local
      port: 8080
      protocol: StreamableHTTP

# JWT authentication configuration (humans, via Keycloak)
jwtAuth:
  # Validation mode: Strict requires all claims to be valid
  mode: Strict
  # Cache duration for JWKS keys
  cacheDuration: "5m"
  # Authorization - CEL expression for allowed human callers.
  # has() guard keeps this safe when a second (workload) provider is active and
  # validates tokens that lack realm_access (EKS OIDC ServiceAccount tokens).
  allowExpression: 'has(jwt.realm_access) && jwt.realm_access.roles.exists(r, r == "default-roles-platform")'

# Workload identity (Shape A): the gateway trusts the cluster's EKS OIDC issuer
# as a SECOND JWT provider so agent workloads authenticate with their projected
# ServiceAccount token (no secret, auto-rotated). Keycloak (jwtAuth) stays for
# humans. Both providers coexist on the same Strict policy.
#
# Activation is derived from `issuer`: when empty (the default) the workload
# provider and its backend are omitted entirely (humans-only). Per-cluster
# values are wired from the agent-gateway addon valuesObject in
# gitops/addons/registry/gateway.yaml.
workloadIdentity:
  # Cluster OIDC issuer, e.g. https://oidc.eks.us-west-2.amazonaws.com/id/<ID>.
  # Empty = workload identity disabled.
  issuer: ""
  # Host serving the JWKS (the OIDC issuer host); TLS uses system trusted CAs.
  jwksHost: ""
  # JWKS path relative to the host, e.g. /id/<ID>/keys
  jwksPath: ""
  # Required audience stamped into the projected SA token and enforced here.
  audience: "agentgateway"
  # CEL prefix identifying allowed workload subjects (system:serviceaccount:<ns>:<sa>).
  allowedSubjectPrefix: "system:serviceaccount:"

# MCP authentication configuration
# Disabled by default — Gateway-level JWT auth (jwt-policy.yaml) handles
# authentication. Enable only if you need MCP-specific OAuth discovery
# without Gateway-level auth.
mcpAuth:
  enabled: false
  # Validation mode
  mode: Strict
  # Identity provider type
  provider: Keycloak
  # Expected audiences in JWT tokens
  audiences:
    - mcp-client
  # Resource metadata for OAuth discovery
  resourceMetadata:
    # Resource identifier for this MCP server (external URL)
    resource: ""
    # Scopes supported by this MCP server
    scopesSupported:
      - email
      - openid
      - profile
    # Methods for providing bearer tokens
    bearerMethodsSupported:
      - header
      - body
      - query
