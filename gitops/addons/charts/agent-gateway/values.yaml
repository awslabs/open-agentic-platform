global:
  # Set by the registry from cluster-secret annotations, used by the guardrail IAM role
  # (templates/guardrail-iam.yaml). Empty outside the registry; the template then fails.
  awsRegion: ""
  awsAccountId: ""
  clusterName: ""
  # insecure=true: ingress serves plain HTTP; TLS is terminated upstream of the
  # ALB (e.g. by CloudFront). Set from the cluster secret's insecure annotation,
  # same convention as the keycloak/argo-workflows charts.
  insecure: "false"
  # KeyCloak configuration
  keycloak:
    # Kubernetes service name for JWKS fetching (cluster-internal)
    serviceName: keycloak
    # Namespace where KeyCloak is deployed
    namespace: keycloak
    # Service port
    servicePort: 8080
    # External issuer URL (must match 'iss' claim in JWT tokens)
    # This is the externally-reachable KeyCloak URL
    # For internal-only use: http://keycloak.keycloak.svc.cluster.local:8080/realms/master
    issuerUrl: "https://idp.hmmuthus.people.aws.dev/keycloak/realms/platform"
    # Realm to use
    realm: platform
    # HTTP relative path prefix (matches KeyCloak's http-relative-path setting)
    pathPrefix: "/keycloak"
  # Gateway listener port
  gatewayPort: 8080

# Ingress for exposing agent gateway via the platform ALB
ingress:
  enabled: true
  className: platform
  host: ""
  # Dedicated hostname for agent routes (e.g. agents.peeks.dev.shapirov.people.a2z.com).
  # Covered by the wildcard ACM cert. ExternalDNS creates the Route53 record only if
  # its domain filter covers this host. The registry default derives a sibling
  # "agents.<parent>" (gitops/addons/registry/gateway.yaml), so external-dns must
  # manage the parent zone; see https://github.com/awslabs/open-agentic-platform/issues/116
  # Defaults to "agents.<host>" if not set.
  agentHost: ""

# MCP backend targets - the agent-core MCP servers
mcpBackend:
  namespace: agent-core-infra
  targets:
    - name: code
      host: execute-code-mcp-v1.agent-core-infra.svc.cluster.local
      port: 8080
      protocol: StreamableHTTP
    - name: browser
      host: browser-mcp-v1.agent-core-infra.svc.cluster.local
      port: 8080
      protocol: StreamableHTTP
    - name: memory
      host: memory-mcp-v1.agent-core-infra.svc.cluster.local
      port: 8080
      protocol: StreamableHTTP

# JWT authentication configuration (humans, via Keycloak)
jwtAuth:
  # Validation mode: Strict requires all claims to be valid
  mode: Strict
  # Cache duration for JWKS keys
  cacheDuration: "5m"
  # Authorization - CEL expression for allowed human callers.
  # has() guard keeps this safe when a second (workload) provider is active and
  # validates tokens that lack realm_access (EKS OIDC ServiceAccount tokens).
  allowExpression: 'has(jwt.realm_access) && jwt.realm_access.roles.exists(r, r == "default-roles-platform")'

# Workload identity (Shape A): the gateway trusts the cluster's EKS OIDC issuer
# as a SECOND JWT provider so agent workloads authenticate with their projected
# ServiceAccount token (no secret, auto-rotated). Keycloak (jwtAuth) stays for
# humans. Both providers coexist on the same Strict policy.
#
# Activation is derived from `issuer`: when empty (the default) the workload
# provider and its backend are omitted entirely (humans-only). Per-cluster
# values are wired from the agent-gateway addon valuesObject in
# gitops/addons/registry/gateway.yaml.
workloadIdentity:
  # Cluster OIDC issuer, e.g. https://oidc.eks.us-west-2.amazonaws.com/id/<ID>.
  # Empty = workload identity disabled.
  issuer: ""
  # Host serving the JWKS (the OIDC issuer host); TLS uses system trusted CAs.
  jwksHost: ""
  # JWKS path relative to the host, e.g. /id/<ID>/keys
  jwksPath: ""
  # Required audience stamped into the projected SA token and enforced here.
  audience: "agentgateway"
  # CEL prefix identifying allowed workload subjects (system:serviceaccount:<ns>:<sa>).
  allowedSubjectPrefix: "system:serviceaccount:"

# Caller credential passthrough.
#
# jwt-policy.yaml validates the caller's bearer token at the gateway edge and
# that validation strips the credential, so without this the token never reaches
# the backend and an agent cannot forward the caller's identity to its tools
# (it falls back to its own ServiceAccount token). Enabled by default because
# user-delegated tool access is a platform contract, not an opt-in.
#
# Disable on clusters that use backend.auth.oauthTokenExchange instead, which
# gives tools a reduced-scope token rather than the caller's original one.
credentialPassthrough:
  enabled: true

# Sets a header carrying the authenticated caller's JWT `sub` on every request the
# gateway forwards (templates/caller-identity-policy.yaml). The value is overwritten,
# never appended, so a client cannot supply its own. X-Forwarded-User is the de facto
# name used by auth proxies (nginx auth_request, oauth2-proxy). Agents read it as their
# long-term memory actor.
callerIdentity:
  enabled: true

# MCP authentication configuration
# Disabled by default — Gateway-level JWT auth (jwt-policy.yaml) handles
# authentication. Enable only if you need MCP-specific OAuth discovery
# without Gateway-level auth.
mcpAuth:
  enabled: false
  # Validation mode
  mode: Strict
  # Identity provider type
  provider: Keycloak
  # Expected audiences in JWT tokens
  audiences:
    - mcp-client
  # Resource metadata for OAuth discovery
  resourceMetadata:
    # Resource identifier for this MCP server (external URL)
    resource: ""
    # Scopes supported by this MCP server
    scopesSupported:
      - email
      - openid
      - profile
    # Methods for providing bearer tokens
    bearerMethodsSupported:
      - header
      - body
      - query

# Which agents may call which MCP servers (templates/mcp-access.yaml). Empty by
# default: every MCP server keeps the Gateway-wide rule. Set per environment in
# gitops/overlays/environments/<env>/agent-gateway/values.yaml.
mcpAccess: {}

# Agents allowed to call other agents on behalf of a user
# (templates/caller-identity-policy.yaml, docs/agent-delegation/DESIGN.md). A listed agent
# may send X-Delegated-User, and the gateway then sets X-Forwarded-User to that user.
# Empty by default: no agent can assert a user. Entries must be <namespace>/<agent>; a
# bare name fails the render (unlike agentAccess and mcpAccess, where a bare name means
# the route's namespace), because this is the list the gateway trusts to name users.
delegation:
  agents: []

# Which agents may call which agents (templates/agent-access.yaml). Same shape and rules
# as mcpAccess. Empty by default: every agent keeps the Gateway-wide rule (any
# authenticated caller). Set per environment.
agentAccess: {}
# Agent guardrails (docs/architecture/agent-guardrails.md). Not set by hand: the registry
# derives it from the enable_agent_guardrails, enable_agent_gateway and enable_agent_core
# cluster-secret labels with the same expression as crossplane-agentcore and
# oam-agent-components, so the three cannot disagree. A string, because the registry
# renders text. Default off: nothing guardrail-related renders.
guardrails:
  enabled: "false"
  # IAM partition of the guardrail ARNs in the proxy role policy.
  arnPartition: aws
  # The gateway proxy, which calls Bedrock ApplyGuardrail. The controller creates its
  # ServiceAccount from the Gateway name (templates/gateway.yaml), so serviceAccountName is
  # that name unless an AgentgatewayParameters override renames it. Namespace is the
  # Gateway's.
  proxy:
    namespace: agentgateway-system
    serviceAccountName: agentgateway-proxy
    # The Gateway the /llm routes attach to (templates/gateway.yaml). Its Service has the
    # same name.
    gatewayName: agentgateway-proxy
    clusterDomain: cluster.local
  # Same cross-Region guardrail profile as crossplane-agentcore guardrails.crossRegion.profileId
  # (a test pins both). With a cross-Region guardrail, ApplyGuardrail also needs the profile
  # resource in every destination Region, so the policy allows it in any Region of the account.
  # Empty for a CLASSIC tier guardrail.
  crossRegion:
    profileId: "us.guardrail.v1:0"
  # Profile routing. The same profile names, in the same order, as crossplane-agentcore
  # guardrails.order (a test pins both). That chart holds what each profile detects; this
  # chart holds how the gateway enforces it. Order runs from the weakest profile to the
  # strongest.
  order:
    - observe
    - standard
    - strict
  # Profiles at or above this one admit every agent (any ServiceAccount token the gateway
  # accepts). Weaker profiles admit only agents named in guardrailAccess. The agent
  # component reads the same value from oam-agent-components global.guardrails.defaultProfile.
  defaultProfile: standard
  # Per profile:
  #   action       Reject blocks a flagged request. Audit records it and lets it through.
  #   failureMode  FailClosed refuses the call when Bedrock cannot be reached. Set on every
  #                profile explicitly, because the default could change upstream.
  #   scope        Which parts of the request are inspected. Tool call inputs are not
  #                inspected unless ToolInput is listed.
  # All three are required for every profile. The render fails when one is missing.
  profiles:
    observe:
      action: Audit
      failureMode: FailClosed
      scope: [Messages, ToolOutput]
    standard:
      action: Reject
      failureMode: FailClosed
      scope: [Messages, ToolOutput]
    strict:
      action: Reject
      failureMode: FailClosed
      scope: [Messages, ToolOutput]
  # Scrape target for the gateway proxy's own metrics (templates/proxy-metrics-service.yaml).
  # 15020 is the proxy's default stats address in v1.7.0 (config.rs, STATS_ADDR), path
  # /metrics. The guardrail counter is agentgateway_guardrail_checks_total with labels
  # phase (Request or Response) and action (Allow, FailOpen, Audit, Mask, Reject). It has no
  # profile or agent label, so per-agent outcomes come from the access log instead.
  metrics:
    port: 15020
  # Binder (templates/guardrail-binder.yaml): writes each guardrail's generated ID and
  # version into its AgentgatewayPolicy once Crossplane has created them. A PostSync hook
  # does it after a sync and a CronJob repairs it later, for example after a catalog
  # revision bump creates a new GuardrailVersion. The image only needs Python.
  binder:
    image: python:3.12-alpine
    schedule: "*/15 * * * *"
    deadlineSeconds: 600
    pollSeconds: 10
  # Access log export for per-agent outcomes (templates/guardrail-accesslog.yaml). The native
  # guardrail counter has no agent label, so the gateway sends one OTLP log record per /llm
  # request to the OTel collector, which counts them (otel-collector guardrails.accessLog).
  # Not set by hand: the registry derives enabled like guardrails.enabled, plus the
  # enable_otel_collector label, so the gateway exports only where a collector is ready.
  # A string, because the registry renders text.
  accessLog:
    enabled: "false"
    # The collector Service that receives OTLP over HTTP. The same name as the otel-collector
    # chart's guardrails.accessLog.serviceName, in the namespace the otel-collector addon
    # installs to (gitops/addons/registry/observability.yaml).
    collector:
      name: otel-collector-guardrail
      namespace: otel
      port: 4318
  # Text of the rejection returned to the caller. The status code is 403.
  rejectMessage: "The request was blocked by the platform guardrail."
  # The LLM gateway the /llm routes forward to: Bifrost, by its in-cluster Service. The
  # AgentgatewayBackend names host and port directly because a backendRef may only point at
  # a Service in the backend's own namespace, and Bifrost runs in its own namespace.
  backend:
    name: llm
    host: bifrost.bifrost.svc.cluster.local
    port: 8080
    # Path Bifrost serves chat completions on. Set explicitly so it does not depend on the
    # gateway's default for the format.
    completionsPath: /v1/chat/completions
# Which agents may use a profile weaker than guardrails.defaultProfile
# (templates/guardrail-routes.yaml). Same shape as mcpAccess, with the full
# <namespace>/<agent> form required (a bare name fails the render). Profiles at or above
# the default admit every agent, so listing one there fails the render. Empty by default:
# no agent may use a weaker profile. Set per environment in
# gitops/overlays/environments/<env>/agent-gateway/values.yaml.
guardrailAccess: {}
