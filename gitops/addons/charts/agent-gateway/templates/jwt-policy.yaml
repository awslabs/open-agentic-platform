{{- $issuerUrl := .Values.global.keycloak.issuerUrl -}}
{{- $realm := .Values.global.keycloak.realm -}}
{{- $pathPrefix := .Values.global.keycloak.pathPrefix | default "" -}}
{{- $jwksPath := printf "%s/realms/%s/protocol/openid-connect/certs" $pathPrefix $realm -}}
{{- $wi := .Values.workloadIdentity -}}
{{- /*
"Which agent is calling" is the token's `sub`, which per-server rules match
(allowedAgents on mcp-server, mcpAccess here). A `sub` is only a claim, so bind it to
the issuer that minted it:
  - a ServiceAccount-shaped subject (allowedSubjectPrefix) is accepted only from the
    cluster's OIDC issuer (workloadIdentity.issuer);
  - the human branch can never admit one, even if Keycloak were to mint such a `sub`.
Per-server rules are `Require`, so they AND with this Gateway rule and inherit the
binding without repeating the issuer. `has()` keeps the human branch unchanged for a
token without `sub`.
*/ -}}
{{- $saSub := printf "has(jwt.sub) && jwt.sub.startsWith(%q)" $wi.allowedSubjectPrefix -}}
{{- $authz := printf "(%s) && !(%s)" .Values.jwtAuth.allowExpression $saSub -}}
{{- if $wi.issuer -}}
{{- $authz = printf "(%s) || (jwt.iss == %q && %s)" $authz $wi.issuer $saSub -}}
{{- end -}}
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: jwt-auth-policy
  namespace: agentgateway-system
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: agentgateway-proxy
  traffic:
    jwtAuthentication:
      mode: {{ .Values.jwtAuth.mode }}
      providers:
      # Human callers — Keycloak
      - issuer: {{ $issuerUrl | quote }}
        jwks:
          remote:
            jwksPath: {{ $jwksPath | quote }}
            cacheDuration: {{ .Values.jwtAuth.cacheDuration | quote }}
            backendRef:
              group: agentgateway.dev
              kind: AgentgatewayBackend
              name: keycloak-jwks
              namespace: agentgateway-system
      {{- if $wi.issuer }}
      # Workload callers — cluster EKS OIDC (projected ServiceAccount tokens)
      - issuer: {{ $wi.issuer | quote }}
        audiences:
        - {{ $wi.audience | quote }}
        jwks:
          remote:
            jwksPath: {{ required "workloadIdentity.jwksPath is required when workloadIdentity.issuer is set" $wi.jwksPath | quote }}
            cacheDuration: {{ .Values.jwtAuth.cacheDuration | quote }}
            backendRef:
              group: agentgateway.dev
              kind: AgentgatewayBackend
              name: eks-oidc-jwks
              namespace: agentgateway-system
      {{- end }}
    authorization:
      action: Allow
      policy:
        matchExpressions:
        - {{ $authz | quote }}
