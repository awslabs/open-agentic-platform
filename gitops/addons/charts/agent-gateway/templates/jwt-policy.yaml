{{- $issuerUrl := .Values.global.keycloak.issuerUrl -}}
{{- $realm := .Values.global.keycloak.realm -}}
{{- $pathPrefix := .Values.global.keycloak.pathPrefix | default "" -}}
{{- $jwksPath := printf "%s/realms/%s/protocol/openid-connect/certs" $pathPrefix $realm -}}
{{- $wi := .Values.workloadIdentity -}}
{{- $authz := .Values.jwtAuth.allowExpression -}}
{{- if $wi.issuer -}}
{{- $authz = printf "(%s) || jwt.sub.startsWith(%q)" .Values.jwtAuth.allowExpression $wi.allowedSubjectPrefix -}}
{{- end -}}
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: jwt-auth-policy
  namespace: agentgateway-system
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: agentgateway-proxy
  traffic:
    jwtAuthentication:
      mode: {{ .Values.jwtAuth.mode }}
      providers:
      # Human callers — Keycloak
      - issuer: {{ $issuerUrl | quote }}
        jwks:
          remote:
            jwksPath: {{ $jwksPath | quote }}
            cacheDuration: {{ .Values.jwtAuth.cacheDuration | quote }}
            backendRef:
              group: agentgateway.dev
              kind: AgentgatewayBackend
              name: keycloak-jwks
              namespace: agentgateway-system
      {{- if $wi.issuer }}
      # Workload callers — cluster EKS OIDC (projected ServiceAccount tokens)
      - issuer: {{ $wi.issuer | quote }}
        audiences:
        - {{ $wi.audience | quote }}
        jwks:
          remote:
            jwksPath: {{ required "workloadIdentity.jwksPath is required when workloadIdentity.issuer is set" $wi.jwksPath | quote }}
            cacheDuration: {{ .Values.jwtAuth.cacheDuration | quote }}
            backendRef:
              group: agentgateway.dev
              kind: AgentgatewayBackend
              name: eks-oidc-jwks
              namespace: agentgateway-system
      {{- end }}
    authorization:
      action: Allow
      policy:
        matchExpressions:
        - {{ $authz | quote }}
