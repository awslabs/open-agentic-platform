{{- if .Values.credentialPassthrough.enabled }}
# Restores the caller's bearer token onto requests the gateway forwards upstream.
#
# Why this exists: jwt-policy.yaml authenticates the caller at the gateway edge,
# and that validation consumes the credential. The CRD documents the behaviour on
# this very field: "Reuses a client token already validated by another policy.
# Those policies may strip client credentials; passthrough adds the original
# token back to the backend request." Verified on oap-dev: without this policy an
# agent pod receives no `authorization` header at all (observed header set was
# accept, content-length, content-type, host, user-agent), so the agent falls
# back to its own ServiceAccount token for outbound MCP calls and the caller's
# identity is silently lost. Same class of default as Envoy's jwt_authn
# `forward: false` (envoyproxy/gateway#2295).
#
# Scoped to the Gateway, matching jwt-policy.yaml, so it covers both hops that
# traverse the proxy: client -> agent, and agent -> MCP server.
#
# Tradeoff to be aware of: passthrough hands the caller's original token to the
# backend unchanged, so a tool backend receives a credential usable wherever that
# token is accepted. Narrowing that is what `backend.auth.oauthTokenExchange`
# is for (exchange the caller's token for a per-tool, reduced-scope token before
# it leaves the proxy); see docs/architecture/agent-identity-and-token-exchange.md.
# Set credentialPassthrough.enabled=false on clusters that adopt exchange instead.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: credential-passthrough-policy
  namespace: agentgateway-system
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: agentgateway-proxy
  backend:
    auth:
      passthrough: {}
{{- end }}
