{{- if .Values.ingress.enabled }}
---
# Separate ClusterIP service for ALB ingress routing.
# The agentgateway-proxy service is a LoadBalancer (NLB) managed by the
# Gateway API controller. This service targets the same pods but allows
# the ALB to create IP-mode target groups without conflict.
apiVersion: v1
kind: Service
metadata:
  name: agentgateway-ingress
  namespace: agentgateway-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agentgateway-proxy
    app.kubernetes.io/instance: agentgateway-proxy
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
---
{{- /* insecure: HTTP-only ingress, no cert (consumer terminates TLS upstream, e.g. CloudFront). Same convention as keycloak/argo-workflows. */}}
{{- $insecure := eq (toString (.Values.global.insecure | default "false")) "true" }}
# Primary ingress: /sse and OAuth discovery on the shared platform hostname.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentgateway
  namespace: agentgateway-system
  annotations:
    alb.ingress.kubernetes.io/target-type: ip
    {{- if $insecure }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    {{- else }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    {{- end }}
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=300
    argocd.argoproj.io/sync-wave: "10"
spec:
  ingressClassName: {{ .Values.ingress.className | default "platform" }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /sse
            pathType: Prefix
            backend:
              service:
                name: agentgateway-ingress
                port:
                  number: 8080
          - path: /.well-known/oauth-protected-resource
            pathType: Prefix
            backend:
              service:
                name: agentgateway-ingress
                port:
                  number: 8080
{{- /*
  Dedicated agent hostname: routes ALL paths to agentgateway-proxy on a
  separate name covered by the wildcard ACM cert (HTTPS:443; ExternalDNS
  creates the Route53 record).

  Rendered only when the cluster has both a real domain and its own TLS.
  Two distinct ways it breaks otherwise:

  1. No host at all (a spoke with no hostname of its own) renders "agents.",
     which is not a valid RFC 1123 host. An empty host on the primary ingress
     above is fine, because Kubernetes treats that as a wildcard.
  2. insecure mode means TLS terminates upstream, so no ACM cert covers a
     sibling host while this Ingress asks for HTTPS:443. With a CloudFront
     hostname it is worse than useless: agentHost is derived from the PARENT
     domain, so "<dist>.cloudfront.net" yields "agents.cloudfront.net", a
     domain we do not own. The load balancer controller then fails the whole
     shared ALB group with "no certificate found for host", which takes the
     primary agentgateway ingress down with it rather than just this one.

  Keyed on `insecure` rather than matching "cloudfront.net" in the hostname,
  so any upstream TLS terminator behaves the same. Matching a provider string
  is what .kiro/steering/platform-portability.md rules out.

  Agents stay reachable without this: the primary ingress serves /sse and
  OAuth discovery on the shared host, path-based, and agentgateway-proxy also
  has its own NLB Service.
*/}}
{{- if and .Values.ingress.host (not $insecure) }}
---
{{- $agentHost := .Values.ingress.agentHost | default (printf "agents.%s" .Values.ingress.host) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentgateway-agents
  namespace: agentgateway-system
  annotations:
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=300
    argocd.argoproj.io/sync-wave: "10"
spec:
  ingressClassName: {{ .Values.ingress.className | default "platform" }}
  rules:
    - host: {{ $agentHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentgateway-ingress
                port:
                  number: 8080
{{- end }}
{{- end }}
