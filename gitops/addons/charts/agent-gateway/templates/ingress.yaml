{{- if .Values.ingress.enabled }}
---
# Separate ClusterIP service for ALB ingress routing.
# The agentgateway-proxy service is a LoadBalancer (NLB) managed by the
# Gateway API controller. This service targets the same pods but allows
# the ALB to create IP-mode target groups without conflict.
apiVersion: v1
kind: Service
metadata:
  name: agentgateway-ingress
  namespace: agentgateway-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agentgateway-proxy
    app.kubernetes.io/instance: agentgateway-proxy
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
---
# Primary ingress: /sse and OAuth discovery on the shared platform hostname.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentgateway
  namespace: agentgateway-system
  annotations:
    alb.ingress.kubernetes.io/target-type: ip
    {{- if contains "cloudfront.net" .Values.ingress.host }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    {{- else }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    {{- end }}
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=300
    argocd.argoproj.io/sync-wave: "10"
spec:
  ingressClassName: {{ .Values.ingress.className | default "platform" }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /sse
            pathType: Prefix
            backend:
              service:
                name: agentgateway-ingress
                port:
                  number: 8080
          - path: /.well-known/oauth-protected-resource
            pathType: Prefix
            backend:
              service:
                name: agentgateway-ingress
                port:
                  number: 8080
---
{{- $agentHost := .Values.ingress.agentHost | default (printf "agents.%s" .Values.ingress.host) }}
# Dedicated agent hostname: routes all paths to agentgateway-proxy.
#
# In real-domain mode this uses a dedicated `agents.<host>` name covered by the
# wildcard ACM cert (HTTPS:443, ExternalDNS creates the Route53 record).
#
# In insecure/CloudFront mode there is no ACM cert and no wildcard DNS, so a
# `agents.<cloudfront-domain>` host has no certificate — which would fail the
# whole shared `platform` ALB group model build ("no certificate found for host")
# and block every other ingress in the group. Match the sibling `agentgateway`
# ingress: listen HTTP:80 with no cert (CloudFront terminates TLS) and drop the
# dedicated host so agent paths are served host-less on the shared CloudFront host.
{{- $insecure := contains "cloudfront.net" .Values.ingress.host }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentgateway-agents
  namespace: agentgateway-system
  annotations:
    alb.ingress.kubernetes.io/target-type: ip
    {{- if $insecure }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    {{- else }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    {{- end }}
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=300
    argocd.argoproj.io/sync-wave: "10"
spec:
  ingressClassName: {{ .Values.ingress.className | default "platform" }}
  rules:
{{- if $insecure }}
    - http:
{{- else }}
    - host: {{ $agentHost }}
      http:
{{- end }}
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentgateway-ingress
                port:
                  number: 8080
{{- end }}
