{{- if .Values.ingress.enabled }}
---
# Separate ClusterIP service for ALB ingress routing.
# The agentgateway-proxy service is a LoadBalancer (NLB) managed by the
# Gateway API controller. This service targets the same pods but allows
# the ALB to create IP-mode target groups without conflict.
apiVersion: v1
kind: Service
metadata:
  name: agentgateway-ingress
  namespace: agentgateway-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agentgateway-proxy
    app.kubernetes.io/instance: agentgateway-proxy
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
---
{{- /* insecure: HTTP-only ingress, no cert (consumer terminates TLS upstream, e.g. CloudFront). Same convention as keycloak/argo-workflows. */}}
{{- $insecure := eq (toString (.Values.global.insecure | default "false")) "true" }}
# Primary ingress: /sse and OAuth discovery on the shared platform hostname.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentgateway
  namespace: agentgateway-system
  annotations:
    alb.ingress.kubernetes.io/target-type: ip
    {{- if $insecure }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    {{- else }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    {{- end }}
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=300
    argocd.argoproj.io/sync-wave: "10"
spec:
  ingressClassName: {{ .Values.ingress.className | default "platform" }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /sse
            pathType: Prefix
            backend:
              service:
                name: agentgateway-ingress
                port:
                  number: 8080
          - path: /.well-known/oauth-protected-resource
            pathType: Prefix
            backend:
              service:
                name: agentgateway-ingress
                port:
                  number: 8080
{{- /*
  Dedicated agent hostname (agents.<host>): routes ALL paths to
  agentgateway-proxy on a separate name covered by the wildcard ACM cert
  (HTTPS:443; ExternalDNS creates the Route53 record).

  Rendered ONLY in real-domain mode. In insecure/CloudFront mode the
  ingress host annotation is empty (or a *.cloudfront.net domain), so
  `printf "agents.%s" .Values.ingress.host` yields the invalid host
  "agents." (RFC 1123 rejects it) and the whole app stays OutOfSync/Missing.
  There is also no ACM cert / wildcard DNS for a cloudfront host. The primary
  `agentgateway` ingress above already serves /sse and OAuth discovery on the
  shared host (path-based, like backstage), so agents remain reachable without
  this second host-based ingress.
*/}}
{{- if and .Values.ingress.host (not (contains "cloudfront.net" .Values.ingress.host)) }}
---
{{- $agentHost := .Values.ingress.agentHost | default (printf "agents.%s" .Values.ingress.host) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentgateway-agents
  namespace: agentgateway-system
  annotations:
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=300
    argocd.argoproj.io/sync-wave: "10"
spec:
  ingressClassName: {{ .Values.ingress.className | default "platform" }}
  rules:
    - host: {{ $agentHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentgateway-ingress
                port:
                  number: 8080
{{- end }}
{{- end }}
