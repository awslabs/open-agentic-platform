{{- if .Values.tokenExchangeSubject.enabled }}
{{- /*
Keeps the caller's token available for the MCP token exchange (mcp-server.cue,
global.agentIdentity.mcpTokenExchange).

The gateway's jwtAuthentication removes the Authorization header once it has validated
it, so an oauthTokenExchange reading the default source finds nothing and Keycloak
answers "invalid request" (verified live). The Enterprise product solves this with
preserveToken; the OSS CRD has no such field.

1. PreRouting copy. The CRD's processing order runs PreRouting before PostRouting, where
   the Gateway's jwtAuthentication lives, so the header still exists here. The copy is
   only USED as the exchange's subject token, after jwt-policy.yaml has validated the
   same value from Authorization.
2. Backend strip. Removes the copy before any request reaches a backend, so no server or
   agent ever receives the raw user token in a second header. Verified live: the copy
   was absent at the MCP server, which received only the exchanged token.

Both target the Gateway. Nothing else in the platform sets backend.transformation, so
the strip does not tie with another policy. If one is ever added at a more specific
level, it replaces this field and the copy would leak through; keep this in mind.
*/ -}}
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: token-exchange-subject-copy
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-proxy
  traffic:
    phase: PreRouting
    transformation:
      request:
        set:
          - name: x-oap-subject-token
            value: 'default(request.headers.authorization, "")'
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: token-exchange-subject-strip
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-proxy
  backend:
    transformation:
      request:
        remove:
          - x-oap-subject-token
{{- end }}
