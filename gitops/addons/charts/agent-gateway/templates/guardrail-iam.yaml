{{/*
  bedrock:ApplyGuardrail for the gateway proxy, through EKS Pod Identity
  (docs/architecture/agent-guardrails.md). Rendered only when guardrails.enabled is "true".
  The proxy calls ApplyGuardrail for the promptGuard of each /llm profile route, so its
  ServiceAccount, not the agent's and not Bifrost's, needs the permission. Same Role plus
  PodIdentityAssociation shape as bifrost/templates/pod-identity.yaml.

  Scope. The guardrail ID is generated by Bedrock when Crossplane creates the Guardrail
  (crossplane-agentcore), so the ARN cannot be written at render time. The policy allows
  guardrail/* in this account and Region, limited by the aws:ResourceTag condition key that
  ApplyGuardrail supports for the guardrail resource type: only guardrails tagged with this
  cluster's name. crossplane-agentcore tags every guardrail it creates that way.
  A cross-Region (STANDARD tier) guardrail also needs ApplyGuardrail on the system guardrail
  profile in each destination Region. A profile is AWS-defined and carries no tags, so it has
  its own statement without the tag condition.
*/}}
{{- if eq (toString .Values.guardrails.enabled) "true" }}
{{- $g := .Values.guardrails }}
{{- $cluster := required "global.clusterName is required when guardrails are enabled" .Values.global.clusterName }}
{{- $region := required "global.awsRegion is required when guardrails are enabled" .Values.global.awsRegion }}
{{- $account := toString (required "global.awsAccountId is required when guardrails are enabled" .Values.global.awsAccountId) }}
{{- $statements := list
      (dict "Sid" "ApplyClusterGuardrails" "Effect" "Allow"
        "Action" (list "bedrock:ApplyGuardrail")
        "Resource" (list (printf "arn:%s:bedrock:%s:%s:guardrail/*" $g.arnPartition $region $account))
        "Condition" (dict "StringEquals" (dict "aws:ResourceTag/platform.gitops.io/cluster" $cluster))) }}
{{- if $g.crossRegion.profileId }}
{{-   $statements = append $statements (dict "Sid" "ApplyGuardrailProfile" "Effect" "Allow"
        "Action" (list "bedrock:ApplyGuardrail")
        "Resource" (list (printf "arn:%s:bedrock:*:%s:guardrail-profile/%s" $g.arnPartition $account $g.crossRegion.profileId))) }}
{{- end }}
{{- $policy := dict "Version" "2012-10-17" "Statement" $statements }}
apiVersion: iam.aws.upbound.io/v1beta1
kind: Role
metadata:
  name: {{ $cluster }}-agentgateway-proxy-guardrail-role
  labels:
    platform.gitops.io/role: agentgateway-proxy-guardrail
    platform.gitops.io/cluster: {{ $cluster }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  forProvider:
    assumeRolePolicy: |
      {
        "Version": "2012-10-17",
        "Statement": [{
          "Effect": "Allow",
          "Principal": {"Service": "pods.eks.amazonaws.com"},
          "Action": ["sts:AssumeRole", "sts:TagSession"]
        }]
      }
    inlinePolicy:
      - name: BedrockApplyGuardrail
        policy: |
          {{- $policy | toPrettyJson | nindent 10 }}
    tags:
      platform.gitops.io/role: agentgateway-proxy-guardrail
      platform.gitops.io/cluster: {{ $cluster }}
  providerConfigRef:
    name: default
---
apiVersion: eks.aws.upbound.io/v1beta1
kind: PodIdentityAssociation
metadata:
  name: {{ $cluster }}-agentgateway-proxy-guardrail
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  forProvider:
    clusterName: {{ $cluster }}
    namespace: {{ $g.proxy.namespace }}
    serviceAccount: {{ $g.proxy.serviceAccountName }}
    roleArnSelector:
      matchLabels:
        platform.gitops.io/role: agentgateway-proxy-guardrail
        platform.gitops.io/cluster: {{ $cluster }}
    region: {{ $region }}
  providerConfigRef:
    name: default
{{- end }}
