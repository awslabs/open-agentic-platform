# Hub (openclaw-eks / control-plane) overlay for the agent-sandbox-lambda chart
# (Flow D — Lambda MicroVM substrate).
#
# DORMANT (microvm.enabled=false) until the self-managed ack-lambdamicrovms
# controller is synced (registered in gitops/addons/registry/sandbox.yaml) and the arm64
# coder artifact is published to S3. Managed KRO + Managed ACK capabilities are
# ACTIVE on the hub. The ARNs below are public identifiers (not secrets).
microvm:
  enabled: true
  region: us-west-2
  # MUST be kro.run — EKS Managed KRO only watches the kro.run group (see chart values.yaml).
  apiGroup: kro.run
  # aws-cli v2 (has the pre-GA lambda-microvms service; alpine/k8s's aws-cli 1.34 does NOT,
  # so RunMicrovm never fired). bridge.sh/reconcile.sh fetch kubectl at start. See chart values.
  bridgeImage: public.ecr.aws/aws-cli/aws-cli:latest
  # accountId is INTENTIONALLY NOT SET HERE. It is injected from this cluster's
  # aws_account_id annotation by the registry entry (gitops/addons/registry/sandbox.yaml),
  # whose valuesObject takes precedence over this overlay anyway. It used to hardcode
  # 940019131157 (the authoring account), which broke the PodIdentityAssociation with
  # "Cross-account pass role is not allowed" on every other account.
  podIdentity:
    clusterName: hub
    controllerNamespace: ack-system
    controllerServiceAccount: ack-lambdamicrovms-controller
  # AWS-published base MicroVM image (ARM_64 — the only arch Lambda MicroVM supports).
  baseImageARN: "arn:aws:lambda:us-west-2:aws:microvm-image:al2023-1"
  # Lambda MicroVM codeArtifact.uri is S3-ONLY (a zip with the coder app + a Dockerfile);
  # it is NOT an ECR image reference. The Dockerfile inside MAY pull the arm64
  # dark-factory-coder from ECR as a base layer (the build role keeps ecr:Get*).
  # The artifact LOCATION is NOT SET HERE and no longer exists as a URI anywhere: the chart
  # holds a bare object key (microvm.codeArtifactKey) and the RGD composes
  #   s3://${bucket.spec.name}/${schema.spec.codeArtifactKey}
  # from the bucket it creates, so bucket and URI cannot drift. This overlay used to pin a
  # full `s3://coder-microvm-artifacts/...` (no account suffix), naming a bucket owned by a
  # DIFFERENT AWS account — S3 bucket names are one global namespace — so CreateBucket got
  # 409 BucketAlreadyExists and the build got "Access denied when fetching artifact from S3"
  # → CREATE_FAILED. Bump codeArtifactKey in the chart values to rebuild the image.
  image:
    enabled: true
    name: coder
  # defaults.* are INTENTIONALLY NOT SET HERE — the chart defaults (1800 / 86400) win, same
  # direction as accountId/codeArtifact above. This overlay pinned 900 / 300, which silently
  # re-broke the two things the chart's microvm.defaults comment documents at length:
  #   • suspendedDurationSeconds: 300 (5 min) — the VM sits SUSPENDED while the external
  #     review agents run (~8-15 min) and then waits for a human to post "fix findings"
  #     (minutes to hours). A 5-minute auto-terminate deadline therefore ALWAYS fired first,
  #     so the fix round's RESUME hit "has been terminated and its state cannot be changed"
  #     and same-VM warm resume — the entire Flow D value prop — was impossible.
  #   • maxIdleDurationSeconds: 900 — "idle" means no INBOUND traffic, and the bridge POSTs
  #     /run once and then deliberately never touches the endpoint again (any request
  #     auto-resumes the VM — SUBSTRATE-BENCHMARK.md pitfall 9). So the idle timer runs for
  #     the WHOLE coder run: 900s caps a run at 15 min instead of the chart's 30 min and
  #     suspends the coder mid-work on a longer issue. Both values are only backstops — the
  #     bridge suspends explicitly and df-merge-teardown terminates explicitly.
  lifecycle:
    intervalSeconds: 15
  warmPool:
    name: coder-warmpool-microvm
    targetIdle: 1
