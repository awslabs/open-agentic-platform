# oap-prod overrides for the agent-evaluation addon.
#
# Identical to the oap-dev file, for the same reason: the chart default image,
# public.ecr.aws/z0a4o2j5/agent-evaluation, does not exist -- that repository
# answers NAME_UNKNOWN and the tag 404s -- so a cluster taking the chart default
# sits in ImagePullBackOff. See gitops/overlays/clusters/hub/agent-evaluation/
# values.yaml for the full rationale, including why this is a per-cluster file
# rather than a templated registry value.
#
# TEMPORARY. Delete this file (and the hub and oap-dev equivalents) once
# public.ecr.aws/z0a4o2j5/agent-evaluation exists -- "Ask 2" on #104.
image:
  # The account that builds the pre-publication images. Same registry as the hub
  # and oap-dev: one account builds, all three clusters in this fleet pull from
  # it. A fleet spanning accounts would need the image replicated per account.
  repository: 940019131157.dkr.ecr.us-west-2.amazonaws.com/agent-evaluation
  # Must match the chart's appVersion / pyproject.toml / build.sh VERSION.
  tag: "0.2.4"
