# oap-dev overrides for the agent-evaluation addon.
#
# Same reason as gitops/overlays/clusters/hub/agent-evaluation/values.yaml, and
# the same lifetime: the chart default image,
# public.ecr.aws/z0a4o2j5/agent-evaluation, does not exist -- that repository
# answers NAME_UNKNOWN and the tag 404s -- so a cluster that takes the chart
# default sits in ImagePullBackOff. Until that image is published, every cluster
# running this addon needs an override pointing at a registry that does have it.
#
# WHY A PER-CLUSTER FILE AND NOT THE REGISTRY ENTRY. The registry's
# valuesObject is templated and could build this repository URL from the
# cluster secret's aws_account_id/aws_region annotations, which would cover all
# clusters at once and keep the account id out of git. That is deliberately NOT
# done: the hub override file states that a private, single-account registry
# "must not become the chart default", and the registry entry is the chart
# default for every consumer of this repo. Keeping it per-cluster means a fork
# deploying into another account is unaffected by our pre-publication registry.
#
# TEMPORARY. Delete this file (and the hub and oap-prod equivalents) once
# public.ecr.aws/z0a4o2j5/agent-evaluation exists -- "Ask 2" on #104. The chart
# default is then correct everywhere and no cluster needs an override.
image:
  # The account that builds the pre-publication images. An AWS account id is not
  # a secret, but this is a registry only this account can pull from, which is
  # exactly why it stays here rather than in the chart -- see the hub file.
  repository: 940019131157.dkr.ecr.us-west-2.amazonaws.com/agent-evaluation
  # Must match the chart's appVersion / pyproject.toml / build.sh VERSION.
  # Pinned here as well as in the hub file so a reader of this one file can see
  # exactly what this spoke runs without cross-referencing.
  tag: "0.2.4"
