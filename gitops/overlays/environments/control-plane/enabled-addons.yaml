# Enabled addons for the hub (control-plane) cluster.
# Keys use underscores matching the enable_<addon> label convention.
# All values are boolean. Every known addon is listed explicitly.
#
# This file is the single source of truth for hub addon enablement.
# It includes both base platform addons (from appmod-blueprints) and
# agentic platform addons.
enabledAddons:
  # Core
  argocd: false
  metrics_server: true
  ingress_class_alb: true
  aws_load_balancer_controller: true
  default_storage_class: true
  cert_manager: true
  external_secrets: true
  external_dns: true
  aws_efs_csi_driver: false
  image_prepuller: false
  # GitOps
  argo_events: true      # Dark Factory (Flow B) trigger: GitHub-webhook EventSource + Sensor → df-run
  argo_rollouts: true
  argo_workflows: true
  kargo: false
  flux: false
  # Security
  keycloak: true
  kyverno: false
  kyverno_policies: false
  kyverno_policy_reporter: false
  # Observability
  grafana: false
  grafana_operator: true
  grafana_dashboards: true
  kube_state_metrics: true
  prometheus_node_exporter: true
  opentelemetry_operator: false
  cw_prometheus: false
  aws_for_fluentbit: false
  cni_metrics_helper: false
  # Platform
  crossplane: true
  kro: false
  kro_manifests: false
  kro_manifests_hub: false
  multi_acct: false
  platform_manifests_bootstrap: true   # wave -1: creates the system-<prefix> Karpenter NodePool that system pods pin to
  platform_manifests: false            # wave 6: Ray-only IAMRoleSelector — inert here (Ray disabled)
  backstage: false
  kubevela: true
  devlake: false
  gitlab: false
  # Self-managed Karpenter + the Kata node layer, running ALONGSIDE EKS Auto Mode.
  #
  # STEP 1 of moving the sandbox onto the hub. The Dark Factory orchestrator runs
  # here (argo + argo-events), and its claim step creates a SandboxClaim with no
  # cross-cluster mechanism — so the warm pool has to live on the same cluster.
  # That requires kata-capable nodes, which Auto Mode's Bottlerocket nodes are not.
  #
  #   karpenter      controller + Crossplane IAM (platform addon). Coexists with
  #                  Auto Mode by nodeClassRef.group partition: Auto Mode owns
  #                  eks.amazonaws.com, self-managed owns karpenter.k8s.aws.
  #   kata_nodepool  the consuming layer (EC2NodeClass + NodePool). Subnets, cluster
  #                  SG and node role are discovered from cluster tags — verified
  #                  present on hub — so no infra is created out-of-band.
  #
  # A self-managed node also needs the vpc-cni + kube-proxy EKS addons (Auto Mode's
  # built-in networking covers only its OWN nodes). Hub is a pure Auto Mode cluster
  # with no existing owner for those addons, so node.manageAddons is turned on in
  # gitops/overlays/clusters/hub/karpenter/values.yaml — which reaches the
  # platform-owned karpenter chart via the external-overlay-repo ("layer 5")
  # wiring in gitops/fleet/hub/values.yaml.
  #
  # Step 1 gate VERIFIED live on hub before step 2 was enabled below:
  #   hub-karpenter-vpc-cni / -kube-proxy Addon MRs  SYNCED=True READY=True
  #   hub live EKS addons                            vpc-cni, kube-proxy present
  #   ec2nodeclass/kata-nested, nodepool/kata-nested READY=True, 0 nodes
  # 0 nodes is correct: Karpenter is demand-driven, so the pool stays empty until
  # a pending pod matches the kata taint + label. The warm pool below IS that
  # demand — which is why "wait for a kata node" could never have been the gate.
  karpenter: true
  kata_nodepool: true
  # ACK controllers
  ack_iam: false
  ack_eks: false
  ack_ec2: false
  ack_ecr: false
  ack_s3: false
  ack_dynamodb: false
  ack_efs: false
  # ML/AI
  jupyterhub: false
  kubeflow: false
  mlflow: false
  ray_operator: false
  spark_operator: false
  airflow: false
  # AWS Resources (Crossplane-managed VPC secrets etc.)
  aws_resources: true
  # Observability AWS (AMP + AMG via Crossplane)
  observability_aws: true
  # Agentic Platform
  agent_platform: true
  bifrost: true
  langfuse: true
  otel_collector: true
  monitoring: true
  agent_core: true
  agent_gateway: true
  oam_components: true
  # Agent Sandbox capability — Kata micro-VM sandboxes + warm pool (STEP 2 of the
  # move off the spoke; disabled on the dev overlay in the same change).
  #
  # It lives HERE because the Dark Factory orchestrator runs here: df-run's claim
  # step creates a SandboxClaim with no cross-cluster mechanism (no --context, no
  # remote kubeconfig), and hub had no sandbox CRDs at all — so with the pool on
  # the spoke, Flow B could not complete. Co-locating removes the problem rather
  # than bridging it.
  #
  # enable_agent_sandbox gates BOTH the upstream operator (which installs the
  # sandbox CRDs) and the capability chart (RuntimeClasses, SandboxTemplate, warm
  # pool). coderTemplate.image is supplied by the agent-sandbox registry entry
  # (gitops/addons/registry/sandbox.yaml), which templates the ECR registry from
  # this cluster's aws_account_id + aws_region annotations — so NO per-cluster
  # overlay is needed. The image itself still has to be built into that account's
  # ECR at the pinned tag, or the warm pods report ImagePullBackOff.
  agent_sandbox: true
  # kata-deploy installs the clh/qemu runtime onto the kata nodes (separate app).
  # Required, or the warm pool's runtimeClassName has no handler on the node.
  agent_sandbox_kata: true
