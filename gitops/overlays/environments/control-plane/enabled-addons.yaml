# Enabled addons for the hub (control-plane) cluster.
# Keys use underscores matching the enable_<addon> label convention.
# All values are boolean. Every known addon is listed explicitly.
#
# This file is the single source of truth for hub addon enablement.
# It includes both base platform addons (from appmod-blueprints) and
# agentic platform addons.
enabledAddons:
  # Core
  argocd: false
  metrics_server: true
  ingress_class_alb: true
  aws_load_balancer_controller: true
  default_storage_class: true
  cert_manager: true
  external_secrets: true
  external_dns: true
  aws_efs_csi_driver: false
  image_prepuller: false
  # GitOps
  argo_events: true      # Dark Factory (Flow B) trigger: GitHub-webhook EventSource + Sensor → df-run
  argo_rollouts: true
  argo_workflows: true
  kargo: true
  flux: false
  # Security
  keycloak: true
  kyverno: false
  kyverno_policies: false
  kyverno_policy_reporter: false
  # Observability
  grafana: false
  grafana_operator: true
  grafana_dashboards: true
  kube_state_metrics: true
  prometheus_node_exporter: true
  opentelemetry_operator: false
  cw_prometheus: false
  aws_for_fluentbit: false
  cni_metrics_helper: false
  # Platform
  crossplane: true
  # KRO CONTROLLER: leave false. On this platform KRO is an EKS managed Capability
  # (aws eks list-capabilities shows capabilityName kro, type KRO, ACTIVE), so its
  # controller runs AWS-side and is deliberately NOT visible as pods in the cluster,
  # exactly like the managed ArgoCD capability. Setting kro: true makes ArgoCD Helm
  # install a SECOND controller from registry.k8s.io (registry defaultVersion 0.6.1)
  # alongside the capability's newer build, and the two then fight over CRD ownership:
  # RGDs go Inactive with "conflict detected: CRD <x>.kro.run has ownership by another
  # ResourceGraphDefinition". Do not infer KRO is missing from an empty kro-system.
  kro: false
  kro_manifests: false
  # RGDs are NOT part of the capability and must still be applied. Without them the
  # clusters-kro ApplicationSet creates an EksclusterWithVpc instance that is accepted
  # and then never reconciled, with empty STATE/READY. Use the _hub variant: it applies
  # the manifests tree recursively, whereas kro_manifests excludes cicd-pipeline,
  # huggingface and ray-service and is the spoke variant per the platform's registry.
  kro_manifests_hub: true
  # ACK role selection. Badly named: this addon owns IAMRoleSelector (ACK CARM), which
  # maps a NAMESPACE to the IAM role ACK assumes for resources in it. It is required
  # even in a single account, because ACK cannot reconcile resources in a namespace no
  # selector covers.
  #
  # Needed once this hub provisions spokes. peeks-hub-ack-capability-role has no
  # managed policies and cannot create EC2 resources; it only holds sts:AssumeRole on
  # <resourcePrefix>-cluster-mgmt-*, and those roles carry the real permissions
  # (AmazonEC2FullAccess / AmazonVPCFullAccess). With no selector for the spoke
  # namespace ACK falls back to the capability role and the spoke VPC fails with
  #   UnauthorizedOperation: ... not authorized to perform: ec2:CreateVpc
  # The namespace-to-account map is gitops/configs/multi-acct/values.yaml. The chart
  # self-covers the cluster it runs on, so the hub itself needs no entry.
  multi_acct: true
  platform_manifests_bootstrap: true   # wave -1: creates the system-<prefix> Karpenter NodePool that system pods pin to
  platform_manifests: false            # wave 6: Ray-only IAMRoleSelector — inert here (Ray disabled)
  backstage: true
  kubevela: true
  devlake: false
  gitlab: false
  # Self-managed Karpenter + the Kata node layer, running ALONGSIDE EKS Auto Mode.
  #
  # STEP 1 of moving the sandbox onto the hub. The Dark Factory orchestrator runs
  # here (argo + argo-events), and its claim step creates a SandboxClaim with no
  # cross-cluster mechanism — so the warm pool has to live on the same cluster.
  # That requires kata-capable nodes, which Auto Mode's Bottlerocket nodes are not.
  #
  #   karpenter      controller + Crossplane IAM (platform addon). Coexists with
  #                  Auto Mode by nodeClassRef.group partition: Auto Mode owns
  #                  eks.amazonaws.com, self-managed owns karpenter.k8s.aws.
  #   kata_nodepool  the consuming layer (EC2NodeClass + NodePool). Subnets, cluster
  #                  SG and node role are discovered from cluster tags — verified
  #                  present on hub — so no infra is created out-of-band.
  #
  # A self-managed node also needs the vpc-cni + kube-proxy EKS addons (Auto Mode's
  # built-in networking covers only its OWN nodes). Hub is a pure Auto Mode cluster
  # with no existing owner for those addons, so node.manageAddons is turned on in
  # gitops/overlays/clusters/hub/karpenter/values.yaml — which reaches the
  # platform-owned karpenter chart via the external-overlay-repo ("layer 5")
  # wiring in gitops/fleet/hub/values.yaml.
  #
  # Step 1 gate VERIFIED live on hub before step 2 was enabled below:
  #   hub-karpenter-vpc-cni / -kube-proxy Addon MRs  SYNCED=True READY=True
  #   hub live EKS addons                            vpc-cni, kube-proxy present
  #   ec2nodeclass/kata-nested, nodepool/kata-nested READY=True, 0 nodes
  # 0 nodes is correct: Karpenter is demand-driven, so the pool stays empty until
  # a pending pod matches the kata taint + label. The warm pool below IS that
  # demand — which is why "wait for a kata node" could never have been the gate.
  karpenter: true
  # OFF BY DEFAULT (explicit opt-in). Provisions a dedicated Karpenter NodePool +
  # EC2NodeClass (kata-nested) for nested-virt kata nodes. The selector
  # (enable_kata_nodepool) already existed, but committing `true` here meant a fresh
  # install provisioned the pool regardless — real EC2 capacity for a capability the
  # cluster may not want. Karpenter is demand-driven so an unused pool holds 0 nodes,
  # but the CRs are still created and reconciled. Set true together with
  # agent_sandbox + agent_sandbox_kata below.
  kata_nodepool: false
  # ACK controllers
  ack_iam: false
  ack_eks: false
  ack_ec2: false
  ack_ecr: false
  ack_s3: false
  ack_dynamodb: false
  ack_efs: false
  # ML/AI
  jupyterhub: false
  kubeflow: false
  mlflow: false
  ray_operator: false
  spark_operator: false
  airflow: false
  # AWS Resources (Crossplane-managed VPC secrets etc.)
  aws_resources: true
  # Observability AWS (AMP + AMG via Crossplane)
  observability_aws: true
  # Agentic Platform
  agent_platform: true
  bifrost: true
  langfuse: true
  otel_collector: true
  monitoring: true
  # Continuous agent evaluation (docs/architecture/agent-evaluation.md).
  # The hub instance reconciles its OWN agents' rules like any other cluster, and
  # additionally owns the project-wide Langfuse objects (the catalog evaluators
  # and the judge LLM connection) because every cluster shares one project. The
  # registry entry derives role=hub from this cluster having an
  # ingress_domain_name, so no flag here chooses the role.
  #
  # OFF, BECAUSE THE IMAGE IS NOT IN A PUBLIC REGISTRY.
  #
  # The chart's default, public.ecr.aws/z0a4o2j5/agent-evaluation, does not
  # exist: that repository answers NAME_UNKNOWN and the tag 404s. The registry
  # entry (gitops/addons/registry/observability.yaml) therefore points the addon
  # at <aws_account_id>.dkr.ecr.<aws_region>.amazonaws.com/agent-evaluation,
  # templated from the cluster secret -- which resolves to the DEPLOYING
  # account, and that account only has the image if someone there has run
  # applications/agent-evaluation/build.sh --push.
  #
  # So `true` here cannot be a default: on any install whose account has no
  # agent-evaluation repository, every hub and spoke reconciler sits in
  # ImagePullBackOff. A stuck addon, not a degraded one, and a clean install
  # must not require building an image first.
  #
  # TO TURN IT ON FOR YOUR OWN FLEET: build and push the image (multi-arch is
  # required -- OAP fleets mix arm64 and amd64, and a single-arch image
  # ImagePulls on half the nodes), then set this true in your own overlay rather
  # than here. Verified working that way: 8 invocations produced 8 judge scores
  # in Langfuse and oap_agent_eval_* series in AMP.
  #
  # FLIP THE DEFAULT only once the image is in a public registry (a consolidated
  # public ECR for OAP images is planned). Move the flag and the image pointer in
  # the same change -- see that registry entry for the tag lockstep rule.
  # TEST ONLY - never merge: on for the hub so the harness can be exercised.
  agent_evaluation: true
  # Agent harness (applications/agent-evaluation/agent-harness.md section 4.1):
  # the one switch for both agent-evaluation harness.enabled and
  # oam-agent-components global.agentEvaluation.harnessEnabled, read from the
  # enable_agent_harness label by both registry entries. Does nothing unless
  # agent_evaluation is also true here, and needs the 0.3.0 image.
  # TEST ONLY - never merge: the single harness switch under live test (P3).
  agent_harness: true
  agent_core: true
  agent_gateway: true
  oam_components: true
  # Agent Sandbox capability — Kata micro-VM sandboxes + warm pool (STEP 2 of the
  # move off the spoke; disabled on the dev overlay in the same change).
  #
  # It lives HERE because the Dark Factory orchestrator runs here: df-run's claim
  # step creates a SandboxClaim with no cross-cluster mechanism (no --context, no
  # remote kubeconfig), and hub had no sandbox CRDs at all — so with the pool on
  # the spoke, Flow B could not complete. Co-locating removes the problem rather
  # than bridging it.
  #
  # enable_agent_sandbox gates BOTH the upstream operator (which installs the
  # sandbox CRDs) and the capability chart (RuntimeClasses, SandboxTemplate, warm
  # pool). coderTemplate.image is supplied by the agent-sandbox registry entry
  # (gitops/addons/registry/sandbox.yaml), which templates the ECR registry from
  # this cluster's aws_account_id + aws_region annotations — so NO per-cluster
  # overlay is needed. The image itself still has to be built into that account's
  # ECR at the pinned tag, or the warm pods report ImagePullBackOff.
  # OFF BY DEFAULT (explicit opt-in) — see kata_nodepool above. This one label gates
  # BOTH the operator (sandbox CRDs) and the capability chart (RuntimeClasses,
  # SandboxTemplate, warm pool). The warm pool is the demand that makes the kata
  # NodePool scale up, so enabling this without kata_nodepool leaves warm pods
  # Pending, and enabling kata_nodepool without this leaves the pool idle at 0.
  # REQUIRED BY dark_factory TOO, not just Flow A/B: this gates the operator, which
  # is the ONLY source of the Sandbox* CRDs, and the agent-sandbox-lambda chart
  # renders a SandboxTemplate + SandboxWarmPool. Neither CR carries
  # SkipDryRunOnMissingResource, and ArgoCD diffs a whole app before applying any
  # wave, so with the CRDs absent that Application fails at COMPARISON and does not
  # self-heal. So: dark_factory: true REQUIRES agent_sandbox: true. The Kata flags
  # (agent_sandbox_kata, kata_nodepool) stay optional — they matter only for the
  # Kata path, whose warm pool df-run claims from.
  #
  # ON, and the prerequisites that used to make this risky are gone. It defaults
  # to NITRO now (gitops/addons/charts/agent-sandbox/values.yaml), which needs no
  # node layer of ours: on EKS Auto Mode with k8s 1.36+ the RuntimeClass is
  # AWS-owned and a sandbox-capable node is provisioned on demand -- verified
  # live on a 1.37 Auto Mode cluster. So kata_nodepool and agent_sandbox_kata
  # stay FALSE above and nothing goes Pending for want of a kata node.
  #
  # This is the only source of the Sandbox* CRDs, which `type: sandbox` needs.
  #
  # FALSE HERE, AND TURNED ON PER HUB. This file is shared by EVERY
  # control-plane cluster, so `true` here enabled the addon on every hub
  # including other people's -- and on a hub below Kubernetes 1.36, or outside a
  # US commercial region, Nitro cannot run at all. The switch is
  # `sandbox.enabled` in config.yaml, which puts enable_agent_sandbox on that
  # one hub's cluster secret.
  #
  # Nothing else needs to be turned off alongside it any more: the warm pool is
  # OFF in the chart default and enabled only where dark_factory is, so enabling
  # this addon now installs the CRDs and nothing that schedules a pod.
  agent_sandbox: false
  # kata-deploy installs the clh/qemu runtime onto the kata nodes (separate app).
  # Required, or the warm pool's runtimeClassName has no handler on the node.
  agent_sandbox_kata: false
  # Dark Factory / Flow D — OFF BY DEFAULT (explicit opt-in). This ONE label gates
  # the pipeline chart, the Lambda MicroVM substrate (agent-sandbox-lambda) and the
  # pre-GA lambdamicrovms ACK controller — see gitops/addons/registry/sandbox.yaml.
  # Set true only on a cluster that has a real GitHub repo wired into
  # trigger.argoEvents.repositories; the shipped default is
  # replace-me-owner/replace-me-repo, which makes the EventSource poll a repo that
  # cannot exist and the sensor fail continuously.
  dark_factory: false
