# Enabled addons for the prod environment (spoke clusters).
enabledAddons:
  # Core
  metrics_server: true
  ingress_class_alb: true
  aws_load_balancer_controller: true
  default_storage_class: true
  external_secrets: true
  external_dns: true
  cert_manager: true
  # Security
  kyverno: true
  kyverno_policies: true
  # Observability
  kube_state_metrics: true
  prometheus_node_exporter: true
  aws_for_fluentbit: true
  # Platform
  platform_manifests_bootstrap: true   # wave -1: creates the system-<prefix> Karpenter NodePool that system pods pin to
  crossplane: true
  crossplane_aws: true
  kubevela: true
  argo_rollouts: true
  # Agentic Platform
  agent_platform: true
  bifrost: true
  otel_collector: true
  monitoring: true
  # Continuous agent evaluation (docs/architecture/agent-evaluation.md).
  # role=spoke, derived by the registry entry from this cluster having no
  # ingress_domain_name. prod's rules are named for prod and only prod's
  # reconciler can delete them, so a dev rollout cannot disturb prod scoring.
  #
  # OFF UNTIL THE IMAGE IS PUBLISHED -- public.ecr.aws/z0a4o2j5/agent-evaluation
  # does not exist in the public registry yet (the repository answers
  # NAME_UNKNOWN), so enabling it here is an ImagePullBackOff on sync rather
  # than a working addon. See the control-plane overlay for the full note.
  # Flip to true in the same change that points image.tag at the published tag,
  # and prefer letting dev run on it for a while first.
  agent_evaluation: false
  agent_core: true
  agent_gateway: true
  oam_components: true
  # Agent Sandbox capability — DISABLED for now (same reason as dev): EKS Auto
  # Mode + Bottlerocket cannot host Kata. Re-enable once Auto Mode integration
  # is designed. When on, prod holds the capability but the pool stays dormant
  # (the Dark Factory only runs on spoke-dev — production-safety).
  # agent_sandbox: true
