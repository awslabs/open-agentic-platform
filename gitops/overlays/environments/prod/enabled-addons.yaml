# Enabled addons for the prod environment (spoke clusters).
enabledAddons:
  # Core
  metrics_server: true
  ingress_class_alb: true
  aws_load_balancer_controller: true
  default_storage_class: true
  external_secrets: true
  external_dns: true
  cert_manager: true
  # Security
  kyverno: true
  kyverno_policies: true
  # Observability
  kube_state_metrics: true
  prometheus_node_exporter: true
  aws_for_fluentbit: true
  # Platform
  platform_manifests_bootstrap: true   # wave -1: creates the system-<prefix> Karpenter NodePool that system pods pin to
  crossplane: true
  crossplane_aws: true
  kubevela: true
  argo_rollouts: true
  # Agentic Platform
  agent_platform: true
  bifrost: true
  otel_collector: true
  monitoring: true
  # Continuous agent evaluation (docs/architecture/agent-evaluation.md).
  # role=spoke, derived by the registry entry from this cluster having no
  # ingress_domain_name. prod's rules are named for prod and only prod's
  # reconciler can delete them, so a dev rollout cannot disturb prod scoring.
  #
  # OFF. The image is not in a public registry, so this cannot be a default --
  # see the control-plane overlay for the full note, and the dev overlay for the
  # spoke-specific requirement that the hub ALB allow each spoke's NAT address.
  #
  # WHEN YOU DO TURN IT ON, prefer letting dev run on it first. This reconciler
  # writes Langfuse evaluation rules into a project shared by the whole fleet, so
  # a bad rule set is shared state rather than something scoped to one cluster.
  # role=spoke keeps prod out of the project-wide objects (only the hub writes
  # the catalog evaluators and the judge connection), but prod's own rules are
  # still live rules in that shared project.
  agent_evaluation: false
  # Agent harness (applications/agent-evaluation/agent-harness.md section 4.1):
  # the one switch for both agent-evaluation harness.enabled and
  # oam-agent-components global.agentEvaluation.harnessEnabled, read from the
  # enable_agent_harness label by both registry entries. Does nothing unless
  # agent_evaluation is also true here, and needs the 0.3.0 image.
  agent_harness: false
  # Agent guardrails (docs/architecture/agent-guardrails.md): the one switch for
  # agent-gateway guardrails.enabled, crossplane-agentcore guardrails.enabled and
  # oam-agent-components global.guardrails.enabled, read from the
  # enable_agent_guardrails label by all three registry entries. Does nothing
  # unless agent_gateway and agent_core are also true here. Off by default.
  agent_guardrails: false
  agent_core: true
  agent_gateway: true
  oam_components: true
  # Agent Sandbox capability — ON, for the CRDs only.
  #
  # The old reason to keep it off (EKS Auto Mode + Bottlerocket cannot host
  # Kata) no longer applies: Nitro Sandboxes need no node layer of ours, and the
  # Dark Factory warm pool -- the thing that actually wanted Kata nodes -- is off
  # in the chart default and enabled only where dark_factory is. So this installs
  # the operator and the Sandbox* CRDs and nothing that schedules a pod. The
  # Dark Factory still runs only on spoke-dev.
  #
  # Required because oam-agent-components ships the `sandbox` ComponentDefinition
  # to every cluster while the CRDs come only from here: without it a
  # `type: sandbox` Application on this cluster is rejected at admission.
  #
  # Nitro itself needs Kubernetes 1.36+ in a US commercial region. A prod spoke
  # that does not meet that still gets the CRDs and the component, and a
  # sandboxed pod there stays Pending -- visible as a not-Ready Rollout, never
  # fake-green. Annotate such a cluster onto Kata, or onto `none` to reject
  # sandbox: true outright.
  agent_sandbox: true
