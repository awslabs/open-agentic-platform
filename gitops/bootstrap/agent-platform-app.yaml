apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agent-platform-addons
  namespace: argocd
spec:
  project: default
  sources:
    # Source A — THIS repo (the addon repo): provides the registry value files
    # (referenced below via $values) plus the charts/, configs/ and overlays/ that
    # ArgoCD resolves at sync time from the paths inside those registry entries.
    - ref: values
      repoURL: "${REPO_URL}"
      targetRevision: "${REVISION}"
    # Source B — the PLATFORM repo (appmod-blueprints): the generator chart itself.
    # Reference model — the appset-chart is NOT vendored into this repo; it is
    # pulled from the platform repo at a pinned revision. Other addon repos reuse
    # this exact pattern by pointing source B at the same chart and supplying their
    # own registry files as $values.
    - repoURL: "${PLATFORM_REPO_URL}"
      path: "platform-charts/appset-chart"
      targetRevision: "${PLATFORM_REPO_REVISION}"
      helm:
        releaseName: agent-platform-addons
        ignoreMissingValueFiles: true
        # Layered low→high precedence. _defaults.yaml supplies syncPolicy,
        # useSelectors:true, repoURLGitBasePath (gitops/addons/configs) and
        # overlayBasePath; the domain files supply the addon entries. valuesObject
        # (highest) is reserved for env-injected repo coordinates ONLY — it must
        # not re-set repoURLGitBasePath/useSelectors or it would clobber _defaults.
        valueFiles:
          - "$values/${BASEPATH}registry/_defaults.yaml"
          - "$values/${BASEPATH}registry/gateway.yaml"
          - "$values/${BASEPATH}registry/observability.yaml"
          - "$values/${BASEPATH}registry/agentcore.yaml"
          - "$values/${BASEPATH}registry/sandbox.yaml"
        valuesObject:
          # Umbrella gate: whole agentic bundle is off unless the cluster carries
          # enable_agent_platform. Per-addon enable_<addon> selectors (useSelectors
          # from _defaults) gate placement within the bundle.
          globalSelectors:
            enable_agent_platform: "true"
          repoURLGit: "${REPO_URL}"
          repoURLGitRevision: "${REVISION}"
          # In-cluster overlay layer (Option A). The appset-chart already renders a
          # second `$overlay` source and appends its value files at highest precedence
          # (with ignoreMissingValueFiles: true, so absent overlay files are a no-op),
          # exactly as the platform `cluster-addons` bootstrap does. Supplying these
          # coordinates lets operators override any OAP addon value (image mirror,
          # endpoints, hosts, secret-manager keys) from an in-cluster GitOps repo
          # WITHOUT committing to this addon repo. Leave empty to disable the overlay.
          #   $overlay/configs/<addon>/values.yaml
          #   $overlay/overlays/environments/<env>/<addon>/values.yaml
          #   $overlay/overlays/clusters/<cluster>/<addon>/values.yaml
          overlayRepoURLGit: "${OVERLAY_REPO_URL}"
          overlayRepoURLGitRevision: "${OVERLAY_REVISION}"
          overlayRepoURLGitBasePath: "${OVERLAY_BASEPATH}"
  destination:
    namespace: argocd
    name: ${HUB_CLUSTER_NAME}
  syncPolicy:
    automated:
      selfHeal: true
      allowEmpty: true
      prune: true
    retry:
      limit: 100
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
