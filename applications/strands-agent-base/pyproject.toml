[project]
name = "strands-agent-a2a"
version = "1.0.0"
description = "Strands Agent with A2A protocol support"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "starlette==1.7.0",
    "uvicorn[standard]==0.53.0",
    "pydantic==2.13.5",
    "strands-agents[a2a,openai,otel]==1.57.0",
    "bedrock-agentcore==1.23.1",
    "aws-opentelemetry-distro==0.20.0",
    "tenacity==9.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.1",
    "pytest-asyncio~=1.4",
    # Must track strands-agents[a2a], which requires httpx>=0.28.1; pinning
    # ~=0.27.0 here made the dev extra unresolvable.
    "httpx~=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]

[dependency-groups]
dev = [
    "pytest~=9.1",
    "pytest-asyncio~=1.4",
    "httpx~=0.28.1",
]
