[project]
name = "strands-agent-a2a"
version = "1.0.0"
description = "Strands Agent with A2A protocol support"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.139.2",
    "starlette==1.3.1",
    "uvicorn[standard]==0.51.0",
    "pydantic==2.13.4",
    "strands-agents[a2a,openai,otel]==1.48.0",
    "bedrock-agentcore==1.18.1",
    "aws-opentelemetry-distro==0.18.0",
    "tenacity==9.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.0",
    "pytest-asyncio~=0.23.0",
    "httpx~=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]

[dependency-groups]
dev = [
    "pytest~=8.0",
    "pytest-asyncio~=0.23.0",
    "httpx~=0.27.0",
]
