version: '3'

vars:
  CONFIG_FILE: '{{.CONFIG_FILE | default "config.local.yaml"}}'
  PLATFORM_DIR: '.platform'

  # Parsed from config
  PLATFORM_REPO:
    sh: yq -r '.platform.repo' {{.CONFIG_FILE}}
  PLATFORM_REF:
    sh: yq -r '.platform.ref' {{.CONFIG_FILE}}
  CLUSTER_PROVIDER:
    sh: yq -r '.platform.clusterProvider' {{.CONFIG_FILE}}
  AWS_REGION:
    sh: yq -r '.aws.region' {{.CONFIG_FILE}}
  AWS_ACCOUNT_ID:
    sh: yq -r '.aws.accountId' {{.CONFIG_FILE}}
  AWS_PROFILE:
    sh: yq -r '.aws.profile // "default"' {{.CONFIG_FILE}}
  # On EC2 the profile name (e.g. "default") has no entry in ~/.aws/config, so the
  # --profile flags below and the kubectl exec plugin (aws eks get-token) would
  # dead-end. Generate a config whose profile resolves to the instance role via
  # the credential provider chain (IMDS) and return its path. Off-instance, fall
  # back to the user's existing AWS_CONFIG_FILE or ~/.aws/config (zero regression).
  AWS_CONFIG_FILE:
    sh: |
      if curl -s -m 2 -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 60" >/dev/null 2>&1; then
        mkdir -p "{{.ROOT_DIR}}/.platform/private"
        printf '[default]\ncredential_source = Ec2InstanceMetadata\n' > "{{.ROOT_DIR}}/.platform/private/aws-config"
        echo "{{.ROOT_DIR}}/.platform/private/aws-config"
      else
        echo "${AWS_CONFIG_FILE:-$HOME/.aws/config}"
      fi
  HUB_CLUSTER_NAME:
    sh: yq -r '.hub.clusterName' {{.CONFIG_FILE}}
  DOMAIN:
    sh: yq -r '.domain' {{.CONFIG_FILE}}
  # Passed straight through to the platform, which treats it as: the consumer
  # terminates TLS upstream, so serve plain HTTP at the load balancer. Whatever sets
  # this owns the upstream TLS. See workshop/ for the CloudFront case.
  INSECURE:
    sh: yq -r '.insecure // false' {{.CONFIG_FILE}}
  RESOURCE_PREFIX:
    sh: yq -r '.resourcePrefix' {{.CONFIG_FILE}}
  INGRESS_NAME:
    sh: yq -r '.ingressName // ""' {{.CONFIG_FILE}}
  IDC_INSTANCE_ARN:
    sh: yq -r '.identityCenter.instanceArn' {{.CONFIG_FILE}}
  IDC_REGION:
    sh: yq -r '.identityCenter.region' {{.CONFIG_FILE}}
  IDC_ADMIN_GROUP_ID:
    sh: yq -r '.identityCenter.adminGroupId' {{.CONFIG_FILE}}
  K8S_VERSION:
    sh: yq -r '.hub.kubernetesVersion // "1.35"' {{.CONFIG_FILE}}
  AGENTIC_REPO_URL:
    sh: yq -r '.agenticRepo.url' {{.CONFIG_FILE}}
  AGENTIC_REPO_REVISION:
    sh: yq -r '.agenticRepo.revision' {{.CONFIG_FILE}}
  AGENTIC_REPO_BASEPATH:
    sh: yq -r '.agenticRepo.basepath' {{.CONFIG_FILE}}
  # Optional in-cluster overlay (Option A). Empty by default → overlay disabled.
  # Point at an in-cluster GitOps repo (e.g. the platform fleet-config) to override
  # OAP addon values without committing to the addon repo.
  OVERLAY_REPO_URL:
    sh: yq -r '.agenticRepo.overlayUrl // ""' {{.CONFIG_FILE}}
  OVERLAY_REPO_REVISION:
    sh: yq -r '.agenticRepo.overlayRevision // "main"' {{.CONFIG_FILE}}
  OVERLAY_REPO_BASEPATH:
    sh: yq -r '.agenticRepo.overlayBasepath // ""' {{.CONFIG_FILE}}

# Exported to every task's command environment. AWS_CONFIG_FILE must be a real
# env var (not just a template var) so the aws CLI and the kubectl exec plugin
# (aws eks get-token) resolve --profile against the EC2-aware config resolved above.
env:
  AWS_PAGER: ""
  AWS_CONFIG_FILE: "{{.AWS_CONFIG_FILE}}"

tasks:
  install:
    desc: Install the full agentic platform (base platform + spokes + agentic components)
    cmds:
      - task: platform:install
      - task: ingress:post-install
      - task: spokes:install
      - task: agentic:install
      - task: agentic:seed-observability

  upgrade:
    desc: Upgrade the platform, spokes, and agentic components
    cmds:
      - task: platform:upgrade
      - task: spokes:install
      - task: agentic:upgrade

  # ─── Platform (appmod-blueprints) ───────────────────────────────────────────

  platform:clone:
    desc: Clone or update the base platform repo to the configured ref
    cmds:
      # No `status:` guard here. Guarding on the directory existing would skip this
      # task once the clone is present, which silently pins the checkout to whatever
      # ref it was first cloned at and makes changing platform.ref a no-op.
      #
      # The clone is --single-branch, so its refspec only tracks the original branch
      # and a bare `git fetch origin` will not retrieve a different one. Fetch the
      # configured ref explicitly into a remote-tracking branch.
      - |
        set -e
        if [ -d "{{.PLATFORM_DIR}}/.git" ]; then
          cd {{.PLATFORM_DIR}}
          git fetch --quiet origin "+refs/heads/{{.PLATFORM_REF}}:refs/remotes/origin/{{.PLATFORM_REF}}"
          # Check out the remote ref DETACHED and with --force, so the working tree is
          # exactly that ref. This clone is a read-only materialized view of another repo,
          # not a branch we develop on, and treating it as one has bitten twice:
          #   - `git merge --ff-only ... || true` reported success while leaving the
          #     checkout STALE, because the upstream ref had been force-pushed and a
          #     diverged branch cannot fast-forward. The platform then runs old code while
          #     the log claims it is current, which looks exactly like the fix not working.
          #   - local debug edits to .platform survived and silently changed behaviour.
          # --force discards local modifications, which is intended: anything that must
          # persist belongs in this repo. Untracked files are left alone, because the
          # platform writes generated kubeconfigs and credentials under .platform/private/.
          git checkout --quiet --force --detach "origin/{{.PLATFORM_REF}}"
        else
          git clone --quiet --branch {{.PLATFORM_REF}} --single-branch {{.PLATFORM_REPO}} {{.PLATFORM_DIR}}
        fi
        printf '✓ platform %s @ %s\n' "{{.PLATFORM_REF}}" "$(git -C "{{.ROOT_DIR}}/{{.PLATFORM_DIR}}" rev-parse --short HEAD 2>/dev/null || git rev-parse --short HEAD)"

  platform:configure:
    desc: Generate platform config.local.yaml from agentic config
    deps: [platform:clone]
    cmds:
      - |
        cat > {{.PLATFORM_DIR}}/config.local.yaml <<EOF
        clusterProvider: "{{.CLUSTER_PROVIDER}}"
        repo:
          url: "{{.PLATFORM_REPO}}"
          revision: "{{.PLATFORM_REF}}"
          basepath: "gitops/"
        hub:
          clusterName: "{{.HUB_CLUSTER_NAME}}"
          kubernetesVersion: "{{.K8S_VERSION}}"
        aws:
          region: "{{.AWS_REGION}}"
          accountId: "{{.AWS_ACCOUNT_ID}}"
          profile: "{{.AWS_PROFILE}}"
        domain: "{{.DOMAIN}}"
        insecure: {{.INSECURE}}
        resourcePrefix: "{{.RESOURCE_PREFIX}}"
        identityCenter:
          instanceArn: "{{.IDC_INSTANCE_ARN}}"
          region: "{{.IDC_REGION}}"
          adminGroupId: "{{.IDC_ADMIN_GROUP_ID}}"
        argocdCapability:
          name: "argocd"
        fleetRepo:
          url: "{{.AGENTIC_REPO_URL}}"
          revision: "{{.AGENTIC_REPO_REVISION}}"
          basepath: "gitops/"
        EOF

  platform:install:
    desc: Provision the base EKS platform
    cmds:
      - task: platform:clone
      - task: platform:configure
      - cd {{.PLATFORM_DIR}} && task install

  platform:upgrade:
    desc: Upgrade the base platform to the configured ref
    cmds:
      - cd {{.PLATFORM_DIR}} && git fetch origin && git checkout {{.PLATFORM_REF}} && git pull origin {{.PLATFORM_REF}} 2>/dev/null || true
      - task: platform:configure
      - cd {{.PLATFORM_DIR}} && task install

  # ─── Spokes ──────────────────────────────────────────────────────────────────

  spokes:install:
    desc: Provision spoke clusters via Crossplane PlatformCluster claims
    cmds:
      - task: agentic:ensure-kubeconfig
      - |
        SPOKES=$(yq -r '.spokes // {}' {{.CONFIG_FILE}})
        if [ "$SPOKES" = "{}" ] || [ "$SPOKES" = "null" ]; then
          printf '✓ No spokes configured (hub-only).\n'
          exit 0
        fi
        # PlatformCluster CRD lives on the kind-crossplane bootstrap cluster
        CTX="kind-{{.HUB_CLUSTER_NAME}}-bootstrap"
        for SPOKE in $(yq -r '.spokes | keys | .[]' {{.CONFIG_FILE}}); do
          REGION=$(yq -r ".spokes.${SPOKE}.region // \"{{.AWS_REGION}}\"" {{.CONFIG_FILE}})
          K8S_VER=$(yq -r ".spokes.${SPOKE}.kubernetesVersion // \"1.35\"" {{.CONFIG_FILE}})
          VPC_CIDR=$(yq -r ".spokes.${SPOKE}.vpcCidr // \"10.1.0.0/16\"" {{.CONFIG_FILE}})
          AUTO_MODE=$(yq -r ".spokes.${SPOKE}.autoMode // true" {{.CONFIG_FILE}})
          kubectl --context "$CTX" apply -f - <<EOF
        apiVersion: platform.gitops.io/v1alpha1
        kind: PlatformCluster
        metadata:
          name: ${SPOKE}
          namespace: crossplane-system
          annotations:
            crossplane.io/external-name: ${SPOKE}
        spec:
          region: ${REGION}
          clusterName: ${SPOKE}
          vpcCidr: "${VPC_CIDR}"
          kubernetesVersion: "${K8S_VER}"
          autoMode: ${AUTO_MODE}
          argoCDRoleArn: "arn:aws:iam::{{.AWS_ACCOUNT_ID}}:role/{{.HUB_CLUSTER_NAME}}-ArgoCDCapabilityRole"
          writeConnectionSecretToRef:
            name: ${SPOKE}-kubeconfig
        EOF
          printf "✓ PlatformCluster claim applied: %s\n" "$SPOKE"
        done

  spokes:status:
    desc: Check spoke cluster provisioning status
    cmds:
      - task: agentic:ensure-kubeconfig
      - kubectl get platformclusters.platform.gitops.io -n crossplane-system --no-headers 2>/dev/null || printf 'No PlatformCluster claims found.\n'

  spokes:destroy:
    desc: Delete spoke clusters
    cmds:
      - task: agentic:ensure-kubeconfig
      # The PlatformCluster claims are GitOps-managed: the fleet `clusters`
      # ApplicationSet generates `clusters-<env>` Application(s) that own the claims
      # with automated prune. Deleting a claim directly makes ArgoCD immediately
      # re-sync and recreate it, spinning up a fresh spoke EKS + VPC while the old
      # one is still deleting. Stop the generator first, then delete the claims so
      # they stay deleted and Crossplane can drain the spokes cleanly.
      - |
        CTX={{.HUB_CLUSTER_NAME}}
        # Pause the ApplicationSet so it stops regenerating the clusters Application(s).
        if kubectl --context "$CTX" get applicationset clusters -n argocd >/dev/null 2>&1; then
          kubectl --context "$CTX" patch applicationset clusters -n argocd --type merge \
            -p '{"spec":{"syncPolicy":{"preserveResourcesOnDeletion":true}}}' 2>/dev/null || true
          kubectl --context "$CTX" delete applicationset clusters -n argocd --timeout=60s 2>/dev/null || true
        fi
        # Disable self-heal on the generated Application(s) so deleting the claim below
        # is not immediately reverted, then delete the claims.
        for APP in $(kubectl --context "$CTX" get applications -n argocd \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null | grep -E '^clusters(-|$)'); do
          kubectl --context "$CTX" patch application "$APP" -n argocd --type merge \
            -p '{"spec":{"syncPolicy":{"automated":null}}}' 2>/dev/null || true
        done
        for SPOKE in $(yq -r '.spokes | keys | .[]' {{.CONFIG_FILE}}); do
          kubectl --context "$CTX" delete platformcluster.platform.gitops.io "${SPOKE}" -n crossplane-system --ignore-not-found
          printf "✓ PlatformCluster claim deleted: %s\n" "$SPOKE"
        done

  # ─── Agentic Platform ──────────────────────────────────────────────────────

  agentic:install:
    desc: Deploy agentic platform components to the hub (and spokes via ArgoCD)
    cmds:
      - task: agentic:ensure-kubeconfig
      - task: agentic:enable-transaction-search
      - task: agentic:bootstrap

  agentic:upgrade:
    desc: Sync agentic platform components (ArgoCD picks up changes automatically)
    cmds:
      - task: agentic:ensure-kubeconfig
      - task: agentic:bootstrap

  agentic:ensure-kubeconfig:
    desc: Ensure kubectl points to the hub cluster
    cmds:
      - aws eks update-kubeconfig --name {{.HUB_CLUSTER_NAME}} --region {{.AWS_REGION}} --profile {{.AWS_PROFILE}} --alias {{.HUB_CLUSTER_NAME}}
      - kubectl --context {{.HUB_CLUSTER_NAME}} cluster-info >/dev/null
      - printf '✓ kubectl context "{{.HUB_CLUSTER_NAME}}" is reachable\n'

  agentic:enable-transaction-search:
    desc: Enable CloudWatch Transaction Search (one-time, idempotent)
    cmds:
      - |
        printf '▸ Enabling CloudWatch Transaction Search...\n'
        aws logs put-resource-policy --policy-name TransactionSearchXRayAccess \
          --policy-document '{"Version":"2012-10-17","Statement":[{"Sid":"TransactionSearchXRayAccess","Effect":"Allow","Principal":{"Service":"xray.amazonaws.com"},"Action":"logs:PutLogEvents","Resource":["arn:aws:logs:{{.AWS_REGION}}:{{.AWS_ACCOUNT_ID}}:log-group:aws/spans:*","arn:aws:logs:{{.AWS_REGION}}:{{.AWS_ACCOUNT_ID}}:log-group:/aws/application-signals/data:*"],"Condition":{"ArnLike":{"aws:SourceArn":"arn:aws:xray:{{.AWS_REGION}}:{{.AWS_ACCOUNT_ID}}:*"},"StringEquals":{"aws:SourceAccount":"{{.AWS_ACCOUNT_ID}}"}}}]}' \
          --region {{.AWS_REGION}} 2>/dev/null || true
        aws xray update-trace-segment-destination --destination CloudWatchLogs \
          --region {{.AWS_REGION}} 2>/dev/null || true
        printf '✓ CloudWatch Transaction Search enabled\n'

  agentic:hub-oidc-annotation:
    desc: Annotate the hub cluster secret with its EKS OIDC issuer (enables secretless workload identity for agents running on the hub)
    deps: [agentic:ensure-kubeconfig]
    cmds:
      - |
        # The hub is singular and bootstrapped from a kind cluster before the
        # agentic platform exists, so (unlike spokes — which get this annotation
        # automatically from the platform-cluster Crossplane composition) the hub
        # is annotated here. Idempotent; re-applied on every install/upgrade.
        # Customers typically run agents on spokes, not the hub — this exists so
        # the platform is usable hub-only for evaluation without spokes.
        ISSUER=$(aws eks describe-cluster --name {{.HUB_CLUSTER_NAME}} --region {{.AWS_REGION}} --profile {{.AWS_PROFILE}} \
          --query 'cluster.identity.oidc.issuer' --output text)
        kubectl --context {{.HUB_CLUSTER_NAME}} annotate secret {{.HUB_CLUSTER_NAME}} -n argocd --overwrite \
          eks_oidc_provider="${ISSUER}"
        printf '✓ Hub cluster secret annotated: eks_oidc_provider=%s\n' "${ISSUER}"

  agentic:bootstrap:
    desc: Apply the agentic platform bootstrap Application to ArgoCD
    deps: [agentic:ensure-kubeconfig]
    env:
      REPO_URL: "{{.AGENTIC_REPO_URL}}"
      REVISION: "{{.AGENTIC_REPO_REVISION}}"
      BASEPATH: "{{.AGENTIC_REPO_BASEPATH}}"
      HUB_CLUSTER_NAME: "{{.HUB_CLUSTER_NAME}}"
      # Reference model: the appset-chart generator is sourced from the platform
      # repo (appmod-blueprints), not vendored here. These feed the bootstrap
      # Application's source B.
      PLATFORM_REPO_URL: "{{.PLATFORM_REPO}}"
      PLATFORM_REPO_REVISION: "{{.PLATFORM_REF}}"
      # Option A overlay coordinates (empty OVERLAY_REPO_URL → overlay source omitted).
      OVERLAY_REPO_URL: "{{.OVERLAY_REPO_URL}}"
      OVERLAY_REVISION: "{{.OVERLAY_REPO_REVISION}}"
      OVERLAY_BASEPATH: "{{.OVERLAY_REPO_BASEPATH}}"
    cmds:
      - task: agentic:hub-oidc-annotation
      - envsubst '${REPO_URL} ${REVISION} ${BASEPATH} ${HUB_CLUSTER_NAME} ${PLATFORM_REPO_URL} ${PLATFORM_REPO_REVISION} ${OVERLAY_REPO_URL} ${OVERLAY_REVISION} ${OVERLAY_BASEPATH}' < gitops/bootstrap/agent-platform-app.yaml | kubectl --context {{.HUB_CLUSTER_NAME}} apply -f -
      - printf '\n✓ Agentic platform bootstrap applied. ArgoCD will sync components to clusters with enable_agent_platform=true label (set via fleet overlays).\n'

  agentic:seed-observability:
    desc: Wait for AMG/AMP and seed aws_grafana_url into hub/config (required for Keycloak SAML)
    deps: [agentic:ensure-kubeconfig]
    cmds:
      - |
        set -e
        printf '▸ Waiting for AMG workspace to become ACTIVE...\n'
        AMG_ENDPOINT=""
        for i in $(seq 1 60); do
          AMG_ENDPOINT=$(aws grafana list-workspaces --region {{.AWS_REGION}} \
            --query "workspaces[?name=='{{.RESOURCE_PREFIX}}-observability' && status=='ACTIVE'].endpoint | [0]" \
            --output text 2>/dev/null || echo "")
          if [ -n "$AMG_ENDPOINT" ] && [ "$AMG_ENDPOINT" != "None" ] && [ "$AMG_ENDPOINT" != "null" ]; then
            break
          fi
          printf '  [%d/60] AMG not ready yet...\n' "$i"
          sleep 30
        done
        if [ -z "$AMG_ENDPOINT" ] || [ "$AMG_ENDPOINT" = "None" ] || [ "$AMG_ENDPOINT" = "null" ]; then
          printf '⚠ AMG workspace not found after 30 min. Run "task agentic:seed-observability" later.\n'
          exit 0
        fi
        printf '✓ AMG endpoint: %s\n' "$AMG_ENDPOINT"

        # Update hub/config metadata with aws_grafana_url
        CONFIG_KEY="{{.HUB_CLUSTER_NAME}}/config"
        CONFIG_EXISTING=$(aws secretsmanager get-secret-value --secret-id "$CONFIG_KEY" \
          --region {{.AWS_REGION}} --query "SecretString" --output text)
        CONFIG_UPDATED=$(echo "$CONFIG_EXISTING" | python3 -c "
        import sys,json
        d = json.loads(sys.stdin.read())
        m = json.loads(d['metadata'])
        m['aws_grafana_url'] = '$AMG_ENDPOINT'
        d['metadata'] = json.dumps(m)
        print(json.dumps(d))
        ")
        aws secretsmanager put-secret-value \
          --secret-id "$CONFIG_KEY" \
          --secret-string "$CONFIG_UPDATED" \
          --region {{.AWS_REGION}}
        printf '✓ Updated hub/config with aws_grafana_url=%s\n' "$AMG_ENDPOINT"

        # Force fleet-secret ExternalSecret refresh so annotation propagates.
        # The name is suffixed with the cluster name (e.g. fleet-secret-peeks-hub),
        # so discover it rather than hardcoding, the same way the platform does
        # (cluster-providers/*/Taskfile.yaml: grep -i fleet-secret | grep <hub>).
        ES=$(kubectl --context {{.HUB_CLUSTER_NAME}} -n argocd get externalsecret -o name 2>/dev/null \
          | grep -i fleet-secret | grep {{.HUB_CLUSTER_NAME}} | head -1 || true)
        if [ -n "$ES" ]; then
          kubectl --context {{.HUB_CLUSTER_NAME}} annotate "$ES" -n argocd \
            force-sync=$(date +%s) --overwrite
          printf '✓ Fleet secret refresh triggered (%s)\n' "$ES"
        else
          printf '⚠ No fleet-secret ExternalSecret found for %s — skipping refresh.\n' "{{.HUB_CLUSTER_NAME}}"
        fi
      # Run the platform's full observability seeding (AMP creds, Grafana API key,
      # Keycloak SAML update, spoke scraper data). This populates hub/secrets with
      # the fields that grafana-admin-credentials and grafana-amp-creds ExternalSecrets need.
      # Provider-scoped: must match platform.clusterProvider, not a fixed provider.
      - cd {{.PLATFORM_DIR}} && task {{.CLUSTER_PROVIDER}}:secrets-manager:seed-observability

  # ─── Ingress / Domain Post-Install ───────────────────────────────────────────

  ingress:post-install:
    desc: Post-install ingress setup — point DNS at the platform ALB (custom domain only)
    cmds:
      - |
        DOMAIN="{{.DOMAIN}}"
        if [ -z "$DOMAIN" ] || [ "$DOMAIN" = "null" ]; then
          printf '⚠ No domain configured in config.local.yaml. Skipping ingress post-install.\n'
          exit 0
        fi

        # insecure means the consumer terminates TLS upstream and owns whatever sits in
        # front of the load balancer, including its origin configuration. There is
        # nothing for OAP to do here in that case.
        if [ "{{.INSECURE}}" = "true" ]; then
          printf '✓ insecure mode: TLS and the ALB origin are owned upstream. Nothing to do.\n'
          exit 0
        fi

        # Discover the ALB DNS name (created by LBC from grouped ingresses)
        printf '▸ Waiting for ALB to be provisioned...\n'
        ALB_DNS=""
        for i in $(seq 1 12); do
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --region "{{.AWS_REGION}}" \
            --query "LoadBalancers[?contains(LoadBalancerName, 'k8s-platform')].DNSName | [0]" \
            --output text 2>/dev/null || echo "")
          if [ -n "$ALB_DNS" ] && [ "$ALB_DNS" != "None" ] && [ "$ALB_DNS" != "null" ]; then
            break
          fi
          printf '  [%d/12] ALB not ready yet...\n' "$i"
          sleep 10
        done

        if [ -z "$ALB_DNS" ] || [ "$ALB_DNS" = "None" ] || [ "$ALB_DNS" = "null" ]; then
          printf '⚠ ALB not found yet. Run "task ingress:post-install" after ingresses are reconciled.\n'
          exit 0
        fi

        printf '▸ ALB discovered: %s\n' "$ALB_DNS"

        printf '▸ Custom domain: %s\n' "$DOMAIN"
        printf '  ALB DNS: %s\n' "$ALB_DNS"
        RESOLVED=$(dig +short "$DOMAIN" 2>/dev/null | head -1 || echo "")
        if [ -z "$RESOLVED" ]; then
          printf '⚠ Domain %s does not resolve yet.\n' "$DOMAIN"
          printf '  Create a DNS record (CNAME or Route53 alias) pointing to:\n'
          printf '    %s\n' "$ALB_DNS"
        else
          printf '✓ Domain %s resolves to %s\n' "$DOMAIN" "$RESOLVED"
        fi

  # ─── Utilities ──────────────────────────────────────────────────────────────

  status:
    desc: Show status of agentic platform ArgoCD applications
    deps: [agentic:ensure-kubeconfig]
    cmds:
      - kubectl --context {{.HUB_CLUSTER_NAME}} get applications.argoproj.io -n argocd -l "app.kubernetes.io/part-of=agent-platform" --no-headers 2>/dev/null || kubectl --context {{.HUB_CLUSTER_NAME}} get applications.argoproj.io -n argocd --no-headers | grep -E "litellm|langfuse|jaeger|otel|bifrost|agentgateway|agent-gateway|crossplane-agentcore|oam-agent-components"

  destroy:
    desc: Remove agentic platform components (does not destroy the base platform)
    deps: [agentic:ensure-kubeconfig]
    cmds:
      - kubectl --context {{.HUB_CLUSTER_NAME}} delete application agent-platform-addons -n argocd --ignore-not-found
      - printf '\n✓ Agentic platform bootstrap removed. ArgoCD will prune agentic components.\n'
