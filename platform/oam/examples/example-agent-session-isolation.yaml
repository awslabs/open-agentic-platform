# Per-user, per-session isolation — one Application, N isolated sessions.
#
# This is the answer to the question customers keep asking (issue #99):
#
#   "I want each user of my agent to run in an isolated sandbox. Does every user
#    have to submit their own agent definition to get that?"
#
# No. A developer declares the agent ONCE and the sandbox ONCE. The platform
# creates per-session instances on demand and tears them down afterwards. Users
# never write OAM, and there is no Application per tenant to generate, review or
# garbage-collect.
#
# ── THE THREE TIERS ──────────────────────────────────────────────────────────
#
#   isolation: shared   (default) One agent process for everyone. Memory and
#                       context are already per caller, so this is the right
#                       answer for Q&A, retrieval and read-only tools. Costs
#                       nothing extra. Most agents should stay here.
#   isolation: tools    RECOMMENDED FIRST STEP. The agent loop stays shared;
#                       code execution, the filesystem and the browser run in a
#                       per-session sandbox, claimed from the warm pool and
#                       released on idle. A sandbox exists only while a tool
#                       runs — and that is where the prompt-injection blast
#                       radius actually is.
#   isolation: session  This file. A dedicated sandbox instance per
#                       (agent, user, session). Two users, or two sessions of
#                       one user, never share a process, a filesystem or a VM.
#                       Highest cost. For regulated or multi-tenant workloads,
#                       long-lived per-user state, or an
#                       AgentCore-Runtime-equivalent guarantee on EKS.
#
# Switch tiers by editing one word. Nothing else in the Application moves.
#
# ── WHAT STAYS THE SAME, WHICH IS THE POINT ──────────────────────────────────
# The agent is an Argo Rollout in every tier, so blue-green, replicas, the Agent
# Card, gateway registration, memory, evaluation and the identity traits behave
# exactly as they do for a shared agent. In the per-session tiers the Rollout is
# the FRONT DOOR: it resolves the session key and routes the request to that
# session's sandbox. The per-session instance is the `type: sandbox` component
# below, not a replica of the agent.
#
# That is why `replicas: 2` is still meaningful here, and why nothing had to be
# rejected (issue #99, open question 5): two front-door replicas serve many
# sessions, and each session still has its own VM.
#
# ── PRECONDITIONS ────────────────────────────────────────────────────────────
#   1. enable_agent_sandbox: true on the cluster — the agent-sandbox operator is
#      the only source of the SandboxTemplate / SandboxWarmPool / SandboxClaim
#      CRDs.
#   2. session_isolation: "true" on the cluster secret. SEPARATE from the addon
#      on purpose: the CRDs are necessary but not sufficient, because the agent
#      IMAGE has to claim a sandbox per session. Without both, this Application
#      is rejected at admission with a message naming what is missing — rather
#      than deploying an agent that works and silently shares one process
#      between every user, which is the failure #99 exists to remove.
#   3. A Nitro-capable cluster (Kubernetes 1.36+), or one annotated onto Kata.
#      Nothing in this file names either.
apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: data-analyst-isolated
  namespace: default
spec:
  components:
    # ── The agent: declared once, serves every user ──────────────────────────
    - name: data-analyst
      type: agent
      properties:
        description: "Analyses customer data; each session gets its own microVM"
        systemMessage: |
          You are a data analyst. Use the code interpreter for any computation.
          Never guess a number you could calculate.
        modelConfig:
          modelId: claude-sonnet

        # ── The whole feature, from a developer's point of view ──────────────
        isolation: session

        # Which sandbox to claim instances from: the component below. A NAME,
        # because KubeVela has no cross-component typed reference — so a typo
        # here surfaces as claims that fail, not as a render error. The name is
        # published on the agent card (<name>-card ConfigMap, key
        # sandboxWarmPool) so an operator can check what was asked for:
        #   kubectl get cm data-analyst-card -o jsonpath='{.data.sandboxWarmPool}'
        sandboxTemplate: analyst-session

        # What counts as one session. subject+context is the default and the
        # safe one: the caller's gateway subject AND the A2A contextId, so two
        # conversations of one user get two sandboxes, and a client that sends no
        # context falls back to the subject — never sharing with another user.
        #
        #   subject  one sandbox per user, shared by all their conversations.
        #            Cheaper, and enough when the boundary you care about is the
        #            tenant.
        #   context  one sandbox per conversation, ignoring who is calling. For
        #            anonymous or service-to-service callers.
        #
        # (Issue #99, open question 1, answered as a declaration: the right key
        # depends on what this agent's tenants are, which only its developer
        # knows.)
        sessionKey: subject+context

        # Still meaningful, as above: these are front-door replicas, not one per
        # user. The usual multi-replica caveat applies to the FRONT DOOR's own
        # session cache, so pair it with a memory provider.
        replicas: 2

        registerWithGateway: true
      traits:
        # Unchanged by isolation. The trait attaches a projected SA token
        # (audience agentgateway) to the agent's ServiceAccount — the same
        # ServiceAccount the claim RBAC this tier renders is bound to, so the
        # agent has one identity for both calling out and claiming sandboxes.
        - type: gateway-identity

    # ── The per-session instance: declared once, instantiated per session ────
    - name: analyst-session
      type: sandbox
      properties:
        description: "One analysis environment per (agent, user, session)"

        # Replace with your own execution image.
        image: public.ecr.aws/docker/library/python:3.12-slim

        # A warm instance boots BEFORE any claim injects its per-session env, so
        # it idles until the claim arrives and the claimer execs the real
        # entrypoint. Starting work at boot would mean every warm instance ran
        # with no session.
        command: ["sleep", "infinity"]

        # Nitro isolated-sandbox: a microVM per instance, hardware-isolated by
        # the Nitro hypervisor. Not written out — it is the default.
        # mode: isolated

        # ── The cold-start / cost dial ───────────────────────────────────────
        # Three pre-booted instances. With a non-empty pool a new session binds
        # an instance that is already running; with an empty pool the first
        # request waits for a microVM boot, and on a cluster with no spare
        # sandbox-capable node, for a node to be provisioned first.
        #
        # Sizing it is a concurrency question, not a user-count one: it needs to
        # cover the sessions that START at once, not the sessions that exist.
        # Instances beyond the pool are still served, just with cold start.
        warmPool: 3

        # ── What reclaims an instance ────────────────────────────────────────
        # Published here, applied by the claimer on each SandboxClaim. idle is
        # the normal path; maxLifetime is the backstop for a session that never
        # goes idle, which is also how a leaked claim eventually frees its slot.
        idleTimeout: 15m
        maxLifetime: 2h

        # The agent talks to its session's instance over HTTP, so the instance
        # needs a Service.
        service: true
        ports:
          - name: http
            containerPort: 8080

        # Per instance, and the number that decides how many sessions a node
        # holds. The RuntimeClass adds 256Mi on top, plus one
        # eks.amazonaws.com/nitro-sandbox slot; the per-node ceiling is 5x the
        # node's vCPUs in both total sandbox vCPUs and instance count, with
        # memory usually binding first.
        resources:
          requests:
            cpu: "1"
            memory: 2Gi
          limits:
            cpu: "1"
            memory: 2Gi

        workspaceSizeGi: 2
