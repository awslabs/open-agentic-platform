apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: my-assistant
  namespace: default            # → context.namespace for the component's resources
spec:
  components:
    # The component name IS the agent's identity (context.name): it names the
    # Rollout, Services, ServiceAccount, container, AGENT_NAME and gateway route.
    - name: oap-assistant-a
      type: agent
      properties:
        description: "General purpose AI assistant with A2A protocol support"

        # agent image (defaults to the public strands-agent image)
        # image: public.ecr.aws/z0a4o2j5/strands-agent:latest

        # One replica (the default): sessions and A2A tasks live in pod memory.

        systemMessage: |
          You are a helpful AI assistant with access to various tools and capabilities.
          You can help with general questions, data analysis, and task automation.
          Always be clear, concise, and helpful in your responses. When asked about time use the tools.

        modelConfig:
          modelId: claude-sonnet

        # Blue-green deployment settings
        autoPromotionEnabled: true
        autoPromotionSeconds: 10
        scaleDownDelaySeconds: 30

        # AgentGateway registration
        registerWithGateway: true

        mcpServers:
          - name: mcp-time

        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
      traits:
        # Secretless identity to AgentGateway/MCP: projected ServiceAccount token
        # (audience agentgateway) validated by the gateway against the cluster OIDC.
        - type: gateway-identity
