apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: agent-with-tools
  namespace: default
spec:
  components:
    - name: tool-agent
      type: agent
      properties:
        description: "AI assistant with MCP tool integration"

        # No replicas set on purpose, which means one pod.
        #
        # Scaling an agent past one replica is only safe when conversation state
        # lives outside the pod. This agent caches one Agent object per session in
        # memory and there is no A2A session affinity in this stack, so a follow-up
        # request landing on another pod starts from nothing. Add a memory provider
        # (see example-agent-agentcore-memory.yaml) before scaling, then either set
        # replicas or attach an hpa trait.

        systemMessage: |
          You are an AI assistant with access to various tools via MCP.
          You can check weather, search the web, and perform calculations.
          Use tools when appropriate to provide accurate information.

        modelConfig:
          modelId: claude-sonnet
          llmGatewayUrl: http://bifrost.bifrost.svc.cluster.local:8080/v1

        # MCP tool servers (reached through AgentGateway)
        mcpServers:
          - name: weather-tools
          - name: web-search
          - name: calculator

        autoPromotionEnabled: true
        autoPromotionSeconds: 10
        scaleDownDelaySeconds: 30

        registerWithGateway: true

        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
      traits:
        # Secretless identity to AgentGateway/MCP.
        - type: gateway-identity
