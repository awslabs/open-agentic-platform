# Test: Provision AgentCore Memory in isolation
# memoryName is derived (it cannot be set): M<cluster>_agents_agentcore_m_<hash> on a cluster
# that passes global.clusterName, agents_agentcore_memory_test otherwise.
apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: test-memory
  namespace: agents
spec:
  components:
    - name: agentcore-memory-test
      type: agentcore-memory
      properties:
        description: "Test memory for validation"
        eventExpiryDuration: 7
