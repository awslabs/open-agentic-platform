# Test: Provision AgentCore Memory in isolation
# memoryName is derived (it cannot be set): M<cluster>_agents_agentcore_m_<hash>. The chart
# must receive global.clusterName, or the render fails.
apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: test-memory
  namespace: agents
spec:
  components:
    - name: agentcore-memory-test
      type: agentcore-memory
      properties:
        description: "Test memory for validation"
        eventExpiryDuration: 7
