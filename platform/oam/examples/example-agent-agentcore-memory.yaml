# Example: Agent with AgentCore memory, using identity traits (no dp-service-account).
#
# Flow:
#   1. agentcore-memory provisions a Memory via Crossplane and emits an IAM policy
#      (<app>-<component>-iam-policy) for accessing it; memoryId is passed to the agent.
#   2. The agent owns its ServiceAccount (context.name). The aws-service-identity trait
#      creates the IAM role + PodIdentityAssociation via the XPodIdentity Composition
#      (clusterName/region resolved from the env-config EnvironmentConfig — no params)
#      and attaches the memory policy via accessFor.
#   3. The gateway-identity trait gives the agent a projected token for AgentGateway/MCP.
#   4. Long-term memory is per caller: the gateway sets X-Forwarded-User to the caller's
#      token subject and the agent uses it as the memory actor. The agent finds the
#      strategies' namespaces from the memory itself, so nothing else is wired.
#
# No region anywhere: the memory defaults to the cluster's region and the agent uses
# the AWS_REGION that aws-service-identity injects, so this Application is portable.
apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: agent-with-agentcore-memory-app
  namespace: agents
spec:
  components:
    - name: agentcore-short-memory
      type: agentcore-memory
      outputs:
        - name: memory-id
          valueFrom: output.status.atProvider.id
      properties:
        description: "Memory for my-agent"
        eventExpiryDuration: 30
        # Opt-in long-term memory. Omit for short-term only (the conversation within
        # a session). Pick any of: semantic, userPreference, summary.
        strategies: [semantic, userPreference]

    # Component name (my-agent) is the identity: Rollout/Service/SA/container all
    # named my-agent; the traits attach AWS + gateway identity to that same SA.
    - name: my-agent
      type: agent
      dependsOn:
        - agentcore-short-memory
      inputs:
        - from: memory-id
          parameterKey: properties.memory.config.memoryId
      properties:
        description: "Assistant agent with persistent memory"
        systemMessage: "You are a helpful assistant."
        # CPU request guarantees a fair cgroup CPU share + drives scheduler spread,
        # so the CPU-heavy startup isn't starved on a contended node (which caused
        # liveness-kill crashloops). No CPU limit on purpose (avoids startup throttling).
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            memory: "1Gi"
        memory:
          provider: agentcore
          config:
            memoryId: "injected-from-agentcore-memory-output"
      traits:
        # Secretless identity to AgentGateway/MCP.
        - type: gateway-identity
        # Secretless AWS IAM identity (EKS Pod Identity); attach the memory policy.
        - type: aws-service-identity
          properties:
            accessFor:
              - agentcore-short-memory
