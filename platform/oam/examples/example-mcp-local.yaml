# Example: standalone MCP server registered with AgentGateway.
#
# The mcp-server component owns its ServiceAccount and container (both named
# after the component), deploys into the Application's namespace, and registers
# an HTTPRoute at /mcp/<component-name>. Attach aws-service-identity or
# gateway-identity traits to grant identities with no extra wiring.
apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: mcp-time-server
  namespace: default
spec:
  components:
    - name: mcp-time
      type: mcp-server
      properties:
        description: "MCP server that provides current time tools"
        image: "public.ecr.aws/z0a4o2j5/mcp-time-server:latest"
        port: 8000
        replicas: 1
        env:
          - name: LOCAL_TIMEZONE
            value: "UTC"
        registerWithGateway: true
        autoPromotionEnabled: true
        autoPromotionSeconds: 10
        scaleDownDelaySeconds: 30
